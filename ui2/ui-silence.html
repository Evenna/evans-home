<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans — 静默</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .sentence {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    max-width: 640px;
    padding: 0 24px;
    line-height: 1.8;
  }

  .char {
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 18px;
    font-weight: 300;
    color: #d0d0d8;
    opacity: 0;
    animation: charFadeIn 0.6s ease forwards;
    /* delay set via inline style */
    white-space: pre;
  }

  @keyframes charFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>
<div class="sentence" id="sentence"></div>

<script>
  const text = '在这个时刻，沉默是它经过判断后的主动选择。';
  const container = document.getElementById('sentence');
  const STAGGER = 80; // ms per character

  [...text].forEach((char, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = char;
    span.style.animationDelay = (i * STAGGER) + 'ms';
    container.appendChild(span);
  });
</script>
</body>
</html>

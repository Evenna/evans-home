<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幕章标题板</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #07080a;
      font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    }

    /* ── 整体居中容器 ── */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 0;
      gap: 40px;
    }

    /* ── 单条幕章标题 ── */
    .chapter-item {
      display: flex;
      align-items: stretch;
      gap: 16px;
      width: 360px;

      /* 初始状态 */
      opacity: 0;
      transform: translateX(-24px);
    }

    /* 各条目 stagger 延迟 */
    .chapter-item:nth-child(1) {
      animation:
        slide-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s  forwards,
        fade-out 1s   ease-in-out                          3.75s forwards;
    }
    .chapter-item:nth-child(2) {
      animation:
        slide-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1.70s forwards,
        fade-out 1s   ease-in-out                          5.25s forwards;
    }
    .chapter-item:nth-child(3) {
      animation:
        slide-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 3.20s forwards,
        fade-out 1s   ease-in-out                          6.75s forwards;
    }
    .chapter-item:nth-child(4) {
      animation:
        slide-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 4.70s forwards,
        fade-out 1s   ease-in-out                          8.25s forwards;
    }
    .chapter-item:nth-child(5) {
      animation:
        slide-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 6.20s forwards,
        fade-out 1s   ease-in-out                          9.75s forwards;
    }

    /* ── 左侧竖线 ── */
    .chapter-bar {
      width: 2px;
      flex-shrink: 0;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.30);
      align-self: stretch;
    }

    /* ── 文字区域 ── */
    .chapter-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .chapter-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e8e6e0;
      line-height: 1.2;
    }

    .chapter-sub {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #5a5a6a;
      line-height: 1.4;
      text-transform: uppercase;
    }

    /* ── keyframes ── */
    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(-24px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── 展示模式：所有条目同时可见（覆盖上面的动画） ── */
    /* 移除此规则如需只看时序动画 */
    @media (prefers-reduced-motion: no-preference) {
      /* 保留动画，展示模式另做处理 */
    }
  </style>
</head>
<body>

  <div class="stage">

    <!-- ① 第一幕 -->
    <div class="chapter-item">
      <div class="chapter-bar"></div>
      <div class="chapter-content">
        <div class="chapter-title">第一幕 · 序章</div>
        <div class="chapter-sub">Act I — Prologue</div>
      </div>
    </div>

    <!-- ② 第二幕 -->
    <div class="chapter-item">
      <div class="chapter-bar"></div>
      <div class="chapter-content">
        <div class="chapter-title">第二幕 · 硬件</div>
        <div class="chapter-sub">Act II — Hardware</div>
      </div>
    </div>

    <!-- ③ 第三幕 -->
    <div class="chapter-item">
      <div class="chapter-bar"></div>
      <div class="chapter-content">
        <div class="chapter-title">第三幕 · 提效</div>
        <div class="chapter-sub">Act III — Efficiency</div>
      </div>
    </div>

    <!-- ④ 第四幕 -->
    <div class="chapter-item">
      <div class="chapter-bar"></div>
      <div class="chapter-content">
        <div class="chapter-title">第四幕 · 在你左右</div>
        <div class="chapter-sub">Act IV — Always With You</div>
      </div>
    </div>

    <!-- ⑤ 第六幕 -->
    <div class="chapter-item">
      <div class="chapter-bar"></div>
      <div class="chapter-content">
        <div class="chapter-title">第六幕 · 克制</div>
        <div class="chapter-sub">Act VI — Restraint</div>
      </div>
    </div>

  </div>

</body>
</html>

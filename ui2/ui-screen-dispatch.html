<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evans · 跨工具调度</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07080a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .phone-frame {
      width: 390px;
      padding: 20px 16px 28px;
    }

    /* ── 卡片 ── */
    .card {
      position: relative;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      overflow: hidden;
      padding: 18px 20px 20px;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), transparent);
      pointer-events: none;
    }

    /* ── 顶部栏 ── */
    .header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 20px;
    }

    .header-brand {
      font-size: 13px;
      font-weight: 600;
      color: #a0a0b0;
      letter-spacing: 0.04em;
    }

    .header-icon {
      font-size: 15px;
      color: #7eb8e8;
      display: flex;
      align-items: center;
    }

    .header-status {
      font-size: 13px;
      color: #ffffff;
      font-weight: 500;
    }

    .header-pulse {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6ac8b0;
      box-shadow: 0 0 6px #6ac8b0;
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .header-clock {
      margin-left: auto;
      font-size: 13px;
      font-weight: 500;
      color: #a0a0b0;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* ── 分割线 ── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 0 0 16px;
    }

    /* ── 步骤列表 ── */
    .steps { display: flex; flex-direction: column; gap: 10px; }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s cubic-bezier(0.34,1.56,0.64,1),
                  transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }

    .step.visible { opacity: 1; transform: translateY(0); }

    /* done state */
    .step.done .step-title { text-decoration: line-through; color: #a0a0b0; }
    .step.done .step-icon  { color: #6ac8b0; }

    /* active state */
    .step.active {
      background: rgba(126,184,232,0.10);
      border-color: rgba(126,184,232,0.25);
    }
    .step.active .step-title { color: #ffffff; font-weight: 600; }
    .step.active .step-icon  { color: #7eb8e8; }

    .step-icon {
      font-size: 20px;
      color: #a0a0b0;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
    }

    @keyframes spin-slow {
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin-slow 2.4s linear infinite; display: inline-block; }

    .step-body { flex: 1; min-width: 0; }

    .step-title {
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .step-sub {
      font-size: 12px;
      color: #a0a0b0;
      line-height: 1.4;
    }

    /* ── 进度条 ── */
    .progress-wrap {
      margin-top: 9px;
      height: 4px;
      background: rgba(255,255,255,0.10);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7eb8e8, #6ac8b0);
      border-radius: 2px;
      transition: width 1.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ── 按钮 ── */
    .btn-wrap {
      margin-top: 18px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s cubic-bezier(0.34,1.56,0.64,1) 1s,
                  transform 0.5s cubic-bezier(0.34,1.56,0.64,1) 1s;
    }
    .btn-wrap.visible { opacity: 1; transform: translateY(0); }

    .btn-confirm {
      width: 100%;
      padding: 13px 0;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 13px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-confirm:hover  { background: rgba(255,255,255,0.18); transform: scale(1.01); }
    .btn-confirm:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="card">

      <!-- 顶部 -->
      <div class="header">
        <span class="header-brand">Evans</span>
        <span class="header-icon"><i class="ph ph-lightning"></i></span>
        <span class="header-status">正在协调</span>
        <div class="header-pulse"></div>
        <div class="header-clock" id="clock">--:--:--</div>
      </div>

      <div class="divider"></div>

      <!-- 步骤 -->
      <div class="steps">

        <!-- Step 1 完成 -->
        <div class="step done" id="step1">
          <div class="step-icon"><i class="ph ph-check-circle"></i></div>
          <div class="step-body">
            <div class="step-title">识别会议邀约意图</div>
            <div class="step-sub">来自 王总 · Q3 复盘</div>
          </div>
        </div>

        <!-- Step 2 完成 -->
        <div class="step done" id="step2">
          <div class="step-icon"><i class="ph ph-check-circle"></i></div>
          <div class="step-body">
            <div class="step-title">检查日历空档</div>
            <div class="step-sub">明日 14:00–15:00 可用</div>
          </div>
        </div>

        <!-- Step 3 进行中 -->
        <div class="step active" id="step3">
          <div class="step-icon">
            <span class="spin"><i class="ph ph-circle-dashed"></i></span>
          </div>
          <div class="step-body">
            <div class="step-title">起草确认邮件</div>
            <div class="step-sub">正在生成草稿…</div>
            <div class="progress-wrap">
              <div class="progress-fill" id="progress"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- 按钮 -->
      <div class="btn-wrap" id="btnWrap">
        <button class="btn-confirm">
          <i class="ph ph-paper-plane-tilt"></i>
          确认发送
        </button>
      </div>

    </div>
  </div>

  <script>
    // 实时时钟
    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    tick();
    setInterval(tick, 1000);

    // stagger 淡入
    const steps = ['step1','step2','step3'];
    steps.forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('visible');
      }, 200 + i * 220);
    });

    // 进度条动画
    setTimeout(() => {
      document.getElementById('progress').style.width = '65%';
    }, 900);

    // 按钮淡入
    setTimeout(() => {
      document.getElementById('btnWrap').classList.add('visible');
    }, 500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans · 防诈骗拦截</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #07080a;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient glow */
  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(232,160,96,0.05) 0%, transparent 65%);
    pointer-events: none;
  }

  .phone-frame {
    width: 375px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }

  .card {
    position: relative;
    width: 100%;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 20px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px) scale(0.97);
    animation: cardIn 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.15s forwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 14px; right: 14px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    pointer-events: none;
  }

  /* Subtle warning glow on left border */
  .card::after {
    content: '';
    position: absolute;
    top: 20px; bottom: 20px;
    left: 0;
    width: 2px;
    border-radius: 0 1px 1px 0;
    background: linear-gradient(180deg, transparent, rgba(232,160,96,0.5), transparent);
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .warning-icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(232,160,96,0.12);
    border: 1px solid rgba(232,160,96,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .warning-icon-wrap i {
    font-size: 20px;
    color: #e8a060;
  }

  .header-content {
    flex: 1;
  }

  .header-label {
    font-size: 11px;
    font-weight: 600;
    color: #e8a060;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .header-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 0 -20px 16px;
  }

  /* Reason text */
  .reason-text {
    font-size: 13px;
    color: rgba(200,200,210,0.85);
    line-height: 1.6;
    margin-bottom: 14px;
    letter-spacing: 0.01em;
  }

  /* Risk signals */
  .risk-section {
    margin-bottom: 18px;
  }

  .risk-label {
    font-size: 10.5px;
    font-weight: 600;
    color: #a0a0b0;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 9px;
  }

  .risk-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 0;
    opacity: 0;
    transform: translateX(-6px);
    animation: riskIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  .risk-item:nth-child(1) { animation-delay: 0.55s; }
  .risk-item:nth-child(2) { animation-delay: 0.75s; }
  .risk-item:nth-child(3) { animation-delay: 0.95s; }

  @keyframes riskIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .risk-dot {
    margin-top: 4px;
    flex-shrink: 0;
    color: #e8a060;
    font-size: 10px;
  }

  .risk-text {
    font-size: 12.5px;
    color: #c8c8d8;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }

  .risk-highlight {
    color: #e8a060;
    font-weight: 600;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 4px;
  }

  .btn-primary {
    width: 100%;
    padding: 12px 16px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.13);
    backdrop-filter: blur(12px);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.2s ease;
    text-align: center;
    opacity: 0;
    animation: btnIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
  }

  .btn-primary:hover {
    background: rgba(255,255,255,0.18);
  }

  .btn-secondary {
    width: 100%;
    padding: 10px 16px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    color: #a0a0b0;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.2s ease;
    text-align: center;
    opacity: 0;
    animation: btnIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.25s forwards;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.06);
  }

  @keyframes btnIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="card">
    <!-- Header -->
    <div class="card-header">
      <div class="warning-icon-wrap">
        <i class="ph ph-warning"></i>
      </div>
      <div class="header-content">
        <div class="header-label">Evans · 注意</div>
        <div class="header-title">检测到可疑转账请求</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Reason -->
    <p class="reason-text">对方要求立即转账，并强调不要告诉家人——这与已知诈骗话术高度吻合。</p>

    <!-- Risk signals -->
    <div class="risk-section">
      <div class="risk-label">风险信号</div>
      <div class="risk-item">
        <i class="ph ph-dot-outline risk-dot"></i>
        <span class="risk-text">此号码从未出现在你的联系人中</span>
      </div>
      <div class="risk-item">
        <i class="ph ph-dot-outline risk-dot"></i>
        <span class="risk-text">通话语速异常快</span>
      </div>
      <div class="risk-item">
        <i class="ph ph-dot-outline risk-dot"></i>
        <span class="risk-text">话术匹配度 <span class="risk-highlight">94%</span>（冒充公检法类）</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button class="btn-primary">先不转，打给儿子确认</button>
      <button class="btn-secondary">我了解，继续</button>
    </div>
  </div>
</div>

</body>
</html>

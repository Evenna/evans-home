<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans · 时间胶囊</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #07080a;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(126,184,232,0.04) 0%, transparent 65%);
    pointer-events: none;
  }

  .ipad-frame {
    width: 500px;
    padding: 28px 24px;
  }

  .card {
    position: relative;
    width: 100%;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 22px 22px 20px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(18px) scale(0.97);
    animation: cardIn 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    pointer-events: none;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .header-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(126,184,232,0.1);
    border: 1px solid rgba(126,184,232,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .header-icon-wrap i {
    font-size: 18px;
    color: #7eb8e8;
  }

  .header-text-group {
    flex: 1;
  }

  .header-label {
    font-size: 11px;
    font-weight: 600;
    color: #7eb8e8;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1px;
  }

  .header-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin: 0 -22px 18px;
  }

  /* Person rows */
  .person-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 18px;
  }

  .person-row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 14px;
    border-radius: 13px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    transform: translateY(8px);
    animation: rowIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  .person-row:nth-child(1) { animation-delay: 0.45s; }
  .person-row:nth-child(2) { animation-delay: 0.65s; }
  .person-row:nth-child(3) { animation-delay: 0.85s; }

  @keyframes rowIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Avatar */
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(126,184,232,0.12);
    border: 1px solid rgba(126,184,232,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 700;
    color: #7eb8e8;
    letter-spacing: 0;
  }

  .avatar-play {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(106,200,176,0.1);
    border: 1px solid rgba(106,200,176,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar-play i {
    font-size: 20px;
    color: #6ac8b0;
  }

  /* Row content */
  .row-content {
    flex: 1;
    min-width: 0;
  }

  .person-name {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 3px;
    letter-spacing: 0.01em;
  }

  .person-meta {
    font-size: 11.5px;
    color: #a0a0b0;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }

  /* Tag */
  .tag {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(126,184,232,0.1);
    border: 1px solid rgba(126,184,232,0.2);
    font-size: 11px;
    font-weight: 600;
    color: #7eb8e8;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  /* Play button */
  .btn-play {
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: 9px;
    background: rgba(106,200,176,0.1);
    border: 1px solid rgba(106,200,176,0.25);
    color: #6ac8b0;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.2s ease;
    white-space: nowrap;
  }

  .btn-play:hover {
    background: rgba(106,200,176,0.18);
  }

  /* Bottom quote */
  .quote-section {
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    animation: quoteIn 0.6s ease 1.1s forwards;
  }

  @keyframes quoteIn {
    to { opacity: 1; }
  }

  .quote-text {
    font-size: 12px;
    font-style: italic;
    color: rgba(160,160,176,0.7);
    line-height: 1.65;
    letter-spacing: 0.02em;
    text-align: center;
  }
</style>
</head>
<body>

<div class="ipad-frame">
  <div class="card">
    <!-- Header -->
    <div class="card-header">
      <div class="header-icon-wrap">
        <i class="ph ph-graph"></i>
      </div>
      <div class="header-text-group">
        <div class="header-label">Evans</div>
        <div class="header-title">关系记忆</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Person list -->
    <div class="person-list">

      <!-- 陈兰 -->
      <div class="person-row">
        <div class="avatar">兰</div>
        <div class="row-content">
          <div class="person-name">陈兰（妻）</div>
          <div class="person-meta">忌日 11月3日 · 共同记忆 2,847 条</div>
        </div>
        <div class="tag">相识 43 年</div>
      </div>

      <!-- 陈军 -->
      <div class="person-row">
        <div class="avatar">军</div>
        <div class="row-content">
          <div class="person-name">陈军（儿子）</div>
          <div class="person-meta">上次通话 3天前 · 北京 · 程序员</div>
        </div>
        <div class="tag">相识 38 年</div>
      </div>

      <!-- 时间胶囊 -->
      <div class="person-row">
        <div class="avatar-play">
          <i class="ph ph-play-circle"></i>
        </div>
        <div class="row-content">
          <div class="person-name">时间胶囊 · 陈兰留言</div>
          <div class="person-meta">录制于 2019年9月 · 时长 2分14秒</div>
        </div>
        <button class="btn-play">播放</button>
      </div>

    </div>

    <!-- Quote -->
    <div class="quote-section">
      <p class="quote-text">她说，如果有一天你一个人，就让它陪着你。</p>
    </div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人物卡片 · 李明</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #07080a;
      font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
      overflow: hidden;
    }

    /* ── 卡片容器 ── */
    .char-card {
      position: fixed;
      left: 32px;
      bottom: 40px;
      width: 240px;

      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px 18px 14px;

      /* 初始隐藏，等待动画 */
      opacity: 0;
      transform: translateX(-20px);

      animation:
        slide-in  0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
        fade-out  1s   ease-in-out                          3.85s forwards;
    }

    /* 顶部高光线 */
    .char-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      right: 20px;
      height: 1px;
      border-radius: 1px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.20) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 100%
      );
    }

    /* ── 顶行：角色标签 ── */
    .card-label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(6px);
      animation: row-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.65s forwards,
                 fade-out 1s ease-in-out 3.85s forwards;
    }

    .label-text {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #a0a0b0;
      text-transform: uppercase;
    }

    .label-icon {
      font-size: 12px;
      color: #7eb8e8;
      line-height: 1;
    }

    /* ── 主名字 ── */
    .card-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(6px);
      animation: row-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.78s forwards,
                 fade-out 1s ease-in-out 3.85s forwards;
    }

    /* ── 副信息 ── */
    .card-meta {
      font-size: 12px;
      font-weight: 400;
      color: #a0a0b0;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(6px);
      animation: row-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.90s forwards,
                 fade-out 1s ease-in-out 3.85s forwards;
    }

    /* ── 分割线 ── */
    .card-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      margin-bottom: 10px;
      opacity: 0;
      animation: row-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.00s forwards,
                 fade-out 1s ease-in-out 3.85s forwards;
    }

    /* ── 底部小字 ── */
    .card-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateY(4px);
      animation: row-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.08s forwards,
                 fade-out 1s ease-in-out 3.85s forwards;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6ac8b0;
      flex-shrink: 0;
    }

    .badge-text {
      font-size: 10px;
      font-weight: 400;
      color: #6ac8b0;
      letter-spacing: 0.06em;
    }

    /* ── keyframes ── */
    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes row-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="char-card">
    <div class="card-label">
      <span class="label-text">人物</span>
      <i class="ph ph-user label-icon"></i>
    </div>

    <div class="card-name">李明</div>

    <div class="card-meta">28岁 · 产品经理 · 上海</div>

    <div class="card-divider"></div>

    <div class="card-badge">
      <span class="badge-dot"></span>
      <span class="badge-text">胸针佩戴者 · 第3个月</span>
    </div>
  </div>

</body>
</html>

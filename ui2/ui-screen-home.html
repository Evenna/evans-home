<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans · 家居协同</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #07080a;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 40px;
    overflow: hidden;
  }

  /* Ambient background glow */
  body::after {
    content: '';
    position: fixed;
    bottom: -80px;
    right: -80px;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(126,184,232,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 220px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 16px 16px 14px;
    overflow: hidden;
    transform: translateY(20px);
    opacity: 0;
    animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 12px; right: 12px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    pointer-events: none;
  }

  @keyframes cardIn {
    to { transform: translateY(0); opacity: 1; }
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 13px;
  }

  .header-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6ac8b0;
    box-shadow: 0 0 6px rgba(106,200,176,0.7);
    flex-shrink: 0;
  }

  .header-text {
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.02em;
    flex: 1;
  }

  .header-label {
    font-size: 10px;
    color: #6ac8b0;
    font-weight: 500;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin-bottom: 11px;
  }

  /* Action rows */
  .action-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 0;
    opacity: 0;
    transform: translateX(-8px);
  }

  .action-row.visible {
    animation: rowIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes rowIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .action-row:nth-child(1).visible { animation-delay: 0s; }
  .action-row:nth-child(2).visible { animation-delay: 0s; }
  .action-row:nth-child(3).visible { animation-delay: 0s; }
  .action-row:nth-child(4).visible { animation-delay: 0s; }

  .action-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .action-icon i {
    font-size: 14px;
    color: #7eb8e8;
  }

  .action-text {
    flex: 1;
    font-size: 11.5px;
    color: #c8c8d8;
    line-height: 1.3;
    letter-spacing: 0.01em;
  }

  .check-wrap {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(106,200,176,0.15);
    border: 1px solid rgba(106,200,176,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .check-wrap.shown {
    opacity: 1;
    transform: scale(1);
  }

  .check-wrap i {
    font-size: 10px;
    color: #6ac8b0;
  }

  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="card-header">
    <div class="header-dot"></div>
    <span class="header-text">Evans</span>
    <span class="header-label">已为你准备好</span>
  </div>
  <div class="divider"></div>
  <div class="actions-list" id="actionsList">
    <div class="action-row" data-index="0">
      <div class="action-icon"><i class="ph ph-lightbulb"></i></div>
      <span class="action-text">灯光调至 38% · 暖光</span>
      <div class="check-wrap"><i class="ph ph-check"></i></div>
    </div>
    <div class="action-row" data-index="1">
      <div class="action-icon"><i class="ph ph-thermometer"></i></div>
      <span class="action-text">空调 26°C · 已开启</span>
      <div class="check-wrap"><i class="ph ph-check"></i></div>
    </div>
    <div class="action-row" data-index="2">
      <div class="action-icon"><i class="ph ph-coffee"></i></div>
      <span class="action-text">热水壶 · 已开始加热</span>
      <div class="check-wrap"><i class="ph ph-check"></i></div>
    </div>
    <div class="action-row" data-index="3">
      <div class="action-icon"><i class="ph ph-moon"></i></div>
      <span class="action-text">窗帘 · 已拉上</span>
      <div class="check-wrap"><i class="ph ph-check"></i></div>
    </div>
  </div>
</div>

<script>
  const rows = document.querySelectorAll('.action-row');

  function showRow(index) {
    if (index >= rows.length) return;
    const row = rows[index];
    row.classList.add('visible');
    row.style.animationDelay = '0s';

    setTimeout(() => {
      const check = row.querySelector('.check-wrap');
      check.classList.add('shown');
    }, 300);

    setTimeout(() => {
      showRow(index + 1);
    }, 600);
  }

  // Start stagger after card appears
  setTimeout(() => {
    showRow(0);
  }, 700);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans · 毕设答辩</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0c0f;
  --accent: #e5523a;
  --text: rgba(245,245,247,0.9);
  --text-dim: rgba(245,245,247,0.35);
  --mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Inter', system-ui, sans-serif;
  padding: 48px 0 80px;
}

/* header */
.header {
  padding: 0 40px 40px;
  border-bottom: 0.5px solid rgba(255,255,255,0.07);
  margin-bottom: 0;
}
.header h1 {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.header p {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--mono);
  letter-spacing: 0.14em;
}

/* slide wrapper */
.slides {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.slide-row {
  position: relative;
  width: 100%;
}

/* 16:9 ratio container */
.ratio-box {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 9/16 */
  background: #000;
  overflow: hidden;
}

.ratio-box iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  /* scale the 1920-wide slide content to fit */
  transform-origin: top left;
}

/* label strip */
.slide-label {
  position: absolute;
  top: 12px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
  z-index: 10;
}
.slide-label .n {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(10,12,15,0.72);
  padding: 3px 7px;
  border-radius: 3px;
  backdrop-filter: blur(8px);
}

/* divider between slides */
.slide-row + .slide-row {
  border-top: 0.5px solid rgba(255,255,255,0.06);
}
</style>
</head>
<body>

<div class="header">
  <h1>Evans · 毕设答辩</h1>
  <p>张一文 · 清华美院 · 2026 &nbsp;·&nbsp; 17 SLIDES</p>
</div>

<div class="slides" id="slides"></div>

<script>
const SLIDES = [
  { n:'01', file:'01-cover.html',        label:'COVER' },
  { n:'02', file:'02-thesis.html',       label:'THESIS' },
  { n:'03', file:'03-background.html',   label:'BACKGROUND' },
  { n:'04', file:'04-question.html',     label:'CORE QUESTION' },
  { n:'05', file:'05-framework.html',    label:'FRAMEWORK' },
  { n:'06', file:'06-research.html',     label:'RESEARCH' },
  { n:'07', file:'07-architecture.html', label:'ARCHITECTURE' },
  { n:'08', file:'08-memory.html',       label:'MEMORY' },
  { n:'09', file:'09-narrative.html',    label:'NARRATIVE' },
  { n:'10', file:'10-tact-engine.html',  label:'TACT ENGINE' },
  { n:'11', file:'11-orchestration.html',label:'ORCHESTRATION' },
  { n:'12', file:'12-exhibition.html',    label:'EXHIBITION DESIGN · 装置构成' },
  { n:'12b',file:'12b-exhibition.html',  label:'EXHIBITION DESIGN · 实体与影像' },
  { n:'13', file:'13-scenes.html',       label:'SCENES' },
  { n:'14', file:'14-reflection.html',   label:'REFLECTION' },
  { n:'15', file:'15-contribution.html', label:'CONTRIBUTION' },
  { n:'16', file:'16-closing.html',      label:'CLOSING' },
  { n:'17', file:'17-thanks.html',       label:'THANKS' },
];

const container = document.getElementById('slides');

// Each iframe renders a 1920px-wide slide; we scale it to fill the ratio-box.
// We do this after the iframe loads via ResizeObserver on the ratio-box.

function buildSlide(s) {
  const row = document.createElement('div');
  row.className = 'slide-row';

  const box = document.createElement('div');
  box.className = 'ratio-box';
  box.id = 'box-' + s.n;

  const iframe = document.createElement('iframe');
  iframe.src = s.file;
  iframe.title = s.label;
  iframe.loading = 'lazy';
  iframe.setAttribute('scrolling', 'no');

  const label = document.createElement('div');
  label.className = 'slide-label';
  label.innerHTML = `<span class="n">${s.n}</span>`;

  box.appendChild(iframe);
  row.appendChild(box);
  row.appendChild(label);
  container.appendChild(row);

  // Scale iframe so the 1920px content fills the box width
  function scaleIframe() {
    const bw = box.offsetWidth;
    if (!bw) return;
    const scale = bw / 1920;
    iframe.style.transform = `scale(${scale})`;
    iframe.style.width  = '1920px';
    iframe.style.height = '1080px';
    // After scaling, the element still occupies 1920×1080 in layout space;
    // ratio-box with padding-top:56.25% already sizes correctly, so just pin.
    iframe.style.transformOrigin = 'top left';
  }

  // Run on load and on resize
  scaleIframe();
  iframe.addEventListener('load', scaleIframe);

  const ro = new ResizeObserver(scaleIframe);
  ro.observe(box);
}

SLIDES.forEach(buildSlide);
</script>
</body>
</html>

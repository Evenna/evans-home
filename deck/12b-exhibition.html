<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>12b · 展演设计 · 实体与影像</title>
<link rel="stylesheet" href="chrome.css">
<style>
  /* 图片裁剪成精确 16:9 */
  .img-16-9 {
    overflow: hidden;
    position: relative;
  }
  .img-16-9 img {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* 图片上的渐变遮罩 */
  .img-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  /* 硬件图网格里每张的 hover 无效，展示用 */
  .hw-grid-item {
    position: relative;
    overflow: hidden;
  }
  .hw-grid-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .hw-grid-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.5) 100%);
  }
</style>
</head>
<body>
<div class="slide-container" data-screen-label="12b 展演设计 · 实体与影像">

  <div data-object="true" data-object-type="textbox" class="chrome-top">
    <span class="mark"></span>
    <span>12&nbsp;/&nbsp;EXHIBITION DESIGN</span>
    <span class="sep">———</span>
    <span style="color:var(--ink-mid);">实&nbsp;体&nbsp;原&nbsp;型&nbsp;机</span>
  </div>

  <!-- ═══════════════════════════════════════════════
       左半页：PHYSICAL 实体原型机
       大背景图 + 右下角文字说明
  ══════════════════════════════════════════════════ -->

  <!-- 大图：hw2（最暗、最有质感），全出血背景 -->
  <div style="position:absolute; left:0; top:0; width:940px; height:1080px; overflow:hidden; z-index:1;">
    <img src="assets/hw2.png"
         style="width:100%; height:100%; object-fit:cover; object-position:center; display:block; opacity:0.85;">
    <!-- 右侧向内渐变遮罩，融合中缝 -->
    <div style="position:absolute; inset:0;
                background: linear-gradient(to right, rgba(10,10,10,0) 55%, rgba(10,10,10,1) 100%);
                z-index:2;"></div>
    <!-- 上方遮罩（给chrome-top留空间） -->
    <div style="position:absolute; top:0; left:0; right:0; height:120px;
                background: linear-gradient(to bottom, rgba(10,10,10,0.85) 0%, transparent 100%);
                z-index:2;"></div>
    <!-- 下方遮罩 -->
    <div style="position:absolute; bottom:0; left:0; right:0; height:180px;
                background: linear-gradient(to top, rgba(10,10,10,0.9) 0%, transparent 100%);
                z-index:2;"></div>
  </div>

  <!-- hw1/hw3/hw4 三格小图（左侧下方叠加） -->
  <div style="position:absolute; left:40px; bottom:68px; z-index:10;
              display:flex; gap:12px;">
    <div class="hw-grid-item"
         style="width:240px; height:135px; border:0.5px solid rgba(255,255,255,0.12);">
      <img src="assets/hw1.png">
    </div>
    <div class="hw-grid-item"
         style="width:240px; height:135px; border:0.5px solid rgba(255,255,255,0.12);">
      <img src="assets/hw3.png">
    </div>
    <div class="hw-grid-item"
         style="width:240px; height:135px; border:0.5px solid rgba(255,255,255,0.12);">
      <img src="assets/hw4.png">
    </div>
  </div>

  <!-- PHYSICAL 文字标注（叠在左半图上方） -->
  <div style="position:absolute; left:52px; top:130px; z-index:20;">
    <div style="font-family:var(--mono); font-size:10px; letter-spacing:0.26em;
                color:var(--accent); margin-bottom:10px;">PHYSICAL&nbsp;·&nbsp;实体原型机</div>
    <div style="font-family:var(--serif); font-size:52px; font-weight:400;
                color:var(--ink); line-height:1.1; letter-spacing:0.01em;">
      可佩戴<br><span style="font-size:32px; color:var(--ink-mid);">灯效反馈 · 触感交互</span>
    </div>
  </div>

  <!-- 中间细分割线 -->
  <div style="position:absolute; left:940px; top:80px; width:0.5px; height:920px;
              background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1) 20%, rgba(255,255,255,0.1) 80%, transparent);
              z-index:20;"></div>

  <!-- ═══════════════════════════════════════════════
       右半页：VISION FILM 愿景片
       hw5 全出血 + hw6 小展示
  ══════════════════════════════════════════════════ -->

  <!-- 大图：hw5 -->
  <div style="position:absolute; left:940px; top:0; width:980px; height:1080px; overflow:hidden; z-index:1;">
    <img src="assets/hw5.png"
         style="width:100%; height:100%; object-fit:cover; object-position:center; display:block; opacity:0.75;">
    <!-- 左侧融合遮罩 -->
    <div style="position:absolute; inset:0;
                background: linear-gradient(to left, rgba(10,10,10,0) 55%, rgba(10,10,10,1) 100%);
                z-index:2;"></div>
    <!-- 上方 -->
    <div style="position:absolute; top:0; left:0; right:0; height:120px;
                background: linear-gradient(to bottom, rgba(10,10,10,0.85) 0%, transparent 100%);
                z-index:2;"></div>
    <!-- 下方 -->
    <div style="position:absolute; bottom:0; left:0; right:0; height:200px;
                background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, transparent 100%);
                z-index:2;"></div>
  </div>

  <!-- hw6 小展示图（右下） -->
  <div style="position:absolute; right:80px; bottom:68px; z-index:10;">
    <div class="hw-grid-item"
         style="width:380px; height:214px; border:0.5px solid rgba(229,82,58,0.3);">
      <img src="assets/hw6.png">
    </div>
  </div>

  <!-- VISION FILM 文字标注 -->
  <div style="position:absolute; right:80px; top:130px; z-index:20; text-align:right;">
    <div style="font-family:var(--mono); font-size:10px; letter-spacing:0.26em;
                color:var(--accent); margin-bottom:10px;">VISION FILM&nbsp;·&nbsp;愿景片</div>
    <div style="font-family:var(--serif); font-size:52px; font-weight:400;
                color:var(--ink); line-height:1.1; letter-spacing:0.01em;">
      叙事影像<br><span style="font-size:32px; color:var(--ink-mid);">连接情感与系统</span>
    </div>
  </div>

  <!-- 右侧中部说明文字 -->
  <div style="position:absolute; right:80px; top:420px; z-index:20; text-align:right; width:500px;">
    <div style="font-family:var(--mono); font-size:13px; letter-spacing:0.10em;
                color:var(--ink-low); line-height:1.9;">
      以影像叙事打通「系统逻辑」<br>
      与「真实陪伴感」之间的情感距离<br>
      小屏循环播放 · 伴随装置全程
    </div>
  </div>

  <!-- 左侧中部说明文字 -->
  <div style="position:absolute; left:52px; top:430px; z-index:20; width:500px;">
    <div style="font-family:var(--mono); font-size:13px; letter-spacing:0.10em;
                color:var(--ink-low); line-height:1.9;">
      Evans 以可穿戴形态出现在展场<br>
      观众可直接感知其存在与反馈<br>
      现场可触摸 · 可观察
    </div>
  </div>

  <!-- 底注 -->
  <div style="position:absolute; left:50%; bottom:54px; transform:translateX(-50%);
              font-family:var(--serif); font-style:italic; font-size:13px;
              color:var(--ink-low); z-index:30; white-space:nowrap;">
    2&nbsp;/&nbsp;2 &nbsp;·&nbsp; 完整体验覆盖 Evans 七层架构全部环节
  </div>

  <div data-object="true" data-object-type="textbox" class="chrome-bottom">
    <span>EVANS · 张一文</span>
    <span class="page"><strong>12b</strong>/&nbsp;18</span>
  </div>

</div>
</body>
</html>

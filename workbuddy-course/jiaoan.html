下一课\u003c/strong>：汇报 PPT 怎么做才不返工。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>「让它检查有没有编造」这句一定要加，防止它为凑字数编成果。\u003c/li>\n\u003cli>学员没有工作日志时，引导直接在指令里列几条本周做的事。\u003c/li>\n\u003cli>配合定时任务可设成每周五自动生成草稿；功能细节以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 1 · 周报/日报：从\"憋一小时\"到\"点一下\""}, {"gid": 25, "no": 2, "label": "实战 2", "short": "汇报 PPT：明天要讲，今晚还是白板", "summary": "临时被通知明天要汇报，手上就一份文档，PPT 从零搭、找模板、一页页填、调字体配色，做到半夜还丑。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把 2.5 小时的汇报 PPT 压到 20 分钟，而且不用推翻重来。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>临时被通知明天要汇报，手上就一份文档，PPT 从零搭、找模板、一页页填、调字体配色，做到半夜还丑。今天教的不只是「让它做 PPT」——关键是\u003cstrong>怎么做才不返工\u003c/strong>。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 先出大纲，再生成\u003c/strong>\n很多人上来就说「帮我做套 PPT」，它一口气做完、方向全偏，返工比自己做还累。正确做法：让它\u003cstrong>先给大纲，你确认了再生成完整 PPT\u003c/strong>。PPT 返工成本最高，卡在大纲阶段拦住跑偏最省事。\u003c/p>\n\u003cp>\u003cstrong>2. 视觉要求写具体\u003c/strong>\n「深色商务」「重点数字放大」比「做好看点」有效十倍。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>上传一份文档（如《Q3 项目总结》）。\u003c/li>\n\u003cli>粘贴这条指令（注意最后一句）：\n   ```\n   根据我上传的这份《Q3 项目总结》文档，做一套汇报用 PPT：\u003c/li>\n\u003cli>12 页以内，逻辑：背景→做了什么→成果数据→问题→下季度计划\u003c/li>\n\u003cli>每页一个核心观点，文字精简、多用要点和数据，不要整段话\u003c/li>\n\u003cli>风格：简洁商务、深色专业，重点数字放大\u003c/li>\n\u003cli>结尾一页\"总结与致谢\"\n   先给我大纲，我确认后再生成完整 PPT。\n   ```\u003c/li>\n\u003cli>大纲出来后扫一遍，哪页不对直接说「第 3 页换成成果数据」让它改；确认没问题了才说「可以，生成完整 PPT」。\n4.（没文档只有零散要点时）先说「把我下面这些要点整理成汇报逻辑大纲」，确认后再套上面这条生成。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①逻辑顺（背景→做了什么→成果→问题→计划）；②每页一个核心观点，没有整段话堆着；③风格是你要的深色商务；④数据页的数字，自己核对一遍。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：一定先出大纲再生成——这是这节最值钱的一句话。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把文档换成自己手头任意一份，走到「确认大纲」这一步。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：不会函数，也能让它出数据结论。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>数据类页面自己核一遍数字，别让它替你「记忆」数据。\u003c/li>\n\u003cli>学员容易急着一步到位生成 PPT，反复提醒卡在大纲阶段。\u003c/li>\n\u003cli>功能与价格一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 2 · 汇报 PPT：明天要讲，今晚还是白板"}, {"gid": 26, "no": 3, "label": "实战 3", "short": "\"帮我分析下这个数据\"：不会函数也能出结论", "summary": "领导甩来一个 Excel，就一句「看看这个月怎么回事」。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：不会函数，也能 10 分钟出一份带图、带结论、带建议的数据分析报告。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>领导甩来一个 Excel，就一句「看看这个月怎么回事」。透视表你都点不利索，更别说找原因、给建议。注意领导要的不是表格，是\u003cstrong>结论\u003c/strong>。这节课教你不会函数也能出结论。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 别只说「帮我分析」\u003c/strong>\n太空。要告诉它：你拿来干嘛、要它算什么、找什么、给什么建议。\u003c/p>\n\u003cp>\u003cstrong>2. 让它先报异常，再算\u003c/strong>\n脏数据算出来的漂亮结论最坑人。加一句「有异常先告诉我别直接算」，它要是先说「第 5 行金额是空的」，你就躲过一个大坑。它给的「可能原因」，是否成立要你结合业务判断——它不懂你公司内情。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>把一份带数字的表（销售、考勤、费用都行）拖进对话区。\u003c/li>\n\u003cli>粘贴指令（把「跟领导汇报」改成你的用途）：\n   ```\n   分析这份销售数据，我要拿去跟领导汇报：\u003c/li>\n\u003cli>先算整体：总额、环比、同比\u003c/li>\n\u003cli>找出环比下滑最大的 3 个品类/区域，各分析可能原因\u003c/li>\n\u003cli>找出增长最快的 3 个，看能不能复制\u003c/li>\n\u003cli>给我 3 条可执行的下一步建议\u003c/li>\n\u003cli>关键结论配图表（趋势用折线、对比用柱状）\u003c/li>\n\u003cli>汇总成一份分析报告\n   数据里如果有异常值或缺失，先告诉我，别直接算。\n   ```\u003c/li>\n\u003cli>重点看它有没有先报告异常值，再往下算。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①整体数据（总额/环比/同比）算对；②「可能原因」结合业务判断成立；③重要决策相关的数字抽查几个对得上原表；④建议是可执行的，不是空话。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：「有异常先告诉我别直接算」这句一定要加。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把手头任意一份表拖进去跑一份出来，重点看它有没有先报异常。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：会议纪要散会即出，还自动分好待办。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>强调「可能原因是否成立要结合业务判断」，别照单全收。\u003c/li>\n\u003cli>涉及重要决策的数字，自己抽查几个和原表对得上不。\u003c/li>\n\u003cli>价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 3 · \"帮我分析下这个数据\"：不会函数也能出结论"}, {"gid": 27, "no": 4, "label": "实战 4", "short": "会议纪要：散会即出，还自动分好待办", "summary": "一小时的会，你边听边记还怕漏，散会再花一小时整理，谁负责什么、什么时候交还得自己一条条扒。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：散会 5 分钟出纪要 + 责任到人的待办表 + 一段能直接发群的总结。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>一小时的会，你边听边记还怕漏，散会再花一小时整理，谁负责什么、什么时候交还得自己一条条扒。这节课让散会 5 分钟纪要和待办全出来，责任还自动分到人。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 一次要到三样\u003c/strong>\n不光要纪要，还要它分出待办、责任到人、生成一段能直接发群的总结——一次到位。\u003c/p>\n\u003cp>\u003cstrong>2. 待办里的名字和日期，务必自己核\u003c/strong>\n这是人工关口：听错名字、听错日期会误事。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>上传会议录音（没有录音就把转录文字贴进去）。\u003c/li>\n\u003cli>粘贴指令：\n   ```\n   这是今天产品评审会的录音。帮我整理：\u003c/li>\n\u003cli>会议纪要：分「议题」「讨论要点」「结论/决议」三块\u003c/li>\n\u003cli>待办清单：列出每一项 待办事项 + 负责人 + 截止时间（表格）\u003c/li>\n\u003cli>如果有争议未决的点，单独标出来\u003c/li>\n\u003cli>生成一段可直接发群里的会议总结（3-5 句话）\n   纪要发到腾讯文档「会议纪要」文件夹。\n   ```\u003c/li>\n\u003cli>生成后，假装你是主持人，逐条核一遍待办表里的名字和日期。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①纪要三块（议题/讨论要点/结论）齐；②待办表负责人 + 截止时间逐条核对无误；③争议未决点单独标出；④群总结 3-5 句，能直接发。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：待办里的「负责人 + 截止时间」务必自己核对，这是人工关口。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把手头任意一段会议记录或语音转文字贴进去跑一遍，重点核待办表。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：一堆文件批量整理，100 个几秒归类。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>录音要清楚，人声嘈杂会影响转录准确度。\u003c/li>\n\u003cli>涉及敏感讨论的会议，注意录音和上传的合规。\u003c/li>\n\u003cli>价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 4 · 会议纪要：散会即出，还自动分好待办"}, {"gid": 28, "no": 5, "label": "实战 5", "short": "一堆文件要整理：100 个几秒归类", "summary": "月底一堆发票要登记，几百张图片要按类分，下载文件夹乱成一锅粥。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把发票批量识别成表、把乱文件夹按类归好，2 小时的体力活 5 分钟搞定。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>月底一堆发票要登记，几百张图片要按类分，下载文件夹乱成一锅粥。这是纯体力活，最适合交给它。这节演示两个场景：发票登记 + 批量文件归类。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 让它把「识别不清的」单独标出\u003c/strong>\n它把拿不准的挑出来给你，比默默填错强一百倍。\u003c/p>\n\u003cp>\u003cstrong>2. 关键字段人工复核是红线\u003c/strong>\n金额、发票号这类字段，报销/入账前一定人工核，OCR 会有误差。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>\u003cstrong>场景一 · 发票登记\u003c/strong>\n1. 上传一批发票图片/PDF。\n2. 粘贴指令：\n   \u003ccode>我上传了这一批发票图片/PDF。帮我：\n   1. 识别每张的：发票号码、开票日期、金额、开票方、税率\n   2. 汇总成一张 Excel 表，每张一行\n   3. 算出总金额和总税额\n   4. 如果有识别不清的，单独标出来让我核对\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>场景二 · 批量文件归类\u003c/strong>\n3. 粘贴第二条指令：\n   \u003ccode>把这个文件夹里的文件按类型归类（合同/发票/报告/图片…），\n   整理成清晰的子文件夹结构，给我一份归类清单说明。\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①发票每张一行、总额总税额算好；②「识别不清」的被标出来（逐条核）；③金额、发票号抽查对得上；④归类清单对照实际文件夹归对了。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：让它「识别不清的单独标出」，关键字段自己复核——这是红线。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：上传两三张自己的票据（无敏感信息的）跑一遍，看它有没有标出识别不清项，再抽查一个金额。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：竞品/市场调研，做一份每条能溯源的报告。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>金额、发票号这类关键字段，入账前人工复核不可省。\u003c/li>\n\u003cli>提醒上传的票据别含无关的敏感个人信息。\u003c/li>\n\u003cli>价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 5 · 一堆文件要整理：100 个几秒归类"}, {"gid": 29, "no": 6, "label": "实战 6", "short": "竞品/市场调研：从\"不知从哪下手\"到一份带证据的报告", "summary": "领导说「调研一下竞品/这个市场」。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：做一份每条结论都能溯源、区分事实与推测的专业调研报告。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>领导说「调研一下竞品/这个市场」。你搜了两页就晕，信息真假难辨，最后拼出一份自己都没底气的报告。调研报告最怕言之凿凿的假信息。这节课教你做一份\u003cstrong>每条都能溯源\u003c/strong>的报告。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 每条结论标来源、区分事实与推测\u003c/strong>\n让它每个关键结论标来源链接，把「官方信息」和「第三方评价/推测」分开，别混为一谈。\u003c/p>\n\u003cp>\u003cstrong>2. 拿不准就说「未找到」，不许编\u003c/strong>\n搜不到硬编最坑。时效性强的信息（价格、政策）还要核对是不是最新。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>不用上传文件，直接给指令（把【竞品X】换成你行业一个真实竞品名）：\n   ```\n   帮我做一份【竞品X】的调研报告，我要用于内部产品决策：\u003c/li>\n\u003cli>覆盖：产品定位、核心功能、定价、目标用户、优劣势\u003c/li>\n\u003cli>每个关键结论都要标注来源链接，方便我核实\u003c/li>\n\u003cli>区分\"官方信息\"和\"第三方评价/推测\"，别混为一谈\u003c/li>\n\u003cli>最后给一段\"对我们的启示\"（3 条）\u003c/li>\n\u003cli>输出成结构化报告，附一张信息来源表\n   拿不准或搜不到的地方，明确说\"未找到\"，不要编。\n   ```\u003c/li>\n\u003cli>报告出来后，随便点开一两条来源链接看看真不真——这个动作要养成习惯。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①五个维度（定位/功能/定价/用户/优劣势）齐；②关键结论点开来源能核实；③「官方」和「第三方推测」分清；④时效性信息是最新的；⑤搜不到的老实说「未找到」，没硬编。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：每条标来源 + 拿不准说未找到——调研报告最怕假信息说得斩钉截铁。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：换成你行业一个真实竞品名跑一遍，跑完点开一两条来源核实。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：重复邮件/消息，写一次以后一句话套用。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>关键结论点开来源自己扫一眼，尤其要做决策的。\u003c/li>\n\u003cli>时效性强的信息（价格、政策）注意核对是不是最新；涉及 WorkBuddy 自身价格功能，一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003cli>这几个实战有条暗线：你越舍得让它「先报告不确定项」，它给你的东西越靠谱。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 6 · 竞品/市场调研：从\"不知从哪下手\"到一份带证据的报告"}, {"gid": 30, "no": 7, "label": "实战 7", "short": "重复邮件/消息：写一次，以后一句话套用", "summary": "催款邮件、客户跟进、面试邀约、请假报备——这几类话你一周要写几遍。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把高频要写的邮件做成模板，以后一句话填空出成品，从 8 分钟压到 30 秒。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>催款邮件、客户跟进、面试邀约、请假报备——这几类话你一周要写几遍？每次从头组织语言、调语气、检查，一封 5 到 10 分钟。这节课教你\u003cstrong>写一次，以后一句话套用\u003c/strong>。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 两步套路：先做模板，再一句话填空\u003c/strong>\n先花一次功夫把它变成带「可替换空位」的模板，以后用一句话填信息就出成品。模板化的本质——把重复的措辞固定下来，把变化的信息留成空位。\u003c/p>\n\u003cp>\u003cstrong>2. 涉及金额、承诺、法律措辞，发出前自己看一遍\u003c/strong>\n模板帮你省事，但责任在你。对外邮件建议留人工关口，别接自动发送。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>先做模板（留可替换空位是关键）：\n   ```\n   帮我做一个\"客户逾期付款催收邮件\"模板，要求：\u003c/li>\n\u003cli>语气：礼貌但明确，不失专业\u003c/li>\n\u003cli>留出可替换的空位：【客户名】【发票号】【金额】【逾期天数】【付款方式】\u003c/li>\n\u003cli>再给一个\"二次催收\"的加强版\n   ```\u003c/li>\n\u003cli>以后每次用，一句话套用：\n   \u003ccode>用催收模板，客户\"ABC公司\"，发票号 INV-2026-088，金额 1.2 万，逾期 15 天。\u003c/code>\u003c/li>\n\u003cli>把模板存进腾讯文档，或让它记住，下次连模板都不用贴。换成你自己高频写的那类（客户跟进、面试邀约都行），先做模板再一句话套用。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①占位符都被正确替换；②语气礼貌但明确，没过软或过硬；③金额、发票号这些关键信息没填错。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：把重复的措辞固定下来，把变化的信息留成空位。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：挑一类你高频写的邮件/消息，先让它做一版模板，再用一句话套用。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：让 AI 每天自动帮你盯资讯。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>学员第一次常忘记留占位符，提醒他们留空位。\u003c/li>\n\u003cli>涉及金额、承诺、法律措辞的，发出前必须自己看一遍；对外邮件别接自动发送。\u003c/li>\n\u003cli>价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 7 · 重复邮件/消息：写一次，以后一句话套用"}, {"gid": 31, "no": 8, "label": "实战 8", "short": "每天自动帮我盯资讯：不错过又不被淹没", "summary": "每天刷公众号、刷群、刷行业网站，生怕错过大事，结果花一两小时看的全是噪音，重要的还容易漏。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：配一条自动任务，每天把重要资讯精选几条送到你面前，3 分钟看完晨报。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>每天刷公众号、刷群、刷行业网站，生怕错过大事，结果花一两小时看的全是噪音，重要的还容易漏。这节课让 AI 替你盯：\u003cstrong>重要的自动送到你面前，其余的别烦你\u003c/strong>。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 六件事说清，它才不会堆一堆\u003c/strong>\n时间、抓什么、怎么筛、每条给什么、只推几条、发到哪——六件事说清。「只推 Top 5-8 条」是防淹没的关键。\u003c/p>\n\u003cp>\u003cstrong>2. 高影响信息追加搜索补官方来源\u003c/strong>\n热度只帮排序，不代表真实；要做决策的，点开原文或让它补官方来源核实。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>（用到前面学的自动化，没学过自动化那两课的先补课再跑）\n1. 粘贴指令，六件事都写清：\n   \u003ccode>创建一个自动任务：\n   - 每个工作日早上 8:00 执行\n   - 抓取：GitHub 今日热门 + AI 行业动态 + 我关注的这几个公众号新文\n   - 筛选：只保留和\"AI Agent / 办公自动化\"相关的，按重要性排序\n   - 每条给：一句话摘要 + 为什么值得看 + 原文链接\n   - 只推 Top 5-8 条，其余归档\n   - 通过微信助手发给我\n   高影响的信息，追加一次搜索补充官方来源。\u003c/code>\n2. 把抓取源换成你行业的（电商换电商资讯源，HR 换招聘政策源），先按模板改、别急着改结构。\u003c/p>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：明天早上收到一条「精选几条」的行业晨报——①只推了 5-8 条不是几十条；②每条有「为什么值得看」这句判断；③原文链接能点开。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：让 AI 盯资讯，会筛选、会限量比抓得多更重要。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把抓取源换成你行业的，配一条自己的资讯晨报任务，先跑三天再砍掉没用的源。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：复杂项目一条龙，召唤专家团替你统筹。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>自动任务要电脑开机 + 连接器授权有效，不然到点跑不了。\u003c/li>\n\u003cli>别把源写得太泛（如「所有新闻」），先跑三天再优化。\u003c/li>\n\u003cli>价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 8 · 每天自动帮我盯资讯：不错过又不被淹没"}, {"gid": 32, "no": 9, "label": "实战 9", "short": "复杂项目一条龙：召唤\"专家团\"替你统筹", "summary": "做月度经营分析汇报——找数据、分析、做图、写结论、排版，一个人从头忙到尾还容易断档。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：召唤专家团，让团长拆活、分角色并行做，你只在关键节点拍板，大半天的活压到 40 分钟。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>做月度经营分析汇报——找数据、分析、做图、写结论、排版，一个人从头忙到尾还容易断档。这节课不用你自己拆步骤，召唤一个专家团，团长帮你拆活分工。（用到专家团相关内容，没学过的先补课再动手。）\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 背景说清，团长才拆得准\u003c/strong>\n把「我是谁、要干嘛、手上有什么数据、期望什么成果」全交代清楚。\u003c/p>\n\u003cp>\u003cstrong>2. 先出方案再执行\u003c/strong>\n让团长先给拆解方案（谁负责什么、产出什么、哪几步要你确认），你确认后再执行，别一上来就让它闷头跑。简单任务别上专家团，先判断「值不值得拆」。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>粘贴指令，背景和成果说清，最后一句要「先出方案再执行」：\n   \u003ccode>召唤一个专家团，帮我做「10 月经营分析汇报」。背景：我是运营负责人，\n   要在月度会上汇报。手上有这些数据：[上传销售表/流量表]。\n   我期望的最终成果：一份 15 页汇报 PPT + 一段 3 分钟口头汇报稿。\n   请团长先给我拆解方案（谁负责什么、产出什么、哪几步要我确认），\n   我确认后再执行。\u003c/code>\u003c/li>\n\u003cli>团长出方案：会自动拆成数据分析 → 图表 → 结论建议 → PPT 排版 → 汇报稿等角色，还标了哪几步要你确认——这就是检查点思路。\u003c/li>\n\u003cli>你确认方案后，团队并行推进、整合成一整套成品。你只在关键节点拍板（确认结论方向、微调图表）。把场景换成你自己的复杂项目（季度复盘、活动方案都行）。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：拿到一整套分析 + 图表 + PPT + 口头稿——①数据数字对（这个必须你亲自核）；②结论有依据不是空话；③PPT 页数和汇报稿时长符合要求。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：专家团负责统筹，不负责替你担责——关键结论和数字仍要你把关。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把一个自己的复杂项目交给专家团，先写清背景和成果，让团长出方案，先别让它直接跑。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：不会剪不会拍，一句话到成片。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>提醒学员别漏「先出拆解方案再执行」，否则团长闷头就跑。\u003c/li>\n\u003cli>简单任务别上专家团，浪费积分；先判断值不值得拆。\u003c/li>\n\u003cli>价格积分一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 9 · 复杂项目一条龙：召唤\"专家团\"替你统筹"}, {"gid": 33, "no": 10, "label": "实战 10", "short": "做短视频：不会剪不会拍，一句话到成片", "summary": "想给产品做条短视频，或做个知识科普发抖音，但你不会写脚本、不会剪辑、不会配音，外包又贵又慢。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：一句话召唤视频生成团队，走完选题、脚本、渲染、配音、字幕全套，你只确认和验收。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>想给产品做条短视频，或做个知识科普发抖音，但你不会写脚本、不会剪辑、不会配音，外包又贵又慢。这节课教你\u003cstrong>一句话到成片\u003c/strong>，几天的活压到半小时。（用到视频生成团队，没学过的先补课再动手。）\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 要素说清\u003c/strong>\n时长、产品、风格（含竖屏/横屏）、开头钩子、核心卖点、要旁白字幕——都说清。\u003c/p>\n\u003cp>\u003cstrong>2. 分镜阶段一定要确认好再渲染\u003c/strong>\n钱和时间都花在渲染上，等渲染完再发现节奏不对，返工成本很高还烧积分。所以「先给脚本分镜再渲染」是最关键的一句。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>粘贴指令，要素写全，最后一句要「先给脚本分镜再渲染」：\n   \u003ccode>召唤视频生成团队，做一条 45 秒的产品介绍短视频。\n   产品：[一句话介绍或官网链接]。\n   风格：简洁科技感，竖屏，适合发抖音/视频号。\n   要求：开头 3 秒要有钩子，突出\"[核心卖点]\"，配旁白和字幕。\n   先给我脚本和分镜，我确认后再渲染。\u003c/code>\u003c/li>\n\u003cli>出脚本分镜后\u003cstrong>停下来确认节奏对不对\u003c/strong>，别一路点到渲染。\u003c/li>\n\u003cli>确认后它才渲染成片 → 配音字幕 → 交你验收，最后拿到一条可直接发布的竖屏 MP4。把产品换成你自己的（商品、课程、部门宣传都行）。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①开头 3 秒有钩子抓人；②核心卖点突出；③旁白、字幕、转场对得上；④时长符合。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：钱和时间都花在渲染上——分镜阶段一定要确认好再渲染。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把产品换成你自己的，先出脚本分镜、在分镜阶段停下来确认。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：想在团队推 AI，怎么落地、怎么说服人。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>发布默认别全自动——标题、封面、素材版权、合规自己过一遍再发。\u003c/li>\n\u003cli>想学爆款套路，先用拆解团队拆几条同赛道的，再喂给生成团队。\u003c/li>\n\u003cli>价格积分一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 10 · 做短视频：不会剪不会拍，一句话到成片"}, {"gid": 34, "no": 11, "label": "实战 11", "short": "想在团队推 AI：怎么落地、怎么说服人", "summary": "自己用 AI 用爽了想在部门推广，结果同事嫌麻烦不用，老板问「投入这么多有啥回报」，就推不动了。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：用「选低风险高频场景 → 做一页纸推广模板卡 → 用真实数据说服老板」这套方法在团队落地 AI。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>自己用 AI 用爽了想在部门推广，结果同事嫌麻烦不用，老板问「投入这么多有啥回报」，就推不动了。这节课不讲工具，讲\u003cstrong>方法\u003c/strong>：怎么选切入场景、怎么让不懂 AI 的同事也照着用、怎么用数据说服老板。三步落地。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 别一上来搞最复杂、最高风险的\u003c/strong>\n挑一个全组都烦、又不涉及财务法务的（周报、会议纪要、数据周报）。风险低、频率高，最容易建立信任。\u003c/p>\n\u003cp>\u003cstrong>2. 人工关口和负责人是模板卡里最关键的两栏\u003c/strong>\n同事最怕「出了事没人担」，写清这两栏他们才敢用。最后用真实数据说服老板——先跑一周记录「原来 X 小时 → 现在 Y 分钟」，比讲一堆概念管用一百倍。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>选一个你们组真实的高频、低风险场景。\u003c/li>\n\u003cli>让它做一张一页纸推广模板卡：\n   ```\n   帮我做一张【会议纪要自动化】的部门推广模板卡，说明：\u003c/li>\n\u003cli>原流程（原来几个人、多久）\u003c/li>\n\u003cli>需要的输入（录音/文字）\u003c/li>\n\u003cli>产出（纪要+待办表）\u003c/li>\n\u003cli>验收标准（什么算合格）\u003c/li>\n\u003cli>人工关口（哪步要人核对）\u003c/li>\n\u003cli>关键指标（省多少时间）\u003c/li>\n\u003cli>负责人\n   做成一页纸，让不懂 AI 的同事也能照着用。\n   ```\u003c/li>\n\u003cli>自己或小范围跑一周，记录真实 ROI 数据，拿去汇报。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：一套可复制的推广打法——①模板卡真做成一页、一目了然；②写清了人工关口和负责人；③ROI 数据是你真跑出来的，不是估的。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：推广 AI，靠的是低风险场景先建信任 + 真实数据说话。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：选你们组一个真实高频场景，让它做一张推广模板卡。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：怕花冤枉钱，把积分花在刀刃上。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>学员容易挑高风险场景（财务、对外发布），当场纠正到低风险高频的。\u003c/li>\n\u003cli>别漏掉人工关口这一栏。\u003c/li>\n\u003cli>成熟度按 L1→L4 循序，别指望一步到位；价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "实战教学 11 · 想在团队推 AI：怎么落地、怎么说服人"}, {"gid": 35, "no": 12, "label": "实战 12", "short": "怕花冤枉钱：把积分花在刀刃上", "summary": "用之前很多人心里犯嘀咕：积分到底怎么扣的。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：建立清晰的花钱心智——哪些放开用、哪些先试试，把积分花在刀刃上。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>用之前很多人心里犯嘀咕：积分到底怎么扣的？跑个任务会不会一下烧一大把？充了会员怎么回本？这一节不教干活，教你\u003cstrong>花钱心智\u003c/strong>：记住三条规律、四招省法，你就知道哪些放开用、哪些先试试。（具体数字以官网 www.workbuddy.cn 为准，这里只给量级。）\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 三条消耗规律\u003c/strong>\n- \u003cstrong>文字任务\u003c/strong>（写、改、总结、分析）：耗得很少，放开用，别舍不得。\n- \u003cstrong>图片生成\u003c/strong>：先出 1 张看效果，满意了再批量。\n- \u003cstrong>视频生成\u003c/strong>：最贵，一定先拿小片段试。\u003c/p>\n\u003cp>\u003cstrong>2. 省积分四招\u003c/strong>\n1. 复杂任务先用「让它先规划」确认方案，避免反复重跑烧积分。\n2. 图片、视频先小批量试，满意了再放量。\n3. 重复的活存成模板 / Skill，别每次从头生成。\n4. 跑大任务前瞄一眼积分余额，心里有数。\u003c/p>\n\u003cp>\u003cstrong>3. 怎么回本\u003c/strong>\n把积分用在\u003cstrong>高频重复\u003c/strong>的活上（周报、纪要、数据、资讯）。单次省的时间 × 频次，很快就超过会员费。偶尔用一次的场景，免费额度就够。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>打开你的 WorkBuddy，找到积分余额看一眼在哪。\u003c/li>\n\u003cli>想一个你最高频的活，说说该用哪一招省。\u003c/li>\n\u003cli>自测三问：①文字任务你敢不敢放开用？（该敢）②要生成 20 张图，第一步做什么？（先出 1 张试）③每周都要做的报表怎么省？（存模板）\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：脑子里有一张清晰的花钱地图，三问都答得上来。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：文字随便用、图片视频先试、重复的存模板、大任务先看余额——这就是全部心法。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：找到你的积分余额入口，挑一个最高频的活，说说用哪招省。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：本模块的实战可按你最痛的一条切入，不必按顺序。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>新用户注册送的积分先拿来跑高频场景验证价值，别急着烧在视频上。\u003c/li>\n\u003cli>价格和规则一律以官网 www.workbuddy.cn 为准，课上给的数字只是量级参考，别当死数背。\u003c/li>\n\u003cli>别按 7-12 顺序也行，学员在课上跑通一个，他就回本了。\u003c/li>\n\u003c/ul>", "full_title": "实战教学 12 · 怕花冤枉钱：把积分花在刀刃上"}]}]</script>
<script>
const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const LSKEY = 'wb_jiaoan_edits_v1';
// 载入本地保存的编辑版本（若有）
let MODS;
try{ const s=localStorage.getItem(LSKEY); MODS = s? JSON.parse(s): JSON.parse(JSON.stringify(SEED)); }
catch(e){ MODS = JSON.parse(JSON.stringify(SEED)); }
let editing=false, curGid=null, dirty=false;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function flat(){const f=[];MODS.forEach(m=>m.lessons.forEach(l=>{l._mod=m.name;f.push(l)}));return f;}
let FLAT=flat();

// ---- 渲染课表 ----
function renderList(){
  const modBox=document.getElementById('modules');modBox.innerHTML='';
  MODS.forEach((m,mi)=>{
    if(!m.lessons.length)return;
    const sec=document.createElement('div');sec.className='module';
    let cards='';
    m.lessons.forEach(l=>{
      const sz=l.kind==='shizhan';
      cards+=`<div class="card ${sz?'sz':''}" onclick="openL(${l.gid})">
        <button class="del" title="删除这节课" onclick="event.stopPropagation();delCard(${l.gid})">✕</button>
        <span class="clabel">${l.label||'教案'}</span>
        <h3>${esc(l.short)}</h3>
        <p>${esc(l.summary||'')}</p>
        <div class="meta">${l.dur?`<span class="dur">⏱ ${esc(l.dur)}</span>`:''}<span class="go">查看教案 →</span></div>
      </div>`;
    });
    sec.innerHTML=`<div class="mod-head"><span class="mod-emoji">${m.emoji}</span>
      <div><div class="mt">${esc(m.name)}</div><div class="md">${esc(m.desc)}</div></div>
      <span class="mod-line"></span></div><div class="grid">${cards}</div>`;
    modBox.appendChild(sec);
  });
}

// ---- 渲染详情页左侧目录 ----
function renderSide(){
  const dside=document.getElementById('dside');dside.innerHTML='';
  MODS.forEach(m=>{
    if(!m.lessons.length)return;
    const g=document.createElement('div');g.className='dgrp';
    let links='';
    m.lessons.forEach(l=>{
      const sz=l.kind==='shizhan';
      links+=`<a id="nav-${l.gid}" class="${sz?'szi':''}" href="#k${l.gid}" onclick="event.preventDefault();openL(${l.gid})"><span class="ci">${esc(l.label||'')}</span>${esc(l.short)}</a>`;
    });
    g.innerHTML=`<div class="gh"><span class="ge">${m.emoji}</span>${esc(m.name)}</div>${links}`;
    dside.appendChild(g);
  });
}

function rebuild(){FLAT=flat();renderList();renderSide();}
rebuild();

// ---- 打开一节课 ----
function openL(gid){
  if(editing&&curGid!==null)captureEdits(); // 切走前先存下当前编辑
  const l=FLAT.find(x=>x.gid===gid);if(!l)return;
  curGid=gid;
  const sz=l.kind==='shizhan';
  const art=document.getElementById('article');
  art.innerHTML=`<span class="dtag ${sz?'sz':''}">${l._mod} · ${l.label||'教案'}</span>
     <h1>${esc(l.short)}</h1><div class="lbody">${l.html}</div>`;
  document.getElementById('nowTitle').textContent=(l.label?l.label+' · ':'')+l.short;
  document.getElementById('prevBtn').disabled=gid<=0;
  document.getElementById('nextBtn').disabled=gid>=FLAT.length-1;
  document.querySelectorAll('.dside a').forEach(a=>a.classList.remove('active'));
  const na=document.getElementById('nav-'+gid);
  if(na){na.classList.add('active');na.scrollIntoView({block:'nearest'});}
  document.getElementById('listView').classList.add('off');
  document.getElementById('detailView').classList.add('on');
  applyEditableState();
  window.scrollTo(0,0);
  location.hash='k'+gid;
}
function go(d){const i=FLAT.findIndex(x=>x.gid===curGid);const n=FLAT[i+d];if(n)openL(n.gid);}
function showList(){
  if(editing&&curGid!==null)captureEdits();
  document.getElementById('detailView').classList.remove('on');
  document.getElementById('listView').classList.remove('off');
  location.hash='';window.scrollTo(0,0);
}

// ---- 编辑模式 ----
function toggleEdit(){
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  document.getElementById('ebToggle').textContent=editing?'✔ 完成编辑':'✏️ 编辑';
  ['ebSave','ebExp','ebReset','ebTip'].forEach(id=>document.getElementById(id).classList.toggle('eb-hide',!editing));
  applyEditableState();
}
function applyEditableState(){
  const art=document.getElementById('article');if(!art)return;
  const body=art.querySelector('.lbody');
  art.classList.toggle('ed',editing);
  if(body){body.contentEditable=editing?'true':'false';
    const h1=art.querySelector('h1');if(h1)h1.contentEditable=editing?'true':'false';}
}
// 把当前详情页 DOM 里的编辑抓回数据模型
function captureEdits(){
  const l=FLAT.find(x=>x.gid===curGid);if(!l)return;
  const art=document.getElementById('article');if(!art)return;
  const body=art.querySelector('.lbody');const h1=art.querySelector('h1');
  if(body){const nh=body.innerHTML;if(nh!==l.html){l.html=nh;dirty=true;}}
  if(h1){const nt=h1.textContent.trim();if(nt&&nt!==l.short){l.short=nt;dirty=true;}}
}
// 删除课表里一节课
function delCard(gid){
  const l=FLAT.find(x=>x.gid===gid);if(!l)return;
  if(!confirm('确定删除「'+(l.label?l.label+' · ':'')+l.short+'」？\\n（删除后点右下角「保存」才会永久生效，可用「还原」找回）'))return;
  MODS.forEach(m=>{m.lessons=m.lessons.filter(x=>x.gid!==gid)});
  dirty=true;rebuild();
}
// 详情页删除本节课
function delCurrentLesson(){
  const l=FLAT.find(x=>x.gid===curGid);if(!l)return;
  if(!confirm('确定删除当前这节「'+(l.label?l.label+' · ':'')+l.short+'」？'))return;
  const gid=curGid;const idx=FLAT.findIndex(x=>x.gid===gid);
  MODS.forEach(m=>{m.lessons=m.lessons.filter(x=>x.gid!==gid)});
  dirty=true;curGid=null;FLAT=flat();
  const nxt=FLAT[idx]||FLAT[idx-1];
  renderList();renderSide();
  if(nxt)openL(nxt.gid);else showList();
}
// 保存到 localStorage
function saveEdits(){
  if(editing&&curGid!==null)captureEdits();
  try{localStorage.setItem(LSKEY,JSON.stringify(MODS));dirty=false;
    flashBtn('ebSave','✔ 已保存');}
  catch(e){alert('保存失败：'+e.message);}
}
function resetEdits(){
  if(!confirm('还原到原始版本？你所有的删课/改字都会丢失（本浏览器内）。'))return;
  localStorage.removeItem(LSKEY);
  MODS=JSON.parse(JSON.stringify(SEED));dirty=false;
  rebuild();showList();flashBtn('ebReset','✔ 已还原');
}
function flashBtn(id,txt){const b=document.getElementById(id);const o=b.textContent;b.textContent=txt;setTimeout(()=>b.textContent=o,1400);}
// 导出成品 HTML（把当前编辑后的数据烘进一个新文件）
function exportHTML(){
  if(editing&&curGid!==null)captureEdits();
  // 克隆整个文档，替换 seed-data 里的 JSON 为当前编辑后的数据
  const doc=document.documentElement.cloneNode(true);
  const seedEl=doc.querySelector('#seed-data');
  seedEl.textContent=JSON.stringify(MODS).replace(/</g,'\\u003c');
  // 导出版进入时清掉本地旧缓存，确保直接用内嵌数据
  const initScript=doc.querySelector('#seed-data + script');
  if(initScript){ initScript.textContent=initScript.textContent.replace(
    "let MODS;","let MODS; try{localStorage.removeItem('"+LSKEY+"')}catch(e){}"); }
  // 移除编辑态残留
  const b=doc.querySelector('body');if(b)b.classList.remove('editing');
  const full='<!DOCTYPE html>\\n<html lang="zh-CN">'+doc.innerHTML+'</html>';
  const blob=new Blob([full],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='jiaoan.html';document.body.appendChild(a);a.click();a.remove();
  flashBtn('ebExp','✔ 已导出');
}

// 直链 #k5 进入
window.addEventListener('load',()=>{const h=location.hash.match(/k(\d+)/);if(h)openL(+h[1]);});
document.addEventListener('keydown',e=>{
  if(editing)return; // 编辑时不劫持方向键
  if(!document.getElementById('detailView').classList.contains('on'))return;
  if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);if(e.key==='Escape')showList();
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script>
</body></html>

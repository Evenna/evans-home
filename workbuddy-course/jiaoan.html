<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy 零基础实战课</title>
<style>
:root{--bg:#0b0f16;--panel:#12161f;--card:#161d2b;--card2:#1b2333;--border:#26303f;--text:#e7edf5;--dim:#93a1b3;--accent:#4f8cff;--accent2:#7c5cff;--code:#0a0e15;--ok:#3fd08a;--warn:#ffb454;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75;font-size:16px;
background-image:radial-gradient(900px 500px at 15% -8%,rgba(79,140,255,.14),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(124,92,255,.12),transparent 55%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}

/* ---- 顶栏 ---- */
header{padding:54px 0 26px;text-align:center}
.badge{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12.5px;padding:5px 14px;border-radius:20px;margin-bottom:18px;box-shadow:0 6px 20px rgba(79,140,255,.3);letter-spacing:.5px}
header h1{font-size:38px;line-height:1.2;background:linear-gradient(92deg,#fff,#a9c6ff 60%,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;letter-spacing:-.5px}
header .lead{color:var(--dim);font-size:16px;max-width:640px;margin:0 auto}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 22px;min-width:104px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stat b{display:block;font-size:26px;background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12.5px;color:var(--dim)}

/* ---- 模块 & 卡片 ---- */
.module{margin:38px 0}
.mod-head{display:flex;align-items:center;gap:13px;margin:0 0 18px;padding:0 2px}
.mod-emoji{font-size:26px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.mod-head .mt{font-size:20px;font-weight:700;color:#fff}
.mod-head .md{font-size:13px;color:var(--dim);margin-top:2px}
.mod-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px}
.card{position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;cursor:pointer;transition:.18s;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),var(--accent2));opacity:.7;transition:.18s}
.card:hover{transform:translateY(-4px);border-color:#3a4a63;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.card:hover:before{width:5px;opacity:1}
.card .clabel{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.25);padding:2px 9px;border-radius:8px;margin-bottom:11px}
.card.sz .clabel{color:var(--warn);background:rgba(255,180,84,.1);border-color:rgba(255,180,84,.28)}
.card.sz:before{background:linear-gradient(var(--warn),#ff7d54)}
.card h3{font-size:15.5px;color:#fff;line-height:1.4;margin-bottom:7px;font-weight:600}
.card p{font-size:12.8px;color:var(--dim);line-height:1.6;min-height:41px}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:#7c8aa0}
.card .dur{background:var(--code);border:1px solid var(--border);padding:2px 9px;border-radius:7px}
.card .go{margin-left:auto;color:var(--accent);transition:.18s}
.card:hover .go{transform:translateX(3px)}
footer{text-align:center;color:#5f6b7d;font-size:12.5px;padding:40px 0 60px}

/* ---- 详情视图 ---- */
.detail{display:none}
.detail.on{display:block;animation:fade .3s ease}
.list.off{display:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.backbar{position:sticky;top:0;z-index:20;background:rgba(11,15,22,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:13px 0;margin-bottom:6px}
.backbar .wrap{display:flex;align-items:center;gap:14px}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13.5px;padding:8px 15px;border-radius:10px;cursor:pointer;transition:.15s;font-family:inherit}
.back:hover{border-color:var(--accent);color:var(--accent)}
.backbar .now{font-size:13.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-lr{margin-left:auto;display:flex;gap:8px}
.nav-lr button{background:var(--card);border:1px solid var(--border);color:var(--dim);font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer;transition:.15s;font-family:inherit}
.nav-lr button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav-lr button:disabled{opacity:.35;cursor:not-allowed}

/* 详情页两栏：左目录 + 右正文 */
.dwrap{display:flex;max-width:1240px;margin:0 auto;gap:0}
.dside{width:264px;flex:none;position:sticky;top:53px;align-self:flex-start;height:calc(100vh - 53px);overflow-y:auto;padding:20px 12px 40px 22px;border-right:1px solid var(--border)}
.dside .dgrp{margin-bottom:16px}
.dside .gh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#c9b8ff;padding:6px 8px;margin-top:6px;letter-spacing:.3px}
.dside .gh .ge{font-size:14px}
.dside a{display:block;font-size:12.7px;color:var(--dim);text-decoration:none;padding:6px 10px;border-radius:8px;margin:1px 0;border-left:2px solid transparent;transition:.14s;line-height:1.45}
.dside a:hover{color:var(--text);background:var(--card)}
.dside a.active{color:var(--accent);background:var(--card);border-left-color:var(--accent);font-weight:600}
.dside a.szi.active{color:var(--warn);border-left-color:var(--warn)}
.dside a .ci{color:#5f6b7d;font-size:11px;margin-right:5px}
.dmain{flex:1;min-width:0;padding:14px 40px 60px}
@media(max-width:900px){.dside{display:none}.dmain{padding:14px 22px 60px}}
.article{padding:0 0 20px}
.article .dtag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.25);padding:3px 12px;border-radius:9px;margin-bottom:14px}
.article .dtag.sz{color:var(--warn);background:rgba(255,180,84,.1);border-color:rgba(255,180,84,.28)}
.article h1{font-size:29px;line-height:1.3;color:#fff;margin-bottom:22px}
.article h2{font-size:23px;margin:44px 0 4px}
.article h3{font-size:18px;margin:30px 0 12px;color:#fff;padding:13px 17px;background:linear-gradient(135deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden}
.article h3:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.article p{margin:12px 0;color:#d4dce4}
.article ul,.article ol{margin:12px 0 12px 26px}
.article li{margin:7px 0;color:#d4dce4}
.article li::marker{color:var(--accent)}
.article strong{color:#fff}
.article blockquote{border-left:3px solid var(--accent);background:rgba(79,140,255,.08);padding:13px 18px;border-radius:9px;color:var(--dim);margin:16px 0}
.article table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px;background:var(--card);border-radius:11px;overflow:hidden}
.article th{background:linear-gradient(135deg,#243049,#1c2333);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:13.5px}
.article td{padding:10px 14px;border-top:1px solid var(--border);color:#cdd6df;vertical-align:top;font-size:14px}
.article tr:hover td{background:rgba(79,140,255,.05)}
.article code{background:var(--code);color:#8fd3ff;padding:2px 7px;border-radius:5px;font-size:13px;font-family:"SF Mono",Consolas,monospace}
.article pre{background:var(--code);border:1px solid var(--border);border-radius:11px;padding:16px 18px;overflow-x:auto;margin:16px 0}
.article pre code{background:none;color:#c9d1d9;padding:0;font-size:13px;line-height:1.65}
.article hr{border:none;border-top:1px solid var(--border);margin:34px 0}

@media(max-width:640px){header h1{font-size:28px}.article h1{font-size:23px}.grid{grid-template-columns:1fr}}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:#38455a}

/* ===== 编辑模式 ===== */
.editbar{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.eb-btn{display:inline-flex;align-items:center;gap:7px;border:none;font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 17px;border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.16s}
.eb-btn:hover{transform:translateY(-2px)}
.eb-main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.eb-save{background:linear-gradient(135deg,#2ea864,var(--ok));color:#04160c}
.eb-exp{background:var(--card);color:var(--text);border:1px solid var(--border)}
.eb-reset{background:var(--card);color:#ff8f8f;border:1px solid #5a2a2a;font-size:12px;padding:8px 13px}
.eb-hide{display:none!important}
.eb-tip{background:rgba(255,180,84,.14);border:1px solid rgba(255,180,84,.3);color:var(--warn);font-size:11.5px;padding:6px 11px;border-radius:9px;max-width:210px;text-align:right;line-height:1.5}
/* 编辑态下的删除按钮 */
.card .del{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:7px;border:1px solid #5a2a2a;background:rgba(255,80,80,.15);color:#ff9f9f;font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3}
body.editing .card .del{display:flex}
body.editing .card .del:hover{background:rgba(255,80,80,.35);color:#fff}
body.editing .card{padding-right:38px}
/* 详情页可编辑 */
.article.ed{outline:1.5px dashed rgba(79,140,255,.4);outline-offset:8px;border-radius:8px}
.article.ed [contenteditable]{transition:.12s}
.del-lesson{display:none;background:rgba(255,80,80,.14);border:1px solid #5a2a2a;color:#ff9f9f;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer;font-family:inherit}
.del-lesson:hover{background:rgba(255,80,80,.3);color:#fff}
body.editing .del-lesson{display:inline-block}
.ed-hint{display:none;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.25);color:#9cc2ff;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px}
body.editing .ed-hint{display:block}

</style></head><body>

<script id="seed-data" type="application/json">[{"emoji": "🚀", "name": "入门筑基", "desc": "认识智能体、装好用起来、跑通第一个任务", "raw_title": "模块一 · 入门筑基 — 讲师教案", "lessons": [{"gid": 0, "no": 1, "label": "第 1 课", "short": "认识 WorkBuddy：智能体 ≠ 聊天机器人", "summary": "你问过 AI'周报怎么写'吧。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：一句话说清\"WorkBuddy 是能动手交成品的助理，不是只会答话的聊天机器人\"，并把一个需求从\"问题\"改写成\"任务\"。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>\"你问过 AI'周报怎么写'吧？它给你一堆建议，周报还是你自己敲。如果你说一句'把这周三件事写成周报'，它直接给你一份能交的 Word——这就是 WorkBuddy 和普通 AI 最大的不同。这节课不动手，就讲透这一点。\"\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 顾问 vs 助理\u003c/strong>\n普通 AI 像\u003cstrong>顾问\u003c/strong>：你问，它出主意，活你干。WorkBuddy 是\u003cstrong>助理\u003c/strong>：你把任务甩给它，它自己拆步骤、查资料、读你授权的文件、动手做，最后把成品递给你。一句话：\u003ccode>顾问动嘴给建议，助理动手交成品\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为它只是更聪明的聊天机器人。不是更能聊，是更能干——区别就在\"动手\"两个字。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 三个直观区别\u003c/strong>\n① \u003cstrong>能干嘛\u003c/strong>：普通 AI 只回答，它真去执行。② \u003cstrong>文件\u003c/strong>：以前复制粘贴来回倒腾，它能直接读写你\u003cstrong>授权\u003c/strong>的文件。③ \u003cstrong>交付物\u003c/strong>：以前得到一段文字，现在得到能下载的成品文件。\u003c/p>\n\u003cblockquote>\n\u003cp>记住：\u003ccode>交付物：一段文字 → 一个能下载的文件\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 从\"问题思维\"到\"任务思维\"（本课最重要）\u003c/strong>\n问题思维——\"这事儿该怎么办？\"换来一堆建议；任务思维——\"按这个要求做出来\"换来成品。以后你交给它的是\u003cstrong>任务\u003c/strong>，不是\u003cstrong>问题\u003c/strong>。你越把它当能干活的同事，它越有用。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：任务写得像问句、太模糊。模糊的问题只能换来模糊的建议。\u003c/p>\n\u003c/blockquote>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：我交给它的是\u003cstrong>任务\u003c/strong>，不是问题——它会动手，把成品交到我手上。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：列出 3 件你上班最烦、最重复的活（整理表格、写日报、改文件名……），要求是\"重复、能交给别人干\"的具体活，不是\"想变优秀\"这种空话。后面几节课挨个干掉它们。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：先把它请到你电脑上——5 分钟装好、登录，并搞懂积分怎么花（新手最容易在这儿浪费钱）。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>本课不演示装软件/登录，留给第 2 课，避免重复。\u003c/li>\n\u003cli>常被问\"和 ChatGPT 谁强\"——不是强弱，是定位不同：聊天机器人擅长回答，WorkBuddy 擅长把活干完交付。\u003c/li>\n\u003cli>功能、价格一律以官网 www.workbuddy.cn 为准，别背参数。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 1 课 · 认识 WorkBuddy：智能体 ≠ 聊天机器人"}, {"gid": 1, "no": 2, "label": "第 2 课", "short": "下载 · 安装 · 登录 · 积分体系", "summary": "用某些 AI 工具，稀里糊涂就把额度用光、莫名扣费，这种糟心事你可能遇到过。", "dur": "约 15 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 12-15 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：独立完成下载、安装、微信扫码登录，领到新手积分，并建立「文字便宜、多模态贵」的积分直觉。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>用某些 AI 工具，稀里糊涂就把额度用光、莫名扣费，这种糟心事你可能遇到过。WorkBuddy 用「积分」当油费——今天不但把它装好，还让你心里有杆秤：什么活费油、什么活随便造。这节课帮你省两样东西：装软件的时间，和以后不乱花的积分钱。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 三步装好\u003c/strong>\n记住三步：\u003ccode>官网下载 → 微信扫码 → 领新手积分\u003c/code>。下载只认官网 www.workbuddy.cn，别在别处搜安装包。登录用微信扫码，手机点一下就进。进去先看一眼新手赠送的积分。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：去搜索引擎乱下山寨包。只从官网下。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 积分是「油费」，要有感觉（核心）\u003c/strong>\n积分就是开车的油费：走平路（写文字）几乎不烧油；上高速拉货（做文档、分析数据）烧中等；越野爬山（生成图片、视频）最费油。记住：\u003ccode>文字便宜 · 多模态贵\u003c/code>，\u003ccode>生成图/视频前，先瞄一眼余额\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把消耗数字记死。具体数字随官方活动会变，以官网 www.workbuddy.cn 为准；但「文字便宜、多模态贵」这个规律不变。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 付费与进阶（点到为止）\u003c/strong>\n新手用免费额度就够跑完课程大部分练习。套餐分档、具体价格一律以官网 www.workbuddy.cn 为准，今天不用掏钱。有公司给的接口可以自己接（目前只支持 OpenAI 兼容协议），小白直接跳过。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>打开浏览器，输入下面这个网址，点「下载」，选你自己的系统（Windows 或 Mac）。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>www.workbuddy.cn\n\u003c/code>\u003c/pre>\n\u003col>\n\u003cli>双击安装包，一路默认下一步即可，没有坑。\u003c/li>\n\u003cli>首次打开会出现二维码，用手机微信扫码，手机上点确认，即登录——不用记密码。\u003c/li>\n\u003cli>进入主界面后，找到积分余额的显示位置，记住这个数字。\u003c/li>\n\u003cli>做对了应该看到：你已进入主界面，且能看到一个新手赠送的积分余额数字。认得余额位置，是省钱的第一步。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：装好只需三步；积分是油费——文字便宜、多模态贵，动图/视频前先看余额。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：完成安装并扫码登录，截图记录当前积分数。验收：能进主界面，且截图里能看到积分余额。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：软件装好了，打开界面却不知道点哪？下一课带你认清界面结构。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>绝不报死价格/积分数字，一句「以官网为准」兜底。\u003c/li>\n\u003cli>高频疑问「积分用完怎么办」：可充值或等赠送额度，先把免费的用好。\u003c/li>\n\u003cli>进阶接 API 部分小白可整段跳过。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 2 课 · 下载 · 安装 · 登录 · 积分体系"}, {"gid": 2, "no": 3, "label": "第 3 课", "short": "主界面 · 任务 · 工作区三层结构", "summary": "打开一个新软件，最慌的就是这么多按钮该点哪。", "dur": "约 15 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 12-15 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：认清界面三大区域，说清「任务」和「工作区」的区别，并熟练完成「拖文件进输入框」和「在结果区下载成品」两个动作。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>打开一个新软件，最慌的就是这么多按钮该点哪。别慌，WorkBuddy 界面其实就三块，从左到右像三个抽屉，记住各装什么就不发懵了。学完你还会 get 到一个别的 AI 没有的东西——「工作区」，它是以后把 WorkBuddy 当团队用的基础。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 界面三大区域\u003c/strong>\n从左到右三个抽屉：左=任务清单（做过的活按文件夹排列，能搜能筛，设置和连接器在底部）；中=干活的地方（核心对话区，底下输入框，文件可以直接拖进去）；右=拿成品的地方（这是它和聊天机器人的分水岭）。记住：\u003ccode>左=任务清单 · 中=干活 · 右=拿成品\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为右侧结果区可有可无。成品都在右边，别只盯着中间聊天。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 结果区的 4 个标签\u003c/strong>\n\u003ccode>产物 / 全部文件 / 变更 / 预览\u003c/code>。产物看生成的文档/PPT；全部文件列出所有产出；变更显示它改了你文件哪几处；预览让网页/PPT 实时可看。打比方：中间是厨房，右边是出餐口。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：找不到下载。下载在右边产物区，不在聊天里。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 任务 vs 工作区（关键）\u003c/strong>\n任务=一次对话解决一件事，产物就存在这个任务里，像桌上单张便签。工作区（Workspace）=一个装着多文件、多轮任务的项目空间，多个任务甚至多个 Agent 共享同一批文件，像一整个共享桌面。落地一句：\u003ccode>简单活→任务　复杂项目→工作区\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：所有事都开新任务、素材到处散。复杂项目用工作区当共享桌面。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>在中间对话区输入框粘贴下面这条指令并回车。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>帮我写一段 100 字的公司午餐会通知\n\u003c/code>\u003c/pre>\n\u003col>\n\u003cli>回复出现在中间，成品跳到右边「产物」——点开，这里能下载。找到并下载成品。\u003c/li>\n\u003cli>从桌面拖一份任意文件到输入框，直接松手，不用复制粘贴。\u003c/li>\n\u003cli>新建一个工作区，把文件拖进去，感受项目空间：素材放这，多个任务共享。\u003c/li>\n\u003cli>做对了应该看到：右侧产物区出现可下载的通知成品；文件成功拖入；工作区里能看到你放进去的文件。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：左看清单、中间干活、右边拿成品；简单活开任务，复杂项目开工作区。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：用自己的话讲清「任务」和「工作区」的区别，并成功拖入一份文件。验收：能一句话说明两者差别，并演示拖文件成功。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：界面认清了，但发指令前还有个关键开关——三种工作模式，选对又快又省积分。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>演示前确认网络与登录状态，避免发指令没反应。\u003c/li>\n\u003cli>高频疑问「工作区多个任务的文件会互相覆盖吗」：共享同一批文件，改动会在「变更」里显示，能看清改了哪。\u003c/li>\n\u003cli>「便签 vs 文件夹」的比方对区分任务/工作区最好用，可反复用。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 3 课 · 主界面 · 任务 · 工作区三层结构"}, {"gid": 3, "no": 4, "label": "第 4 课", "short": "三种工作模式：Craft / Plan / Ask", "summary": "让 AI 干个大活，它吭哧吭哧做完，方向全错、还白费功夫——这种糟心事你可能遇到过。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：一句话说出 Craft / Plan / Ask 各适合什么活，并在真实场景里选对模式，理解「复杂任务先 Plan」是省积分的核心原则。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>让 AI 干个大活，它吭哧吭哧做完，方向全错、还白费功夫——这种糟心事你可能遇到过。WorkBuddy 给了你一个「防跑偏」开关：三种模式。这节课就学这一个开关怎么拨，拨对了简单活立刻出结果，复杂活不跑偏、不烧冤枉积分。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 三种模式各是什么\u003c/strong>\n一模式一句口诀：\u003ccode>Craft=直接做 · Plan=先出计划再做 · Ask=只聊\u003c/code>。Craft 是「你说我做」，立即行动、日常首选；Plan 是「先想后做」，它先给方案、你确认它才动手，复杂项目或方向没定时用；Ask 是「只聊不动手」，只回答、绝不碰你文件，咨询或对比方案时用。打比方：Craft 是直接下单，Plan 是先看菜单点头再做，Ask 是打电话问问不点单。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为 Ask 也会生成文件。Ask 绝不碰你的文件，就是安全地聊。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 怎么选（一句话）\u003c/strong>\n记死一句：\u003ccode>90% 日常 = Craft\u003c/code>。简单活（写通知、做表）用 Craft 立刻做；复杂活（搭网站、整理大项目）用 Plan 先出计划再执行；只想问、不想它动文件用 Ask。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：什么都用 Plan，反而拖慢简单活。简单活别 Plan，多此一举。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 省钱第一原则\u003c/strong>\n新手最常犯的错：一上来对超复杂需求直接 Craft，方向全错、还白花积分。记住：\u003ccode>复杂任务先 Plan = 省钱\u003c/code>。花几秒确认方案，省的是大把返工和积分。判断标准很简单——方向定没定，没定就 Plan。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：90% 日常用 Craft 直接做；复杂活先 Plan 防跑偏省积分；只咨询用 Ask 不碰文件。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把你工作里 3 件烦人的活，各判断该用 Craft 还是 Plan，写下理由（简单/清楚→Craft，复杂/方向未定→Plan）。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：会拨开关了，下一课我们跑通第一个完整任务，打好所有高阶用法的地基。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>这是认知课，重点讲「怎么选」，别陷进逐个功能演示。\u003c/li>\n\u003cli>高频疑问「Plan 会额外多花积分吗」：先出计划是为避免大返工，整体反而更省，别为省一步计划而反复重做。\u003c/li>\n\u003cli>用「方向定没定」当判断标尺，比「复杂到什么程度」更好落地。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 4 课 · 三种工作模式：Craft / Plan / Ask"}, {"gid": 4, "no": 5, "label": "第 5 课", "short": "完成第一个真正的任务（任务简报 + 验收）", "summary": "跟同事说「帮我写个通知」，结果完全不是你想要的，来回改五六遍——这种经历你肯定有过。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 15-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：写出「任务简报 + 交付格式 + 验收标准」三件套，跑通「下任务 → 拿成品 → 对照验收 → 追问修改」的完整闭环。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>跟同事说「帮我写个通知」，结果完全不是你想要的，来回改五六遍——这种经历你肯定有过。跟 AI 也一样。今天这节课就教你怎么把话说明白，让它一次就做到位。学完，你交代任务的水平会超过公司里大多数人，因为你会用一套「三件套」把任务讲到无法误解。这是后面所有高阶玩法的地基。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 为什么「一句话需求」总是做不好\u003c/strong>\n只说「写个周会通知」，它不知道你哪个部门、几点开、要带什么，只能瞎编。\u003ccode>不是它笨，是需求没说清\u003c/code>。就像打车只说「去公司」，司机不知道往哪开。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「AI 应该能猜到我要什么」。AI 不读心，信息越具体，它做得越准。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 一个好任务的三件套\u003c/strong>\n\u003ccode>三件套：简报 + 格式 + 验收\u003c/code>。①任务简报——告诉它背景、目标、具体要求，像交代实习生干活得说清来龙去脉。②交付格式——要 Word 还是 Markdown？几页？什么风格？不说格式，它就按自己习惯给。③验收标准（重点）——你凭什么说这活干好了？\u003ccode>验收标准要先想好\u003c/code>，就像考试前先看评分标准。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把验收放最后凭感觉判断。验收标准必须动手前就列出来，否则你只会「感觉不太对」却说不出哪不对。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. L1 毕业标准\u003c/strong>\n一个目标感：同类任务连续 3 次输出都能直接验收通过，你就可以把它做成模板一键复用。记住：\u003ccode>同类任务 3 次都过 → 可升级模板\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>切到 Craft 模式（适合做正式产物，会一步步跟你打磨）。\u003c/li>\n\u003cli>在输入框粘贴下面这份完整任务简报——注意每一部分对应三件套的哪一件（背景+目标是简报，字数标题是格式）：\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>背景：我是市场部，本周五下午 3 点开周会，地点大会议室。\n目标：写一份周会通知。\n要求：语气正式、包含时间地点、需带上的材料（各自本周数据）、\n      迟到规则一句话。\n格式：正文 300 字以内 + 一句话标题。\n\u003c/code>\u003c/pre>\n\u003col>\n\u003cli>发送，拿到成品后，用你的验收清单逐条对照：\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>[ ] 时间、地点、材料齐全？\n[ ] 语气符合你公司文化？\n[ ] 字数、标题符合要求？\n\u003c/code>\u003c/pre>\n\u003col>\n\u003cli>不满意别重写，直接追问在原稿上改，说人话就行：\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>标题再正式一点，另外加一句线上参会链接占位。\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>做对了应该看到：它在原稿基础上修改，没有推倒重来，且改后能通过你的验收清单。\u003c/li>\n\u003cli>进阶技巧：很复杂的东西（如完整方案），先让它出框架 → 你确认结构 → 再让它填成完整版 → 最后微调，别一次求完美。\u003c/li>\n\u003c/ul>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：把任务交代到「无法误解」，靠简报 + 格式 + 验收三件套；验收标准一定要动手前先想好。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：挑一件自己工作里的活，按三件套写一遍，跑通一次完整闭环。验收：交出①完整三件套任务②你列的验收清单③改了几轮才通过（1 轮也行，说明简报写得好）。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：你会下任务了，但 WorkBuddy 有四种「用法档位」，下节课给你一张全局地图。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>讲「一句话需求」的坏处时，重点落在「可控」而非「好坏」——就算它偶尔猜对，也强调猜错风险大。\u003c/li>\n\u003cli>高频疑问「不知道要什么格式」：先想「这东西最后发给谁、用在哪」，用途决定格式；或让它「先给两个格式方案我选」。\u003c/li>\n\u003cli>验收标准的粗细看重要程度：小活可简写，越正式越要写清。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 5 课 · 完成第一个真正的任务（任务简报 + 验收）"}, {"gid": 5, "no": 6, "label": "第 6 课", "short": "四种能力形态：普通任务 / Skill / 专家 / 专家团", "summary": "家里一套工具箱：拧个螺丝用螺丝刀就行，何必动电钻。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：说出四种能力形态各自适合什么问题，理解「专家 = 带方法论的 AI 同事」，拿到一件活能判断该用哪一档。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>家里一套工具箱：拧个螺丝用螺丝刀就行，何必动电钻？但要在墙上打十个洞，还用螺丝刀就是自己折磨自己。WorkBuddy 也一样，有四个「档位」。今天不教操作，就给你一张地图——以后拿到任何一件活，都知道该掏哪个工具，不再「杀鸡用牛刀」或「小马拉大车」。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 四种能力形态（全局地图）\u003c/strong>\n- \u003cstrong>普通任务\u003c/strong>——通用理解和执行，啥都能干一点的多面手，适合一次性、说得清的活。例：写通知、做表。\n- \u003cstrong>Skill（技能）\u003c/strong>——一个特定工具能力，专干某个动作且干得稳，像手机里的一个个 App。例：下视频、发公众号、生成 PDF。\n- \u003cstrong>专家\u003c/strong>——人设 + 方法论 + 工具链，不只会干，还带专业套路，像有多年经验的老师傅。例：数据分析专家、运营专家。\n- \u003cstrong>专家团\u003c/strong>——多位专家 + 协作流程，能自己分工、并行、汇总，像一整支能开会分工的团队。例：视频生产团队、投资私董会。\u003c/p>\n\u003cp>记住：\u003ccode>多面手 / 专用App / 老师傅 / 一支队伍\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>2. 专家为什么和普通任务不一样（划重点）\u003c/strong>\n同一份销售数据：普通 Agent 会读数据 → 出图 → 总结趋势，把数据描述一遍；数据分析专家会先理解业务目标 → 定核心指标 → 查数据质量 → 找异常 → 分析原因 → 给可落地建议。\u003ccode>普通 = 描述发生了什么；专家 = 带方法论，告诉你为什么+怎么办\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为专家只是「更聪明的普通任务」。区别不在聪明，在于专家自带一套专业流程和岗位视角。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 一句话记忆 + 怎么选\u003c/strong>\n\u003ccode>同事 → 专业同事 → 一支团队\u003c/code>：普通 = 通用 AI 同事，专家 = 有岗位经验的 AI 同事，专家团 = 能自己分工的 AI 团队。选档口诀：\u003ccode>清楚一次性→普通 / 反复动作→Skill / 要深度→专家 / 大项目→专家团\u003c/code>。现在你不用会用它们，有这张地图就够了。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：四档——普通任务、Skill、专家、专家团；核心是用对档位，专家和团队强在带着方法论和分工。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把工作中的 5 件事各归到一档，并写一句「为什么是这档」。验收：交出 5 行的表（事项 + 档位 + 一句理由），四档至少覆盖 2 档以上。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：你已经有了全局地图，下一模块进办公实战。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>这是认知课，别讲成「功能列表」，始终用「工具箱 / 选对工具」主线，让学员拿自己的活对号入座。\u003c/li>\n\u003cli>高频疑问「Skill 和专家啥区别」：Skill 是一个具体动作工具，专家是带方法论的岗位角色；前者管「做这一下」，后者管「用专业思路把整件事做透」。\u003c/li>\n\u003cli>涉及各档位是否收费，一律答「以官网 www.workbuddy.cn 为准」。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 6 课 · 四种能力形态：普通任务 / Skill / 专家 / 专家团"}]}, {"emoji": "📊", "name": "办公实战", "desc": "Word/Excel/PPT、数据分析、文件处理、会议、调研", "raw_title": "模块二 · 办公实战 — 讲师教案", "lessons": [{"gid": 6, "no": 7, "label": "第 7 课", "short": "办公三件套：一句话出 Word / Excel / PPT", "summary": "今天要汇报的 PPT，昨晚还是一块白板吧。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 15-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：用「背景+目标+具体要求+输出格式」让 WorkBuddy 一次生成合格的 Word/Excel/PPT，并从右侧结果区下载文件、用分步迭代做微调。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>今天要汇报的 PPT，昨晚还是一块白板吧？领导一句「做个表」你就头大？办公三件套是打工人最大的时间黑洞。这节课干一件事——把周报、表格、PPT 从一小时压到一句话。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 说清需求，结果差十倍（万能公式）\u003c/strong>\n让实习生「帮我写个周报」，他不知道你干了啥只能瞎编；说清「我是运营、这周做了啥、分几块、语气正式」，一遍就能交活。AI 一模一样。记住：\u003ccode>背景 + 目标 + 具体要求 + 输出格式\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为字越多越好。是「关键信息别漏」，背景（你是谁/干了啥）最容易漏。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 分步迭代（尤其做 PPT）\u003c/strong>\n做 PPT 别一口气把所有要求砸过去：\u003ccode>先出框架 → 确认结构 → 生成完整 PPT → 微调风格\u003c/code>。就像装修先定户型图再铺瓷砖，不会推倒重来。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：一次丢一大堆要求，结果哪儿都不对，还得全推翻。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>先做周报 Word。粘贴指令回车（注意说清了「我是谁、干了啥、分几块、什么格式、什么语气」），成品会在右侧结果区排好版，点下载导出 .docx：\u003c/p>\n\u003cpre>\u003ccode>我是市场部专员，本周完成：新品发布会筹备、2 篇公众号推文、\n对接 3 家媒体。写一份本周工作周报，Word，\n分「本周完成」「下周计划」「需要支持」三板块，语气正式。\n\u003c/code>\u003c/pre>\n\u003cp>不满意直接追一句（如「把语气改活泼点」），它在原文上改，不用重来。\u003c/p>\n\u003cp>再做项目排期表 Excel。粘贴回车，右侧会生成带列名和示例数据的表格，可下载 .xlsx：\u003c/p>\n\u003cpre>\u003ccode>做一份项目排期表，Excel，含列：任务名称、负责人、\n开始时间、结束时间、状态。预填 10 行示例数据。\n\u003c/code>\u003c/pre>\n\u003cp>要它预填示例数据，你能直接看懂表长啥样，改起来快。\u003c/p>\n\u003cp>最后从大纲生成 PPT，重点体会分步迭代。先粘贴完整大纲指令回车，右侧会出可下载的 .pptx：\u003c/p>\n\u003cpre>\u003ccode>按以下大纲做一份 PPT，简洁商务风，配色深蓝+白：\n封面（产品名+Logo）、目录、行业痛点、核心功能、\n竞品对比、商业模式、团队、联系方式。\n\u003c/code>\u003c/pre>\n\u003cp>再追问微调，每追一句看它在原稿上改：\u003ccode>第 3 页配一张图\u003c/code>、\u003ccode>整体字号调大\u003c/code>、\u003ccode>把竞品对比改成表格\u003c/code>。\n- 做对了应该看到：右侧结果区分别出现可下载的 .docx / .xlsx / .pptx，追问后是在原稿上修改而非重做。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：需求说清楚（背景+目标+要求+格式），一句话就能出可下载的 Word/Excel/PPT。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把周报指令换成你真实的工作，生成一份自己的周报并下载。验收：交出一个 .docx，含「本周完成/下周计划/需要支持」三块且内容真实。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：今天是动嘴让它写，下节课把一份 Excel 直接拖给它做数据分析出报告。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>PPT 生成较慢，录制时可提前跑好一版再演示微调，避免干等。\u003c/li>\n\u003cli>高频疑问「生成的文件能编辑吗」：能，下载后是标准 .docx/.xlsx/.pptx；「配色能指定吗」：能，在指令里写「配色深蓝+白」。\u003c/li>\n\u003cli>涉及积分消耗/生成上限，一律答「以官网 www.workbuddy.cn 为准」。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 7 课 · 办公三件套：一句话出 Word / Excel / PPT"}, {"gid": 7, "no": 8, "label": "第 8 课", "short": "数据分析与可视化：拖一份 Excel 出报告", "summary": "职场最怕哪句话。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 15-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把一份 Excel 拖进对话框，用大白话让它自动清洗、汇总、出图，生成带图表的分析报告，并对报告追问微调；同时守住「关键结论人工复核口径」的边界。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>职场最怕哪句话？「你帮我分析下这个数据。」VLOOKUP 记不全、透视表点开就晕，可领导下午就要结论。今天教你一招：Excel 一拖，它替你找异常、给原因、出图表，你只管拿结论去汇报——不用会函数、不用会画图。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 全自动五步\u003c/strong>\n把文件拖进去，用大白话说想看啥，剩下它全包：\u003ccode>读取 → 清洗 → 计算 → 画图 → 生成报告\u003c/code>。读取是把文件看懂，清洗是把乱数据擦干净，计算是该加和加、该分组分组，画图是自动画柱状/折线，最后拼成一份能看的报告。就像把一筐乱菜丢给厨师，端上来是一盘成品，你不用管中间刀工。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为要先把数据整理干净才能用。不用，脏数据也能丢，让它「清洗并说明清洗了什么」。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 边界——判断归你\u003c/strong>\nAI 帮你省时间，不替你担责。给领导/客户的关键结论，一定人工复核口径：\u003ccode>AI 缩短处理时间，判断仍归你\u003c/code>。比如「销售额」含不含退款、时间窗口对不对，这些它不一定懂你公司的规矩。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：直接拿 AI 结论去汇报不核对口径，一旦口径错，锅是你的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>先走主流程。把一份 Excel 直接拖进对话框（不用另存、不用整理），再输入指令回车：\u003c/p>\n\u003cpre>\u003ccode>分析这份销售数据，按月汇总各产品线销售额，\n生成柱状图和趋势折线图，找出销售额 Top 5 区域，\n输出一份含图表的分析报告（HTML 格式）。\n\u003c/code>\u003c/pre>\n\u003cp>注意说清了「按什么汇总、要哪两种图、找什么、什么格式」——又是万能公式的思路。右侧很快会出现可预览的交互式 HTML 报告，鼠标划过图表可交互。\u003c/p>\n\u003cp>再追问微调，看它在原报告上改：\u003c/p>\n\u003cpre>\u003ccode>图表换暖色系\n加一段执行摘要\n把结论做成 3 页 PPT，给领导汇报用\n\u003c/code>\u003c/pre>\n\u003cp>不满意别重来，直接追；最后一句还能一键把结论变成汇报 PPT。\u003c/p>\n\u003cp>拿到陌生数据时，先用 Ask 模式摸清字段再动手，不容易翻车：\u003c/p>\n\u003cpre>\u003ccode>这份数据有哪些字段？每列什么意思？\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>先清洗这份数据，并说明你清洗了什么。\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>做对了应该看到：右侧出现带图表、可预览的分析报告；追问后是在原报告上修改；Ask 模式能列清字段含义。\u003c/li>\n\u003c/ul>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：Excel 一拖 + 一句话，自动出带图表的报告；但关键结论口径要人工复核。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：找一份真实数据，出一份分析报告。验收：交出一份含至少一张图表的报告（HTML/PPT 均可），并说出你核对了哪个口径。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：今天处理的是一份表，下节课处理一堆文件——发票、图片、文档的批量识别和整理。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>录制前用示例文件跑通，确认能生成 HTML 报告；网络慢时报告生成会等。\u003c/li>\n\u003cli>高频疑问「报告能导出吗」：右侧产出可下载/预览，具体格式以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003cli>高频疑问「它会不会算错」：结论可信度依赖数据质量，关键口径人工复核。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 8 课 · 数据分析与可视化：拖一份 Excel 出报告"}, {"gid": 8, "no": 9, "label": "第 9 课", "short": "文件识别与批量处理：发票 / 图片 / 文档", "summary": "整理过一整个季度的报销发票吗。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 15-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：授权本地文件夹，让 WorkBuddy 批量重命名、按类型/日期归类，完成「发票批量识别 → 汇总台账 → 标异常」，并用 Plan 模式先看计划再执行、避免误删。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>整理过一整个季度的报销发票吗？一张张看、一张张登记，半天没了。下载文件夹是不是也乱成一锅粥，找个文件翻半天？那些手动要半天的机械杂活——重命名、归类、发票登记——这节课一句话交给它，它干完还附一份处理日志。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 它能读写你授权的本地文件夹\u003c/strong>\n重复 100 遍的机械操作，一句话就能派给它。重点是安全：它只能碰你授权过的文件夹，第一次操作某个目录会弹提示，你看清路径、确认了它才动。就像给保姆一把指定房间的钥匙，别的房间进不去。记住：\u003ccode>只操作你授权的文件夹\u003c/code> + \u003ccode>看清路径再放行\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为它能随便翻你整台电脑。不能，必须授权；也别嫌提示烦，那是安全阀。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 不确定就先 Plan、重要文件先备份\u003c/strong>\n怕它误删？先用 Plan 模式让它把「打算怎么操作」列出来，你看没问题再执行。重要文件动手前先备份，养成习惯：\u003ccode>拿不准 → Plan 先看计划\u003c/code>，\u003ccode>重要文件 → 先备份\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：直接让它批量动文件不留后手。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>先做批量重命名 + 按月归类图片。输入指令回车，第一次操作会弹授权确认，核对路径没错再放行（路径按你自己电脑替换）：\u003c/p>\n\u003cpre>\u003ccode>读取 D:\\Photos\\2026 下所有图片，按拍摄日期重命名为\n20260601_153000.jpg，再按月份归类到子文件夹（2026-06/）。\n\u003c/code>\u003c/pre>\n\u003cp>它读每张图的 EXIF 拿到拍摄时间，几百张也是一句话的事，执行完会给一份处理日志：改了哪些、分到哪。\u003c/p>\n\u003cp>再整理下载文件夹，这次先用 Plan 模式：让它列计划，确认后再执行，稳当：\u003c/p>\n\u003cpre>\u003ccode>整理下载文件夹，按类型分到子文件夹：\n文档→Docs、图片→Images、安装包→Installers、压缩包→Archives。\n\u003c/code>\u003c/pre>\n\u003cp>最后做发票整理与登记（进阶）。输入指令回车：\u003c/p>\n\u003cpre>\u003ccode>读取「报销发票」文件夹里所有发票图片/PDF，识别每张的：\n发票号码、开票日期、金额、税额、销售方名称，\n汇总成 Excel 台账，统计总金额，标出金额异常（如超 5000）的行。\n\u003c/code>\u003c/pre>\n\u003cp>生成的 Excel 台账里有总金额和被标红的异常行。识别完，金额务必人工抽查几张——这是财务场景的铁律，AI 帮你录入，签字担责的是你。\n- 做对了应该看到：图片按日期改名并归入月份子文件夹、附处理日志；下载夹按类型分好；发票生成 Excel 台账，异常行被标出。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：授权文件夹后，重命名/归类/发票登记这些机械杂活一句话交给它；但要看清授权、先备份、财务金额人工抽查。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：让它整理归类一次你最乱的文件夹；有条件用真实发票试发票案例。验收：交出整理前后对比（截图即可）或发票台账 Excel，并说出你做了备份/抽查。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：文件搞定了，下节课把一段录音变成纪要、待办、周报。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>指令里的 \u003ccode>D:\\Photos\\2026\u003c/code> 是示例，务必提醒学员换成自己电脑真实路径，否则报「找不到」。\u003c/li>\n\u003cli>录制前一定备份示例文件夹，演示误操作也不心疼。\u003c/li>\n\u003cli>高频疑问「支持哪些文件类型/单次处理多少」「识别准不准」：类型/上限以官网 www.workbuddy.cn 为准，识别后财务金额务必人工抽查。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 9 课 · 文件识别与批量处理：发票 / 图片 / 文档"}, {"gid": 9, "no": 10, "label": "第 10 课", "short": "会议协同：录音 → 纪要 → 待办 → 周报", "summary": "上次开完一个小时的会，你花了多久整理纪要。", "dur": "约 15 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 15 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把一段会议录音或文字稿，用一条指令变成含决议、待办的结构化纪要，再转成跟进任务、汇总成周报。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>上次开完一个小时的会，你花了多久整理纪要？很多人是开会一小时、整理又一小时，更惨的是会上说好的事散会没人跟，下次开会又从头讨论。这一课，我教你把录音往上一传，纪要、待办、跟进话术自动出来，散会 5 分钟就能发到群里。会议结束不再是终点，而是行动的起点。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 会议的价值在会后，不在会上\u003c/strong>\n开会像做饭，讨论是备菜，真正吃到嘴里的是会后的行动项。WorkBuddy 的本事不是帮你开会，是帮你把会「落地」：把嘴上说的变成能追踪的待办。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为 AI 只能转写文字。转写只是第一步，重点是它能把散乱对话结构化成决议和待办。\n记住：\u003ccode>会议的价值 = 会后能不能跟进\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 会议协同的四段流水线\u003c/strong>\n\u003ccode>录音 → 纪要 → 待办 → 同步 → 周报\u003c/code>。每一段的输出都是下一段的输入：你把录音丢进去，后面像多米诺骨牌一样倒下来。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把「待办」和「讨论要点」混在一起。待办必须带负责人 + 截止时间，缺这两样就不是待办，只是聊天记录。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 一定要区分「决议」和「待确认项」\u003c/strong>\n这是本课最重要的一句话。会上老板随口说「这个功能也许下季度做」，是待确认，不是决议。若 AI 把它写成「决议：下季度做」，你拿去执行就出事。所以指令里要明确让它区分，重要决议一定人工核对原话。\n记住：\u003ccode>决议 ≠ 讨论中的推测\u003c/code>——AI 出草稿，人核对拍板。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>新建对话，上传一段会议录音转写文字稿（没有就用手上任意一段会议文字）。\u003c/li>\n\u003cli>生成纪要。别只说「整理一下」，把要什么结构一条条列清楚——这是能不能一步到位的关键：\n   ```\n   这是今天产品评审会的录音转写（附件）。整理成会议纪要：\u003c/li>\n\u003cli>一句话会议结论  2. 关键决议（编号）\u003c/li>\n\u003cli>讨论要点  4. 遗留问题\u003c/li>\n\u003cli>待办清单：任务 | 负责人 | 截止时间（表格）\n   ```\u003c/li>\n\u003cli>结果出来，重点看「关键决议」和「讨论要点」两块是否分开了，随手核对一处原话。\u003c/li>\n\u003cli>把待办转成跟进任务，并给每个负责人配一句跟进话术：\n   \u003ccode>把上面的待办清单写入我腾讯文档「本周待办」，\n   并在每个负责人名字后加一句一句话的跟进话术草稿。\u003c/code>\u003c/li>\n\u003cli>到了周五，把这周几份纪要汇总成给领导看的周报：\n   \u003ccode>读取我这周三次会议的纪要，提炼成一份汇报周报：\n   本周关键决策、进展、卡点、下周重点，给领导看，正式简洁。\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：纪要把「决议」和「待确认」分开，待办表带齐「负责人 + 截止时间」；周报是提炼过的要点，不是原文堆砌。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：会议的价值不在会上说了什么，而在会后 5 分钟能不能把它变成能追踪的行动。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：录一段会议音（或用文字稿），跑一遍纪要→跟进。验收标准：产出一份区分了决议/待确认、且待办表带齐「负责人 + 截止时间」的纪要。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：换个方向，让它去联网调研一个你不熟的课题，还得带证据、能溯源。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>演示素材里务必埋一两处「还在讨论没定」的模糊表述，否则演示不出「区分决议/待确认」的价值。\u003c/li>\n\u003cli>写入腾讯文档需要先配连接器，这里先看指令效果；录音能否直接传、涉及价格功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003cli>提醒敏感会议注意合规，重要决议人工核对原话。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 10 课 · 会议协同：录音 → 纪要 → 待办 → 周报"}, {"gid": 10, "no": 11, "label": "第 11 课", "short": "深度调研：从一个问题到一份带证据的报告", "summary": "老板让你明天交一份行业调研报告，你现在会怎么做。", "dur": "约 16 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 16 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：用 Plan 模式先对齐调研方向，再产出一份「结论→证据→来源链接→待确认」可溯源的报告，并对重要数字做多源交叉验证。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>老板让你明天交一份行业调研报告，你现在会怎么做？打开搜索引擎一个个翻，两小时凑三千字？用 AI 呢？很多人让它写一篇，结果一堆看起来对、却一个出处都没有的话——你敢直接交给老板吗，万一有个数字是编的？这一课教你让 AI 做一份专业调研员会做的报告：每个关键结论都能点开链接溯源，编不了。你负责判断，它负责跑腿找证据。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 好的调研报告 ≠ 长，而是「证据可追溯」\u003c/strong>\n报告写得再漂亮，关键数字问它「哪来的」答不上，就是空中楼阁。我们要的不是它「说了什么」，是它「凭什么这么说」。输出结构固定为：\n记住：\u003ccode>结论 → 证据 → 来源链接 → 待确认\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为报告越长越专业。没出处的长文最危险。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 用 Plan 模式先对齐方向，再开搜\u003c/strong>\n像出门旅游先看攻略再买票：让它先列调研提纲和信息源计划，你看方向对不对，确认了再让它开搜。好处是不跑偏、也不会一上来乱搜浪费积分。\n记住：\u003ccode>Plan 模式 = 先列提纲 → 你确认 → 再开搜\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：习惯直接说「帮我调研 XX」就等结果——那样它可能搜歪，改起来更费劲。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 多源交叉验证——重要数字别只信一家\u003c/strong>\n同一个市场规模，A 说 100 亿、B 说 150 亿，信哪个？让它用多个来源交叉验证，冲突处标出来，你自己判断。越重要的数字越要多源核对。此外，投资、法律、医疗这类高风险课题，AI 只做「资料 + 证据 + 待确认项」，拍板由人承担。\n记住：\u003ccode>AI 找证据，人来拍板\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>开启 Plan 模式——这是让调研不跑偏的关键。\u003c/li>\n\u003cli>下调研指令：先让它列提纲和信息源计划让你确认，再规定要几块内容、每个数据带链接、无法核实标待确认、最后定输出格式：\n   ```\n   用 Plan 模式：调研 2026 年国内 AI 编程助手市场。\n   先列调研提纲和信息源计划让我确认，然后：\u003c/li>\n\u003cli>主要玩家对比（产品、定价、差异化）——做成表格\u003c/li>\n\u003cli>技术趋势  3. 市场规模与增长\u003c/li>\n\u003cli>每个关键数据附来源链接，无法核实的标「待确认」\n   输出 3000 字 Markdown 报告 + 一张竞品对比表 + 一张来源证据表。\n   ```\u003c/li>\n\u003cli>它先返回提纲和信息源计划时，先别急着往下——检查方向对不对，想加一块（比如「开源 vs 闭源」）就直接说，确认后再让它继续。\u003c/li>\n\u003cli>报告出来后，重点看「来源证据表」：每个结论后面都有来源链接、能点开溯源，核不到的它老实标了「待确认」。\u003c/li>\n\u003cli>对重要数字再逼它一步：\n   \u003ccode>市场规模这个数字，用多个来源交叉验证，冲突的地方标注出来。\u003c/code>\u003c/li>\n\u003cli>报告太长领导没空看，加个执行摘要：\n   \u003ccode>开头加一段 200 字执行摘要，给忙的人看。\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：它先出提纲等你确认再开搜；报告里每个关键结论都能点开链接溯源，核不到的标了「待确认」。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：调研不看报告多长，看每个关键结论能不能点开链接溯源；AI 找证据，你来拍板。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：选一个工作相关课题，用 Plan 模式做一份带来源证据表的报告。验收标准：数一数有几个结论能点开链接溯源，并至少有一处对重要数字做了多源交叉验证或标了「待确认」。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：把这些能力接到你真实的工具里——邮箱、腾讯文档、微信、Notion。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>Plan 模式返回提纲可能较慢，别急着往下点；一定要演示「确认/微调」这一步，否则学员感受不到 Plan 模式的价值。联网搜索有时慢，提前跑一遍备好素材。\u003c/li>\n\u003cli>链接失效很正常，正因如此才要「待确认」标注和多源交叉，不能盲信；高风险领域不能拿报告直接做决策。\u003c/li>\n\u003cli>积分消耗、功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 11 课 · 深度调研：从一个问题到一份带证据的报告"}]}, {"emoji": "🔌", "name": "连接器 · 技能生态", "desc": "打通工具、装 Skill、造 Skill、知识系统", "raw_title": "模块三 · 连接器与技能生态 — 讲师教案", "lessons": [{"gid": 11, "no": 12, "label": "第 12 课", "short": "连接器：打通邮箱 / 文档 / 微信 / Notion", "summary": "你平时一天要在几个软件之间来回切。", "dur": "约 17 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 17 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：在「设置 → 连接器」里开启并授权一个连接器，用一句话让 WorkBuddy 跨平台完成「检索 → 整理 → 创建」一条龙。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>你平时一天要在几个软件之间来回切？邮箱、文档、微信、Notion……光「切软件」这个动作一天就点几十次。这一课我们让 WorkBuddy 把这些平台全「串」起来：你不打开邮箱，就能收到今天未读邮件的摘要；不打开腾讯文档，就能建好一张排期表。省的不是几分钟，是你在软件之间「找入口」的心力。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 连接器 = 连外部软件的「插头」\u003c/strong>\nWorkBuddy 像一个万能遥控器，出厂时没配对任何家电。连接器就是把它和你的邮箱、文档「配对」的过程，配对完成它才能替你干活。\n记住：\u003ccode>连接器 = 插头 = 授权后才有权限操作你的平台\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「它那么强，肯定自动就能看我邮箱」。没开连接器 = 没插上电，啥也做不了——这正是为了保护你的隐私。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 铁律——用之前必须先开连接器\u003c/strong>\n想让它干哪个平台的活，先去把那个平台的连接器打开。没开就下指令，它会告诉你「没权限」，很多人第一次都卡在这。\n记住：\u003ccode>⚠️ 用前先开连接器\u003c/code>（本课最重要的一句话）。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把「登录了 WorkBuddy」等同于「连接器开好了」，这是两回事。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 连接器能写入，外发要先出草稿\u003c/strong>\n连接器不只是「看」，还能「写」——建文档、发邮件都行。正因为能写，涉及发给别人的操作定个规矩：先出草稿，你看过再发，别让它自动外发没确认的东西。\n记住：\u003ccode>写入权限 → 外发默认先出草稿，人工确认再发\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>打开\u003cstrong>设置 → 连接器\u003c/strong>（所有连接器都在这一个入口）。里面一长串平台：邮箱、腾讯文档、飞书、微信、Notion、GitHub、Canva、ima 等。\u003c/li>\n\u003cli>找到 \u003cstrong>QQ 邮箱\u003c/strong>，点\u003cstrong>开启\u003c/strong>，按提示\u003cstrong>授权\u003c/strong>（通常扫码 / 登录）——这一步就是「配对」，你点同意它才拿到权限。回到状态显示「已连接」。\u003c/li>\n\u003cli>回对话框下指令，全程不用打开邮箱网页：\n   \u003ccode>获取最新 10 封邮件，列发件人、主题、摘要\u003c/code>\n   （小技巧：故意先不开连接器下一次指令，看它报「没权限」，再回去开——用这个对比把「用前先开」钉进脑子。）\u003c/li>\n\u003cli>回连接器开启并授权\u003cstrong>腾讯文档\u003c/strong>，下指令建表：\n   \u003ccode>创建项目排期表，含任务/负责人/时间/状态 5 列，预填 10 行\u003c/code>\u003c/li>\n\u003cli>跨平台一条龙（本课高潮）：确认 \u003cstrong>ima + 腾讯文档\u003c/strong>两个连接器都开着（跨几个平台就要几个连接器），下指令：\n   ```\u003c/li>\n\u003cli>从我的 ima 知识库搜关于「产品方法论」的笔记\u003c/li>\n\u003cli>整理成结构化文档\u003c/li>\n\u003cli>保存到腾讯文档，命名「产品方法论整理」\n   ```\u003c/li>\n\u003cli>微信集成：进\u003cstrong>设置 → Claw 设置 → 微信助手集成\u003c/strong>扫码。注意两点：电脑得一直开机它才能推消息；你在电脑这边发的消息不会同步回微信，是单向提醒。测试：\n   \u003ccode>提醒我下午 3 点取快递\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：不打开邮箱网页就列出了邮件摘要；一句话跨三个平台完成了检索→整理→创建，真的在腾讯文档里生成了可编辑的文件。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：连接器是插头——用前必须先开，开了它才能替你操作邮箱、文档、微信这些平台。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：开启 QQ 邮箱连接器，用一句话汇总今天的未读邮件。验收标准：截图展示 WorkBuddy 列出的邮件发件人 / 主题 / 摘要。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：给它「装外挂」——技能 Skill，让它学会一些专门本事。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>演示前一定要提前把要用的连接器授权好并测试一遍，现场扫码常因网络或账号状态卡住，会打断节奏。\u003c/li>\n\u003cli>「故意不开连接器看报错」在自己账号上演示；有人担心隐私，说明是本人主动授权、可随时在设置里断开，WorkBuddy 只在你下指令时才访问。\u003c/li>\n\u003cli>涉及价格 / 功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 12 课 · 连接器：打通邮箱 / 文档 / 微信 / Notion"}, {"gid": 12, "no": 13, "label": "第 13 课", "short": "技能 Skill：给它装外挂（安装 + 实战）", "summary": "上一课我们让 WorkBuddy 连上了你的平台。", "dur": "约 14 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 14 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：说清 Skill 和连接器的区别，在技能市场找到并安装一个官方技能，用它完成一次「内容创作一条龙」。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>上一课我们让 WorkBuddy 连上了你的平台。但你想过让它「下载某个账号的全部视频」「一键把文章发到公众号草稿箱」「把一段文字变成精美 PDF」吗？这些不是它天生就会的本事——得给它「装外挂」。这一课你会给 WorkBuddy 装技能，从此「需要什么本事，就去技能市场装什么」，并跟着做一次从写稿、配图到发草稿箱的一条龙。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. Skill vs 连接器——最关键的区分\u003c/strong>\n连接器是把它接到你已有的账号平台（你的邮箱、你的文档），像给它你家钥匙；技能 Skill 是给它装一项专门本领（比如「会下视频」这个能力），像给游戏角色学一个技能。「读我邮箱」是连接器的活，「把文字生成 PDF」是技能的活。\n记住口诀：\u003ccode>接账号找连接器，长本事找技能\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把两者混为一谈。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 官方技能有哪些、去哪装\u003c/strong>\n打开设置里的技能市场，就像一个「能力应用商店」，需要什么装什么。常见的有：公众号文案创作（写长文）、Wechat Publisher（一键发草稿箱）、Canva（配图）、PDF 文档生成（做商务文档）、公众号爆款查询（找选题灵感）、浏览器自动化（网页抓数据）等。\n记住：\u003ccode>技能市场 = 能力应用商店 → 需要什么装什么\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为技能装越多越乱。用不到的放着不碍事，装得越多它越全能。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 下载类技能的合规边界\u003c/strong>\n下载类技能很强，但一定遵守平台条款、版权和合理使用。目的是学习结构、做参考，不是搬运别人的东西去发布。这条底线要守住。\n记住：\u003ccode>下载类 → 学习/参考，非搬运；守版权与平台条款\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>打开\u003cstrong>设置 → 技能市场\u003c/strong>，浏览这个「能力应用商店」，找到要装的技能。\u003c/li>\n\u003cli>装齐一条龙需要的技能：\u003cstrong>公众号文案创作\u003c/strong>、\u003cstrong>Canva\u003c/strong>、\u003cstrong>Wechat Publisher\u003c/strong>，各点安装。\u003c/li>\n\u003cli>用一篇 md 文章素材（或让它先写一篇），跑一次内容创作一条龙——写稿、配图、发到公众号草稿箱：\n   \u003ccode>用这份素材写一篇公众号文章，配好封面图，\n   完成后存到我的公众号草稿箱。\u003c/code>\u003c/li>\n\u003cli>每装一个新技能，先单独试用一次，确认它能正常工作再纳入日常流程。\u003c/li>\n\u003cli>做对了应该看到：技能市场里技能状态显示「已安装」；一条龙跑完后，公众号草稿箱里出现了带配图的文章草稿。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：接账号找连接器，长本事找技能——需要什么本事，就去技能市场装什么。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：去技能市场装一个你用得上的官方技能并试用一次。验收标准：能说出这个技能解决什么问题，并展示一次它的产出。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：不止用现成技能，还能把「你自己怎么做事」的方法论固化成一个专属技能。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>演示前提前把一条龙要用的技能都装好、测通，现场安装可能因网络卡住。\u003c/li>\n\u003cli>反复强调 Skill 与连接器的区别，这是学员最容易混淆的点；下载类技能务必点明版权与合规底线。\u003c/li>\n\u003cli>技能是否收费、具体功能一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 13 课 · 技能 Skill：给它装外挂（安装 + 实战）"}, {"gid": 13, "no": 14, "label": "第 14 课", "short": "打造自己的 Skill：把书和视频蒸馏成能力", "summary": "前面十几课，我们一直在「用」别人做好的技能。", "dur": "约 16 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 16 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：说清 Skill 的三要素，把一份自己的方法论蒸馏成「触发 + 步骤 + 模板」的工作流，固化成专属 Skill 并测试可用。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>前面十几课，我们一直在「用」别人做好的技能。可你每周都在重复做的那件活——写周报、审合同、做竞品分析，脑子里其实有一套自己的固定套路，为什么每次还要从头想一遍、从头排一遍格式？这一课，你能把「你自己怎么做这件事」固化下来：以后一句话触发，AI 每次都按你的标准、你的框架、你的模板产出。等于给自己请了个永远不会忘规矩的助理。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 为什么要自造 Skill（用现成 vs 造自己）\u003c/strong>\n技能市场现成的技能像便利店的速食便当，解决通用动作；但你有没有一道「拿手菜」——审合同的专属检查清单、竞品分析的自评分表？自造 Skill 就是把这道拿手菜的做法写成菜谱交给 AI，以后它照着做出一模一样的味道。\n记住：\u003ccode>现成技能 = 通用动作\u003c/code>／\u003ccode>自造 Skill = 你的独门方法论固化\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「我没什么独门方法论」。不需要多高级，你每周固定做、有固定套路的任何小事都算——哪怕「写周报永远分四段：本周完成、下周计划、风险、需要支持」，这就是可蒸馏的方法论。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 一个 Skill 的三要素\u003c/strong>\n就三样东西，是本课骨架：\u003ccode>① 触发场景（什么时候用）\u003c/code> → \u003ccode>② 方法论/步骤（怎么做）\u003c/code> → \u003ccode>③ 输出模板（产物长啥样）\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：最容易忽略第三条「输出模板」，或写得太虚（如「写一份专业的报告」）。模板越具体越稳——把章节名、表格字段全写死，产出一致性大幅提升；写得越虚，AI 每次自由发挥，你就得每次返工。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 从窄开始\u003c/strong>\n别一上来就想造「万能助理」，结果什么都做不好。先造一个只做一件事的小技能（比如「生成标准周报」），跑顺、稳定了，再往上加功能。\n记住：\u003ccode>从窄开始：一个 Skill 先只干一件事\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>喂原料\u003c/strong>：把你的书、视频文字稿或自己的 SOP（比如一份「竞品分析 SOP」）拖进 WorkBuddy 工作区。\u003c/li>\n\u003cli>\u003cstrong>蒸馏\u003c/strong>：先别让它直接干活，让它把这份文档提炼成三要素框架：\n   ```\n   这是我做竞品分析的方法论文档（附件）。请你把它蒸馏成一个\n   可复用的工作流：1. 什么情况触发  2. 分几步、每步做什么\u003c/li>\n\u003cli>最终输出的固定模板（章节+表格字段）。先给我看这个蒸馏结果。\n   ```\u003c/li>\n\u003cli>蒸馏结果出来后，对照三要素逐项检查：①什么情况触发、②分几步每步做什么、③最终输出的固定模板。不满意就现场微调（比如补一个表格字段），改到满意再固化。\u003c/li>\n\u003cli>\u003cstrong>固化成技能\u003c/strong>：打开技能市场/设置里的「创建技能」流程，把这套框架保存成专属 Skill。\u003c/li>\n\u003cli>\u003cstrong>测试\u003c/strong>：新开一个任务触发这个 Skill，喂一个真实资料，看它是否严格按刚才那个模板产出。\u003c/li>\n\u003cli>做对了应该看到：蒸馏结果清晰对应三要素；固化后触发它，连续 3 次产出都严格符合你的模板才算这个 Skill 可用——一次准不算数。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：把「你怎么做这件事」固化成 Skill，以后一句话触发、每次都按你的标准来——这是从用工具到造工具的分水岭。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：挑一件你每周都做、有固定套路的活，把套路写成「触发 + 步骤 + 模板」，蒸馏成一个 Skill 并测试 3 次。验收标准：能提交三要素文字 + 连续 3 次测试产出都严格符合模板。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：讲知识系统——把散落各处的笔记和收藏，变成能反复用起来的知识资产。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>演示素材别太长太杂，选一份结构清晰的 SOP，否则蒸馏结果乱、讲不清；测试环节备好一个现成真实资料，避免临场找资料浪费时间。\u003c/li>\n\u003cli>反复强调两句：先看蒸馏结果再固化，别一步到位；测试要连续 3 次达标才算可用。\u003c/li>\n\u003cli>创建技能入口界面可能随版本更新，Skill 是否扣费等一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 14 课 · 打造自己的 Skill：把书和视频蒸馏成能力"}, {"gid": 14, "no": 15, "label": "第 15 课", "short": "知识系统：ima / Obsidian / 收藏再利用", "summary": "你的微信收藏夹、浏览器书签、笔记 App 里，是不是存了几百上千条「以后一定要看」的东西。", "dur": "约 14 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 14 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：让 WorkBuddy 把散落的笔记检索出来、结构化、关联并产出一篇新东西，还能对笔记库做一次「知识库体检」找出该更新的信息。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>你的微信收藏夹、浏览器书签、笔记 App 里，是不是存了几百上千条「以后一定要看」的东西？过去一个月，你真的回去用过其中几条？这就是最普遍的痛点：收藏 = 存了就忘。存的那一刻很满足，之后它就躺在坟墓里再没醒来。这一课，我们让 WorkBuddy 把你散落各处的笔记、收藏、文档，变成一个「能再次用起来」的知识系统——需要时一句话就能把相关的全捞出来，组装成一篇文章、一份方案。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 收藏不是知识管理\u003c/strong>\n核心金句：收藏不是知识管理，能再次用起来才是。收藏像把菜买回来塞进冰箱最深处冻到发霜；真正的知识管理是随时能把食材拿出来、配好、炒成一盘菜。WorkBuddy 能连接你的 ima、Obsidian、WPS、腾讯/飞书文档，把碎片信息 \u003ccode>检索 → 结构化 → 关联 → 再产出\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为这节是「教我用某个笔记软件」。不是学软件操作，是学怎么让 AI 把你已存的东西盘活，软件哪个都行。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 个人知识工作流六环节\u003c/strong>\n\u003ccode>捕捉 → 归集 → 分类 → 检索 → 组装 → 体检\u003c/code>。前三段是把东西攒进来，后三段（检索、组装、体检）才是「用起来」。大多数人只做了前半段，所以收藏才变坟墓。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：只关注捕捉和分类，忽略组装和体检——后半段才是价值所在。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 始终保留来源（溯源）\u003c/strong>\n让 AI 整理时始终标出「哪条结论来自哪个文件」。不溯源，它给你的又是一堆看着对但不敢用的话；带上来源，你才能核对、才敢拿去用。\n记住：\u003ccode>可溯源 = 可信任\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>先确认已连接至少一个笔记库（ima 或 Obsidian）。\u003c/li>\n\u003cli>\u003cstrong>散落笔记 → 一篇文章\u003c/strong>：在已连接的 Obsidian 上执行下面指令，注意最后一句「标出每个观点来自哪条笔记」——这就是溯源，一定要加：\n   \u003ccode>从我的 Obsidian 里搜所有含「Agent 设计」的笔记，\n   去重后按主题聚类，帮我组织成一篇 2000 字文章的提纲，\n   标出每个观点来自哪条笔记（可溯源）。\u003c/code>\u003c/li>\n\u003cli>结果出来，看提纲里每个观点后面是否都挂着出处，能随时点回去核对。\u003c/li>\n\u003cli>\u003cstrong>知识库体检\u003c/strong>：换到 ima 知识库，专盯「有保质期」的信息（版本号、价格、榜单），让它告诉你哪些可能过期：\n   \u003ccode>检查我 ima 知识库里「AI 工具」标签下的笔记，\n   标出哪些信息可能已过期（涉及具体版本号、价格、榜单的），\n   列出需要更新的清单。\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：文章提纲里每个观点都带来源标注；体检清单列出了具体哪几条信息该更新——这就是把收藏从坟墓里唤醒的价值。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：收藏了不等于拥有，能被再次捞出来、组装成新产物、还知道来源，才是真正属于你的知识资产。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：选一个你的笔记库（ima/Obsidian/文档都行），让 WorkBuddy 做一次「知识库体检」。验收标准：提交一份体检清单，列出至少若干条被标为「可能过期/需更新」的信息及其来源。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：让它自己定时干活，不用你手动催——正式进入定时自动化任务。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>提前连好笔记库并塞几条「明显过期」的示范笔记（旧版本号/旧价格），否则体检演示出不来效果。\u003c/li>\n\u003cli>别把这节讲成软件教学，重点始终是「让 AI 把碎片用起来」；组装类任务务必带上「标出来源」这句。\u003c/li>\n\u003cli>支持连接哪些笔记/文档、是否收费一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 15 课 · 知识系统：ima / Obsidian / 收藏再利用"}]}, {"emoji": "⚙️", "name": "自动化 · 可靠性", "desc": "定时任务、资讯流水线、稳定性保障", "raw_title": "模块四 · 自动化与可靠性 — 讲师教案", "lessons": [{"gid": 15, "no": 16, "label": "第 16 课", "short": "定时自动化任务：让它自己干活", "summary": "你每天早上到公司，头半小时都在干嘛。", "dur": "约 14 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 14 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：创建一个定时/周期自动任务，设好时间规则让它到点自动跑，并守住「先手动验证、电脑要开机」两条前提。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>你每天早上到公司，头半小时都在干嘛？看邮件、翻消息、列今天要做的事——全是重复的体力活，还没开始正经工作，一小时没了。这一课我要让你明天早上打开电脑，昨天的邮件汇总、今天的待办、行业热点，已经躺在你微信里了，你一个字都没敲。我们让机器替你上早班。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 什么是定时/周期任务\u003c/strong>\n普通任务像点外卖——叫一次干一次；定时任务像订牛奶——每天自动送到门口，不用天天下单。凡是「每天/每周都要做一遍」的活（日报、周报、提醒、巡检）都能交给它。\n记住：\u003ccode>定时任务 = 时间规则 + 到点自动跑\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为设一次就「永远自动、什么都不用管」。它帮你干重复的活，不是从此不管。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 任务三要素\u003c/strong>\n设一个定时任务，想清三句话就行：\u003ccode>① 什么时候跑  ② 干什么  ③ 结果发哪\u003c/code>。就像交代同事——「每天九点、把昨天邮件汇个总、发我微信」。\u003c/p>\n\u003cp>\u003cstrong>3. 关键限制——电脑必须开机\u003c/strong>\n本课最重要的一句：自动任务是在你自己这台电脑上跑的，它跑的时候电脑必须开着。就像闹钟得插着电才会响，关了电脑它就是个哑巴闹钟。\n记住：\u003ccode>⚠️ 执行时电脑必须开机（在本机跑）\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为像手机 App 通知一样在云端跑。不是——它靠电脑开机 + 连接器保持授权 + 网络正常，三样都得在。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>4. 先手动，再自动\u003c/strong>\n强烈建议一个习惯：先手动跑一次，结果满意了再设成自动。指令写得不对却直接设自动，它就每天准时给你送一堆垃圾，你还未必发现。先手动验一遍，等于先试驾再买车。\n记住：\u003ccode>先手动跑一次 ✅ → 满意 → 再设自动\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>先手动跑一遍\u003c/strong>：让它当场汇总邮件并发微信，看结果对不对，确认指令没问题。\u003c/li>\n\u003cli>确认满意后，把它变成每天自动（需先开邮箱连接器 + 微信助手集成）：\n   ```\n   创建一个自动化任务：\u003c/li>\n\u003cli>每天早上 9:00 执行\u003c/li>\n\u003cli>获取邮箱过去 24 小时的邮件\u003c/li>\n\u003cli>按重要程度分类汇总（发件人、主题、摘要）\u003c/li>\n\u003cli>通过微信助手把汇总发给我\n   ```\u003c/li>\n\u003cli>打开任务列表，确认这条定时任务已存在、下次执行时间是明早 9:00。\u003c/li>\n\u003cli>再设一个更简单的提醒类任务，感受它多好设：\n   \u003ccode>每个工作日下午 6 点提醒我：填今天的工时表。\u003c/code>\n   （想做每周周报草稿的，可用这条选做：）\n   \u003ccode>每周五 17:00 自动执行：\n   读取我这周在腾讯文档「工作日志」的记录，\n   生成周报草稿，保存到腾讯文档「周报」文件夹。\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：手动那次能正常产出并发到微信；任务列表里出现这条定时任务，标着下次执行时间。别忘了——到点那天你的电脑得开着它才会跑。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：定时任务就是把「每天要做一遍的重复活」交给机器上早班，但机器上班的前提是——你的电脑开着。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：设置一个属于你的每日自动任务（晨报、提醒、日报都行），观察它第二天有没有准时执行。验收标准：第二天能收到自动产出的结果，并能说出没收到该先查哪三样（电脑开机/连接器授权/网络）。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：让它干更聪明的活——把满世界的资讯自动整合成一份「不吵」的每日通知。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>现场当场不会真等到明早，务必用「先手动跑」那一步展示真实效果，别让学员误以为「没看到结果 = 不好使」。\u003c/li>\n\u003cli>反复强调「先手动验证」和「电脑要开机」两个易忽略点。\u003c/li>\n\u003cli>任务数量/价格有无限制一律以官网 www.workbuddy.cn 为准，不口头承诺具体数字。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 16 课 · 定时自动化任务：让它自己干活"}, {"gid": 16, "no": 17, "label": "第 17 课", "short": "资讯整合流水线：信息流变每日通知", "summary": "你是不是关注了一堆行业公众号、订了 GitHub Trending、加了几个信息群，可现在这些推送早都设成免打扰了。", "dur": "约 16 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 16 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：搭建一个每日资讯通知任务，做到「先筛选再推送」——每天只推真正值得看的几条，还告诉你为什么。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>你是不是关注了一堆行业公众号、订了 GitHub Trending、加了几个信息群，可现在这些推送早都设成免打扰了？这就是问题——信息不是不够，是太多，重要的全被淹了。今天我们不做「又一个吵你的推送」，我们做一个「不吵」的 AI 日报：从一堆信息源里，每天只挑出真正值得你看的五到十条，还告诉你为什么值得看。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 资讯整合最怕两件事\u003c/strong>\n做资讯系统会死在两件事上：一是信息太多，重要的被淹没；二是通知太吵，最后被当背景噪音，跟没有一样。所以好系统的核心就一句话：先筛选，再推送。\n记住：\u003ccode>怕：太多 + 太吵\u003c/code> → \u003ccode>解法：先筛选 再推送\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「抓得越多越牛」。抓得多是本事的一半，「敢扔」才是另一半。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 统一工作流（所有资讯通知都是这条链）\u003c/strong>\n\u003ccode>订阅抓取 → 去重 → 分类评分 → 摘要 → 核查 → 生成卡片 → 推送 → 归档\u003c/code>。同一件事十家都报就合成一条；分类打分判断重不重要、跟你相不相关；长文变三句话；核查别把营销稿当真事；最后做成固定格式推送、并归档回看。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：觉得中间环节可省。去重和核查最容易被跳过也最容易出洋相——同一新闻推你五遍，或把谣言当大新闻推给老板。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 可用的资讯类 Skill 有哪些\u003c/strong>\n按需求选源即可，不用全用：热点新闻用腾讯新闻；盯 AI 行业用 AIHOT；研发看 GitHub 热门项目；追论文用 ArXiv；盯竞品公众号用 wechat-article-search；重要信息二次验证用多引擎搜索/Tavily/Exa；有争议信息用辟谣助手/factcheck。\n记住：\u003ccode>按需求选源，挑最需要的一两个就够\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>4. 边界——热度不等于事实\u003c/strong>\n红线一条：热度只能帮你排序，不能替代事实核验。很多爆款只是营销稿，重要信息推送前一定过一遍事实核查，标个可信度再发。\n记住：\u003ccode>🚧 热度帮排序 ≠ 事实。重要信息先核查，标可信度\u003c/code>。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>先感受反例：让它直接抓一大堆 GitHub 热门原始列表，二十多条糊一屏——这就是典型的「太多太吵」，没人想看。\u003c/li>\n\u003cli>换成筛选后的指令，只推 Top 5-10、每条带「是否值得试用」判断，同样的源就能读了：\n   \u003ccode>创建自动任务：每天早上 7 点抓 GitHub Trending 和 AI 热门项目，\n   按语言/主题/star 增长过滤，只推 Top 5-10 个，\n   每个给一句「是否值得试用」判断，发到我微信。\u003c/code>\u003c/li>\n\u003cli>装一个资讯 Skill，例如 AIHOT：\n   \u003ccode>帮我安装这个 skill：https://aihot.virxact.com/aihot-skill/\u003c/code>\u003c/li>\n\u003cli>搭一个 AI 行业日报，注意分组和「高影响追加二次核验」这一句：\n   \u003ccode>每天固定时间从 AIHOT 拉 AI 动态，按模型/产品/行业/论文/开源/商业化分组，\n   每条做「影响范围、可信度、与我团队相关性」评分，\n   只推 5-8 条重点，其余归档，高影响的追加二次检索补官方来源。\u003c/code>\u003c/li>\n\u003cli>做对了应该看到：筛选后的通知每天只有 5-10 条、每条带判断，而不是二十多条糊一屏；高影响的那几条还追加了核查来源。\u003c/li>\n\u003c/ol>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：好的资讯系统不是抓得多，而是筛得准——每天只给你真正值得看的那几条，还告诉你为什么。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：搭一个你最需要的每日资讯通知，跑三天，然后砍掉噪音、留下真正有用的源。验收标准：三天后能说出哪些源留、哪些砍，以及每天推送控制在了多少条。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：给自动化上「保险」——日志、告警、人工关口，让你知道它跑对没跑对。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>现场装 AIHOT skill 有网络依赖，装不上时别僵在那，改用 GitHub 那条继续讲，课后再帮学员装。\u003c/li>\n\u003cli>反复点「只推 Top 5-10」「每条给判断」「高影响才追加核查」，让「筛选」二字贯穿始终。\u003c/li>\n\u003cli>资讯 Skill 是否免费、有无额度限制一律以官网 www.workbuddy.cn 为准，不现场承诺。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 17 课 · 资讯整合流水线：信息流变每日通知"}, {"gid": 17, "no": 18, "label": "第 18 课", "short": "自动化工作流的可靠性：日志 / 异常 / 人工关口", "summary": "前面几节课，我们让机器人自己跑起来了，很爽。", "dur": "约 14 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 14 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：给自己的自动任务加上「日志 + 失败告警 + 高风险留人工确认」三道保险，让它从会跑的玩具变成能托付的员工。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>前面几节课，我们让机器人自己跑起来了，很爽。但有个扎心的问题：你确定它昨天真的跑了、跑对了吗？万一它悄悄失败，你今天还傻等着看晨报。更可怕的是——万一它没白跑，而是自动把一封没写完的邮件发出去了呢？这节课，我们给自动化装三样东西：黑匣子、报警器，和一道拦在关键动作前的闸门。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 三个必答问题\u003c/strong>\n你雇个新员工帮你干活，会关心三件事：他到底干没干？干砸了会不会告诉你？哪些事他不能自作主张？自动任务一模一样——\n1. 怎么知道它跑了、跑对没？→ 要有\u003cstrong>执行日志\u003c/strong>。\n2. 跑错了怎么办？→ 要有\u003cstrong>异常告警\u003c/strong>（失败主动通知你，别默默出错）。\n3. 哪一步必须人来拍板？→ 要有\u003cstrong>人工关口\u003c/strong>（高风险动作默认停下等确认）。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为设完自动任务就一劳永逸。没有这三样，你只是在赌它每次都不出错——而机器一定有出错的一天。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 三条可靠性原则\u003c/strong>\n- \u003cstrong>有日志可追溯\u003c/strong>：每次跑完记一行账（时间、干了啥、结果、有没有报错），像黑匣子，出事能翻查。\n- \u003cstrong>有异常会告警\u003c/strong>：失败时主动给你发消息。宁可被它吵醒，也别被它蒙在鼓里。告警只在出问题时才响，正常静默，不烦人。\n- \u003cstrong>有人工关口\u003c/strong>：外发、删改、写外部系统这类高风险动作，默认停下等你点头，不许先斩后奏。\u003c/p>\n\u003cp>\u003cstrong>3. 什么该自动、什么不该\u003c/strong>\n- ✅ \u003cstrong>适合全自动\u003c/strong>（低风险、可验收、重复）：抓热点、整理归档、生成草稿。\n- ⚠️ \u003cstrong>必须留人工关口\u003c/strong>：外发邮件/消息、删改文件、写入外部系统、对外发布内容。发布类动作默认不要全自动。\n- 一把万能尺子，记住：\u003ccode>白跑一趟→可自动；造成后果→留关口\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「全设成要确认最安全」。全要确认就等于没自动化。要按风险分级——低风险放手跑，只在高风险处设闸门。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>只用一段自然语言，就能给一个已有的自动任务加上三道保险。跟着做：\u003c/p>\n\u003col>\n\u003cli>打开你之前设好的「每日晨报自动任务」。它现在能跑，但是「裸奔」的——没日志、没告警。\u003c/li>\n\u003cli>在对话框输入这段指令（三条正好对应三根支柱）：\n   ```\n   优化我的每日晨报自动任务，增加可靠性：\u003c/li>\n\u003cli>每次执行后写一条日志到「晨报日志」文档：时间、抓到几封邮件、是否成功\u003c/li>\n\u003cli>如果某天邮箱连接失败或抓不到邮件，立刻发微信告诉我「今天晨报失败，原因 X」\u003c/li>\n\u003cli>汇总里如果出现「疑似重要但拿不准」的邮件，单独标出来让我人工看\n   ```\u003c/li>\n\u003cli>发送后看确认回复：第 1 条是日志，第 2 条是告警，第 3 条是人工关口——它拿不准的不自己下结论，留给你判断。\u003c/li>\n\u003cli>打开「晨报日志」文档，看执行后写进来的那一行账。\u003c/li>\n\u003cli>故意断一次网触发失败，看手机上是否收到「今天晨报失败」的提醒——它没有默默失败，它喊你了。\u003c/li>\n\u003c/ol>\n\u003cp>这套三句话是通用配方，可套到任何一个自动任务上。\n\u003cstrong>做对了应该看到\u003c/strong>：任务能写出日志；制造失败后确实收到告警消息，而不是默默失败。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：能自动 ≠ 该自动。装上日志、告警、人工关口三道保险，自动化才敢托付。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：给你的自动任务加上「日志 + 失败告警」，然后故意断一次网，看它会不会主动通知你失败，把失败告警截图留存。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：从一个人到一支团队——怎么让多个专家一起帮你干活。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>别光讲日志和告警，忘了把「人工关口」讲透——这是本课灵魂，务必让学员记住「造成后果→留关口」。\u003c/li>\n\u003cli>学员问「能不能全自动发邮件/发内容」：强烈不建议，外发、发布类默认留人工确认。\u003c/li>\n\u003cli>涉及功能是否可用/版本差异，一律回答「以官网 www.workbuddy.cn 为准」。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 18 课 · 自动化工作流的可靠性：日志 / 异常 / 人工关口"}]}, {"emoji": "👥", "name": "多 Agent 专家团", "desc": "专家团、多智能体系统、AI 视频团队", "raw_title": "模块五 · 多 Agent 专家团 — 讲师教案", "lessons": [{"gid": 18, "no": 19, "label": "第 19 课", "short": "专家与专家团：从一个人到一支团队", "summary": "前面几个模块，我们一直是「一个人对着 AI」。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：分清「普通任务 / Skill / 专家 / 专家团」四个档位，判断一个任务该用一位专家还是上专家团，不乱用、不浪费。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>前面几个模块，我们一直是「一个人对着 AI」。可如果老板扔给你一个「做一支产品宣传片」，你一个人从头扛到尾，累不累？AI 也一样——一个 AI 什么都干，就什么都干不精。这节课，我们从「请一位 AI 同事」升级到「开一个 AI 部门」：小事找一位专家，大事召唤一整支团队，一句话下去，它自己拆活、分工、干完交给你。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 四种用法档位\u003c/strong>\n用点外卖打比方：\n- \u003cstrong>普通任务\u003c/strong>＝随口说「来碗面」，一次性执行。\n- \u003cstrong>Skill\u003c/strong>＝常点那家、那个固定做法，稳定复用。\n- \u003cstrong>专家\u003c/strong>＝请了个专门的厨子，懂菜系、有手艺、有一套刀工。\n- \u003cstrong>专家团\u003c/strong>＝开了整个后厨，配菜、掌勺、摆盘各司其职，大单进来分工干。\u003c/p>\n\u003cp>记住：\u003ccode>普通任务=通用执行 | Skill=稳定动作 | 专家=人设+方法论+工具链 | 专家团=多专家+协作\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「专家就是提示词写长一点」。专家是\u003cstrong>角色切换机制\u003c/strong>，换的是身份和方法论，不只是多几句话。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 专家 = 角色切换机制\u003c/strong>\n同样是分析销售数据：普通 Agent 读数据、出个图、总结两句，像刚来的实习生。数据分析\u003cstrong>专家\u003c/strong>不一样——先问你到底想搞清什么业务目标，再定核心指标、查数据干不干净、找异常、挖原因、给能落地的建议，像干了十年的老法师。差别不在算力，在\u003cstrong>有没有一套方法论\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为专家一定更贵更慢。单点专业问题，一位专家反而最省——不用你反复补充上下文。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 专家团 = 协作执行机制\u003c/strong>\n专家团里有个\u003cstrong>团长\u003c/strong>，是关键人物。你只跟团长说三件事：背景、需求、想要的成果。剩下的——挑团员、拆任务、谁先谁后、谁并行、谁汇总——全是团长的活。你是甲方，团长是项目经理，你不用管美工和文案怎么排班。记住：\u003ccode>你 → 只说(背景/需求/成果) → 团长自动(拆解/分配/并行/整合)\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：想自己去指定每个团员。召唤现成团队时，信任团长就好。\u003c/p>\n\u003c/blockquote>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：小事请一位专家，大事召唤一支团队——别拿牛刀杀鸡。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：创建一位和你工作最相关的专家（把你的一套方法论写进人设），召唤它做一个真实任务，对比它和「普通任务」的产出差别。别怕人设写得短，把你平时做这件事的步骤口述出来就是方法论。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：从「召唤」现成团队，到自己「设计」一支不断档的团队。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>高频问「专家和 Skill 啥区别」：Skill 是一个稳定动作（一把螺丝刀），专家是带方法论的角色（会用整套工具的师傅）。\u003c/li>\n\u003cli>强调「杀鸡不用牛刀」——改一封邮件这种小事，一位专家甚至普通任务就够，别动不动上团。\u003c/li>\n\u003cli>价格/积分消耗一律以官网 www.workbuddy.cn 为准，别报具体数字。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 19 课 · 专家与专家团：从一个人到一支团队"}, {"gid": 19, "no": 20, "label": "第 20 课", "short": "多 Agent 系统设计：角色契约 + 共享产物层", "summary": "上节课我们召唤了现成团队，一句话它就干完了。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：判断一个任务值不值得拆成多 Agent，为每个角色写清「输入/输出/禁止动作」，并设计一个共享产物层、标出人工检查点。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>上节课我们召唤了现成团队，一句话它就干完了。但你想过没有——五六个 AI 同时开工，为什么不会「你说 A、我记成 B」？不是角色越多越好，而是每个角色都被「管住了」。这节课，你不光会用团队，还会自己「搭」团队：哪个环节容易出错，你提前就把它焊死。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 这个任务值得拆成多 Agent 吗？\u003c/strong>\n不是所有事都配上团队。判断标准，记住：\u003ccode>值得拆 = 可独立的子任务 + 不同方法/工具 + 清晰交接格式 + 并行省时 + 有总负责和验收 + 预算够\u003c/code>。像判断一件事要不要开会——能省时间才开，一个人五分钟搞定的事开会就是浪费。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「复杂就要拆」。改一封邮件、总结一份 PDF、格式化一个表格，一个普通任务或一位专家就够，别上团。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 角色契约（多 Agent 不乱的关键）\u003c/strong>\n每个角色都必须写清三件事：它吃什么（输入）、吐什么（输出）、\u003cstrong>不许干什么\u003c/strong>（禁止动作）。「禁止动作」就像给新员工划红线——分镜师不许自己编 Brief 里没有的卖点，剪辑师不许改分镜结构。红线清楚了，大家才不各说各话。记住：\u003ccode>角色契约 = 输入 + 输出 + 禁止动作（三缺一都会越界）\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：只写输入输出，漏掉禁止动作。不写「禁止动作」，角色突然给产品加个假功能，谁拦得住？\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 共享产物层（单一事实来源）\u003c/strong>\n如果每人手里都揣一份「产品资料」，改来改去版本就乱了。解决办法：\u003cstrong>大家读写同一批文件\u003c/strong>，只有一个真相来源。目录像这样——\u003c/p>\n\u003cpre>\u003ccode>project/\n├── brief.md          # Brief 角色产出，主理人确认\n├── storyboard.md     # 分镜师产出，主理人确认\n├── assets/screenshots/   # 素材师产出\n├── clips/            # 剪辑师产出\n└── final.mp4         # 主理人整合\n\u003c/code>\u003c/pre>\n\u003cp>分镜师只读 brief.md 这一份，不许自己另存一份。这就是之前学的「工作区」真正派上用场的地方——工作区就是专家团的共享桌面。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：让每个角色各存一份事实。单一路径、单一真相，才不错乱。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>4. 检查点（人在关键节点拍板）\u003c/strong>\n全自动不等于全程不管。三个卡点：Brief 出来后确认「卖点抓对没」；分镜出来后确认「节奏顺序 OK 没」；成片前确认「字幕、BGM、版权没问题」。记住：\u003ccode>铁律：不跳过子任务验收直接交付\u003c/code>。检查点只卡关键三步，不是每步都拦——是把返工挡在前面。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：设计专家团只有两招——给每个角色签「契约」，给整个团队建「一个共享桌面」。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：为你工作中的一个复杂项目设计一个专家团（纸上设计即可）。至少 3 个角色、每个都有完整三件套，一张共享产物层目录，至少 2 个检查点。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：把设计图真刀真枪跑起来——一句话召唤 AI 视频团队。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>最容易被跳过的是「禁止动作」，多举越界的例子逼学员写。\u003c/li>\n\u003cli>有人问「检查点会不会让全自动失去意义」：检查点只卡关键三步，返工成本远大于确认成本。\u003c/li>\n\u003cli>别把「共享产物层」讲成技术活——它就是「一个大家都能读写的文件夹」。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 20 课 · 多 Agent 系统设计：角色契约 + 共享产物层"}, {"gid": 20, "no": 21, "label": "第 21 课", "short": "实战：一句话召唤 AI 视频团队（生成 + 拆解）", "summary": "前两节都在纸上谈兵，今天真枪实弹。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 16-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：一句话召唤生成团队做出一条短视频、召唤拆解团队拆一条爆款拿到「拆解报告 + 仿拍建议」，并在每个检查点亲自把关。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>前两节都在纸上谈兵，今天真枪实弹。老板说「每周要有一条 AI 周报短视频」，你是自己剪到凌晨，还是一句话让一支 AI 团队从热点采集一路做到成片？更狠的是——别人那条视频为什么火？我们还能召唤另一支团队，把它拆到骨头里学过来。这节课你会亲手跑两支团队：一支帮你「今天做一条出来」，一支帮你搞懂「别人为什么能火」。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 两支互补的团队\u003c/strong>\n一句话点透：\u003cstrong>生成团队解决「今天怎么做一条出来」，拆解团队解决「为什么别人那条能火」。\u003c/strong> 一个是厨房（生产），一个是拆菜谱的（学习），搭配着用。记住：\u003ccode>生成团队=主题→成片 | 拆解团队=链接→报告\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为拆解团队是用来「搬运/下载别人视频」的。拆解是学结构和方法，不是搬运原视频。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 生成团队：四角色、四步流程\u003c/strong>\n四个角色——凌导（团长，拆活汇总）、灵阅（采集热点）、灵枢（策划脚本分镜）、灵映（渲染成片），是有上下游交接的生产线。四步：\u003ccode>采集→🚩策划→🚩制作→🚩发布\u003c/code>，每步都埋着检查点。核心思想：\u003cstrong>先出拆解方案（拆任务、分镜策划），你看过、拍过板，再往下执行\u003c/strong>，不是一键闷头出片。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为召唤后就能撒手。策划出来要看钩子和信息量，成片出来要验字幕/版权，发布默认绝不全自动。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 拆解团队：角色与降级取材\u003c/strong>\n三个角色——阿爆（团长总控）、小凯（音频转文案）、小淼（视频理解，分析景别/运镜/转场/节奏/色调）。取材用多层降级策略，有一层成功就继续，它会自己想办法拿到视频。记住：\u003ccode>拆解=阿爆+小凯(转文案)+小淼(镜头语言) → 拆解报告+仿拍建议\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为拆解报告能直接照抄成片。报告是「仿拍建议」，要过事实/版权/品牌三道审核。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>\u003cstrong>A. 召唤视频生成团队\u003c/strong>\n1. 一句话召唤：\n   \u003ccode>召唤视频生成团队，制作一条 46 秒 AI 周报短视频。\u003c/code>\n2. 灵阅采集：等它输出结构化摘要（标题、来源、时间、原始链接、为什么值得关注）。热度只帮排序，不替代事实核验。\n3. 灵枢策划：拿到脚本/分镜/旁白后\u003cstrong>停下\u003c/strong>，做第一次人工检查——\n   \u003ccode>开头 3 秒有钩子吗？46 秒信息塞太多没？旁白准不准？画面撑得住观点吗？\u003c/code>\n   不过关就别进配音渲染，这就是「先看方案再执行」。\n4. 灵映制作：过关后让它出 MP4，自动完成配音、字幕对齐、转场。成片出来做成片验收——\n   \u003ccode>旁白与字幕一致？镜头时长匹配？文字没遮主体？BGM 可用？素材有版权风险没？\u003c/code>\n5. 发布环节：\u003cstrong>发布默认不要全自动\u003c/strong>，账号、素材、标题、合规都人工确认后再发。\u003c/p>\n\u003cp>\u003cstrong>B. 召唤爆款拆解团队\u003c/strong>\n1. 用一条视频链接下指令：\n   \u003ccode>拆解这条视频：[视频链接]。下载视频、转写文案、分析镜头语言，\n   给我一份拆解报告 + 仿拍建议。\u003c/code>\n2. 小凯把口播转文案，小淼分析镜头语言，阿爆汇总。\n3. 报告出来后重点看「镜头语言分析」——别人开头怎么抓人、节奏怎么切，这才是要学的东西。拆解是学结构，不是搬运；取材要遵守平台条款、版权授权、合理使用。\u003c/p>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：生成团队跑到了两个检查点、由你拍板后才继续；拆解团队交出一份含镜头语言分析的报告 + 仿拍建议。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：一支团队帮你生产，一支团队帮你学习；两支组合，就是「拆爆款→定模板→出新片→复盘」的增长闭环。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：先用拆解团队拆一条你赛道的爆款，产出拆解报告；再用生成团队做一条 30-46 秒短视频，并说明你在哪几个检查点做了什么调整。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：把「提需求」这件事练到极致——提示词工程，让你下的每句指令 AI 一次做对。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>拆解取材偶有全部失败的情况，备一个已知可拆的链接兜底，别卡壳。\u003c/li>\n\u003cli>渲染出片耗时较长，可提前跑好一版成片，重点演到「策划检查点 + 触发渲染」。\u003c/li>\n\u003cli>版权红线反复强调：拆解=学结构不搬运；发布前过事实/版权/品牌三审。涉及积分和价格一律以官网 www.workbuddy.cn 为准。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 21 课 · 实战：一句话召唤 AI 视频团队（生成 + 拆解）"}]}, {"emoji": "🎓", "name": "提示词 · 落地 · 毕业", "desc": "提示词工程、岗位落地、毕业项目", "raw_title": "模块六 · 提示词·岗位落地·毕业项目 — 讲师教案", "lessons": [{"gid": 21, "no": 22, "label": "第 22 课", "short": "提示词工程深挖：把话说到 AI 心里去", "summary": "同样一个 WorkBuddy，为什么隔壁工位的人发一句话就出成品，你发完得来回改五遍。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：用「万能任务公式」把一个模糊需求改写成一次做对的精准指令，并会用几个高阶技巧。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>同样一个 WorkBuddy，为什么隔壁工位的人发一句话就出成品，你发完得来回改五遍？差别不在工具，在你\u003cstrong>会不会说需求\u003c/strong>。只打「帮我写个方案」，它只会憋出一堆正确的废话——这不是它笨，是话没说清。这节课把「提需求」拆成一个公式，学会以后你下的每句指令基本一次做对，省下的是每天来回改稿那一两个小时。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 万能任务公式\u003c/strong>\n给 AI 提需求，跟给刚入职的实习生派活一模一样——你得告诉他：给谁看、要什么、材料在哪、写多长、什么不能碰、什么算交差。记住：\u003ccode>背景 + 目标 + 输入 + 输出要求 + 边界 + 验收\u003c/code>。\n- 背景＝你是谁给谁看｜目标＝一句话要什么｜输入＝原料给它｜输出要求＝格式长度风格｜边界＝划红线不许干什么｜验收＝什么算做对。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：觉得「写这么多太麻烦」。写这六行花 30 秒，省你 5 轮返工——是省时间不是费时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 从「模糊」到「精准」\u003c/strong>\n把「帮我写个方案」升级成「写一份新品上市方案，面向 25-35 岁女性，含定价/渠道/首月节奏，输出到腾讯文档，1500 字内」——就是把公式填满。记住：\u003cstrong>形容词换成标准，AI 才不用猜\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为精准就是写很长。精准是把该给的信息给全，不是堆字数。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 五个高阶技巧\u003c/strong>\n1. \u003cstrong>给例子\u003c/strong>：贴一段范例「照这段风格写」，比形容一百句「活泼一点」都管用。\n2. \u003cstrong>让它先规划\u003c/strong>：复杂活先让它出方案，你点头再干，避免一路跑偏。它就是「先出提纲让你确认」，零基础也能用。\n3. \u003cstrong>分步下达\u003c/strong>：大任务切成「先做 A，我看完再做 B」，别整块塞。\n4. \u003cstrong>明确不要什么\u003c/strong>：负向约束常比正向更狠——「不要编发货日期」比「请准确」有用。\n5. \u003cstrong>让它自检\u003c/strong>：完事让它自己对照验收标准查一遍，把质检也外包给它。\u003c/p>\n\u003cp>顺带记住三个反模式的「病→药」：一次塞太多→拆开；只给形容词→给例子或量化；不给背景→补一句你是谁给谁看。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：把形容词换成标准，AI 就不用猜——这就是会提需求。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：挑你上周一个「结果不满意」的需求，用万能公式重写一遍，对比两次产出，能指出公式版新增了哪几个要素、改善在哪。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：把这个公式插进你自己的岗位——找到你手里第一个该交给 AI 的活。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>学员爱问「每次都要写六行吗」：简单活可省，越复杂越要全；先养成想六要素的习惯。\u003c/li>\n\u003cli>举反例时用「一句话丢过去翻车」的对比讲，冲击力最强。\u003c/li>\n\u003cli>别陷进某个具体行业太深，公式是通用的，点到为止。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 22 课 · 提示词工程深挖：把话说到 AI 心里去"}, {"gid": 22, "no": 23, "label": "第 23 课", "short": "岗位落地：把 AI 装进你的具体工作", "summary": "前面学了一堆功能，是不是有点「知道很多，不知道从哪下手」。", "dur": "约 12 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：认知课（不用动手，看懂即可）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：用「成熟度四级」给自己定位，从本岗位挑出一个「风险低、频率高」的第一下手点，并会填一张部门推广模板卡。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>前面学了一堆功能，是不是有点「知道很多，不知道从哪下手」？这节课不谈通用，只谈\u003cstrong>你的岗位\u003c/strong>——学完你手里要有一个明确的「第一个该交给 AI 的活」。给你两把尺子：一把量「你现在在哪一级」，一把帮你「挑对第一个场景」。挑对了一周内出成果，挑错了忙半天还惹麻烦。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 岗位能力成熟度四级\u003c/strong>\n学开车不会第一天上高速，用 AI 也分四个台阶，每级看「进阶信号」：\n- \u003cstrong>L1 单次辅助\u003c/strong>：一次性帮忙（会议纪要、翻译）。信号——同类任务连着成功 3 次。\n- \u003cstrong>L2 固定模板\u003c/strong>：沉淀成可复用模板（周报、标准邮件）。信号——输入字段和验收规则稳定下来了。\n- \u003cstrong>L3 工作流\u003c/strong>：Skill + 资料库 + 连接器串起来端到端跑。信号——有负责人、有日志、能处理异常。\n- \u003cstrong>L4 团队能力\u003c/strong>：专家团 + 自动化，跨职能项目。信号——要管权限、成本、资产。\u003c/p>\n\u003cp>记住：\u003ccode>L1 单次 → L2 模板 → L3 工作流 → L4 团队\u003c/code>，进阶信号就是你能不能升级的体检报告。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：一上来就想搭 L4。跳级搭出来也维护不住，先把一个 L1 做扎实。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 从「风险低、频率高」下手\u003c/strong>\n核心心法：\u003cstrong>从风险低、频率高的场景先下手\u003c/strong>。频率高＝练手机会多、回本快；风险低＝错了也不出大事。记住：\u003ccode>风险低 + 频率高 = 第一下手点\u003c/code>；\u003ccode>人工关口 = 永远留一道人来拍板\u003c/code>。像财务的金额、HR 的录用决策，这些红线永远不交给 AI 全权定。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：把最难最重要的活当第一枪（如让 AI 直接定录用）。重要的活放后面，等你信得过它了再上。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>3. 部门推广模板卡\u003c/strong>\n自己会用还不够，想在团队推广，得让别人照着也能跑。这张卡七个字段：原流程、输入、输出、验收标准、人工关口、关键指标、负责人。最容易被忽略但最重要的是\u003ccode>验收标准 / 人工关口 / 关键指标\u003c/code>三项——关键指标证明有用（省了几小时、错误率降多少），负责人保证这事不烂尾。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：模板卡只写「怎么做」，漏了「谁负责」和「怎么衡量效果」。\u003c/p>\n\u003c/blockquote>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：先定位自己在几级，再从风险低频率高处下手，别跳级、别碰红线。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：用成熟度四级给自己定位，从岗位场景里挑一个「风险低、频率高」的场景，写一张完整的部门推广模板卡（七字段全填、明确标出人工关口）。\u003c/li>\n\u003cli>\u003cstrong>下一课\u003c/strong>：把定位、场景、模板卡真的搭成一条能跑的生产线。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>学员问「我这岗位没对应场景怎么办」：找最接近的，心法一样——风险低、频率高、留人工关口。\u003c/li>\n\u003cli>别让学员在「定级」上纠结，定级是为行动不是考试，模糊就往低了定。\u003c/li>\n\u003cli>强调这节是下节毕业项目的「选题课」，选的场景最好就能当毕业项目。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 23 课 · 岗位落地：把 AI 装进你的具体工作"}, {"gid": 23, "no": 24, "label": "第 24 课", "short": "毕业项目：从零搭一条属于你的 AI 生产线", "summary": "这是最后一课，也是你的结业作品课。", "dur": "约 18 分钟", "kind": "lesson", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 16-18 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：从零搭出一条覆盖「连接器 + Skill + 提示词模板 + 可复现 + 人工关口」的生产线，并按交付清单产出结业作品。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>这是最后一课，也是你的结业作品课。学完你手里要有一条\u003cstrong>真的能跑\u003c/strong>的 AI 生产线——不是听懂了，是搭出来了。以后向团队展示、跟老板要资源，靠的就是它。跟着这节的节奏，把上节课选的那个场景，今天就变成能复现的生产线。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 毕业项目的六个必备要素\u003c/strong>\n当作毕业验收的六道关，逐条对照你的项目：\n1. 至少 1 个\u003cstrong>连接器\u003c/strong>（邮箱/文档/飞书/Notion 等）——数据从哪来。\n2. 至少 1 个 \u003cstrong>Skill\u003c/strong>（官方或自搭）——谁干活。\n3. 一套稳定的\u003cstrong>提示词/模板\u003c/strong>（用万能公式写）——怎么下命令。\n4. \u003cstrong>可复现\u003c/strong>——换个输入也能跑，不是碰运气的一次性。\n5. 明确的\u003cstrong>人工关口\u003c/strong>——哪一步你必须拍板。\n6. 进阶项（可选）——定时自动化 / 多 Agent 专家团 / 执行日志。\u003c/p>\n\u003cp>记住：\u003ccode>连接器 + Skill + 模板 + 可复现 + 人工关口 (+进阶)\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：以为「跑通一次」就算完成。第 4 条要换个输入再跑一次，两次都对才算可复现。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2. 三个参考选题（别贪大）\u003c/strong>\n- 🥉 \u003cstrong>入门级·每周竞品简报\u003c/strong>：资讯连接器 + 资讯 Skill + 周报模板 → 每周自动生成。对应 L2→L3。\n- 🥈 \u003cstrong>进阶级·客户资料到方案流水线\u003c/strong>：文档连接器 + 客户画像 Skill + 方案模板 → 产出画像 + 方案初稿，报价处留人工关口。对应 L3。\n- 🥇 \u003cstrong>挑战级·内容生产 + 拆解双团队\u003c/strong>：生成团队 + 拆解团队 + 共享产物层 + 发布人工关口。对应 L4。\u003c/p>\n\u003cp>记住：\u003ccode>选题原则：真实 · 重复 · 有价值 · 今天跑得完\u003c/code>。绝大多数人选入门级或直接用上节课的周报场景，挑战级作为课后延伸。\u003c/p>\n\u003cblockquote>\n\u003cp>误区：一上来选挑战级双团队。先跑通一条，再加团队。\u003c/p>\n\u003c/blockquote>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003cp>以「每周竞品简报」为例，跟着一步步搭（你换成自己上节课选好的场景）：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>确认选题\u003c/strong>：真实、每周都要、有价值。\u003c/li>\n\u003cli>\u003cstrong>接连接器\u003c/strong>：配置资讯来源/文档连接器，指定监控对象——解决「数据从哪来」。连你自己场景对应的连接器（如腾讯文档）。\u003c/li>\n\u003cli>\u003cstrong>挂 Skill\u003c/strong>：选一个资讯/整理类 Skill 负责抓取归纳——解决「谁干活」。\u003c/li>\n\u003cli>\u003cstrong>写稳定模板\u003c/strong>：用万能公式把这条生产线的指令写死：\n   \u003ccode>背景：我要每周给团队出一份竞品动态简报。\n   目标：把本周抓取到的竞品动态整理成一份简报。\n   输入：&lt;连接器抓取的本周竞品资讯&gt;\n   输出要求：分\"重点动态/我们的机会/建议关注\"三段，每条注明来源链接，全文 600 字内，做成可发飞书的格式。\n   边界：只用抓到的真实信息，不要编造；信息不足的条目标注\"信息待核实\"。\n   验收：团队成员读完 3 分钟内知道本周竞品有什么新动作即合格。\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>跑通一次\u003c/strong>：执行，逐条对照验收标准打勾。\u003c/li>\n\u003cli>\u003cstrong>换输入复现\u003c/strong>：换一周/另一个监控对象再跑一次——两次都对才叫可复现，不是碰运气。\u003c/li>\n\u003cli>\u003cstrong>标人工关口\u003c/strong>：发布到飞书前，人工审一遍来源真假，这一步不自动。\n8.（可选进阶）设成每周定时自动跑。\u003c/li>\n\u003c/ol>\n\u003cp>每搭完一步，回头给六格清单打个勾。\n\u003cstrong>做对了应该看到\u003c/strong>：连接器√、Skill√、模板√、复现√、人工关口√——清单齐了，项目就成立。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：你带走的不是「会用一个 AI 工具」，而是一套把重复工作变成可复用生产线的方法论——拆解任务→定义角色→划清边界→留好人工关口→持续复盘。工具会变，思路不过时。\u003c/li>\n\u003cli>\u003cstrong>作业（结业作品）\u003c/strong>：按 6 项交付清单整理成一份文档——① 一段话说明（解决什么问题、原来怎么做、现在怎么做）；② 流程图/步骤说明；③ 可复制的提示词/模板；④ 人工关口清单；⑤ 一次真实运行的结果截图/产物；⑥ 复盘（省了多少时间、还有什么坑、下一步怎么优化）。选题要真实、重复、有价值，不是硬编的假流程。\u003c/li>\n\u003cli>\u003cstrong>寄语\u003c/strong>：去把你工作里最烦、最重复的那件事，做成第一条生产线。课到这里，但你的生产线才刚开始跑。\u003c/li>\n\u003c/ul>\n\u003ch3>讲师备注\u003c/h3>\n\u003cul>\n\u003cli>时间紧是本课最大风险，务必提前把示例生产线跑通，别现场调试连接器授权卡壳。\u003c/li>\n\u003cli>学员爱贪大选挑战级：课上只搭最小可跑闭环，多团队、定时自动化列为课后进阶。\u003c/li>\n\u003cli>连接器授权是高频卡点，也涉及套餐/功能可用性——一律回答「以官网 www.workbuddy.cn 为准」。\u003c/li>\n\u003c/ul>\n\u003chr />", "full_title": "教案 · 第 24 课 · 毕业项目：从零搭一条属于你的 AI 生产线"}]}, {"emoji": "🔥", "name": "高频痛点实战全解", "desc": "12 个真实场景的一步到位打法", "raw_title": "模块七 · 高频痛点实战全解 — 讲师教案", "lessons": [{"gid": 24, "no": 1, "label": "实战 1", "short": "周报/日报：从\"憋一小时\"到\"点一下\"", "summary": "每周五下午一到就头疼写周报。", "dur": "约 12 分钟", "kind": "shizhan", "html": "\u003ch3>本课信息\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时长\u003c/strong>：约 10-12 分钟｜\u003cstrong>课型\u003c/strong>：实操课（跟着做）\u003c/li>\n\u003cli>\u003cstrong>学完你能\u003c/strong>：把 40 分钟的周报压到 3 分钟，自动分好「本周完成/下周计划/需要支持」。\u003c/li>\n\u003c/ul>\n\u003ch3>开场\u003c/h3>\n\u003cp>每周五下午一到就头疼写周报？这周干了啥全忘了，翻聊天、翻文档、翻邮件，憋半天还写成流水账，领导一句「重点呢？」这一节把 40 分钟的周报压到 3 分钟，学完你今天就能用。\u003c/p>\n\u003ch3>讲透\u003c/h3>\n\u003cp>\u003cstrong>1. 前提：平时把零散工作记在一个地方\u003c/strong>\n准备一份腾讯文档叫「工作日志」，每天随手记一行。没有也行——每天随手发它一句「今天做了 X」同样可以。\u003c/p>\n\u003cp>\u003cstrong>2. 关键在把话说全\u003c/strong>\n别只说「写个周报」四个字，要把\u003cstrong>身份、素材来源、结构、字数、输出位置\u003c/strong>说清，最后再加一句「检查有没有编造」——它只能基于你给的素材，日志越具体周报越实。\u003c/p>\n\u003ch3>跟着做（演示 = 跟练，一边看一边暂停跟着做）\u003c/h3>\n\u003col>\n\u003cli>打开你的「工作日志」文档（或直接在指令里列三五条本周做的事）。\u003c/li>\n\u003cli>回到对话框，粘贴这段指令（把岗位改成你自己的）：\n   ```\n   我是【运营专员】。读取我腾讯文档「工作日志」里本周（周一到周五）的记录，\n   生成一份本周工作周报，要求：\u003c/li>\n\u003cli>分三部分：本周完成 / 下周计划 / 需要支持\u003c/li>\n\u003cli>「本周完成」按项目归类，每项写清\"做了什么+结果/数据\"\u003c/li>\n\u003cli>语气正式、条理清晰，控制在 500 字内\u003c/li>\n\u003cli>输出到腾讯文档「周报」文件夹，文件名\"周报-本周日期\"\n   完成后检查：有没有把日志里的事漏掉？有没有编造我没做过的事？\n   ```\u003c/li>\n\u003cli>生成后逐条验收。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>做对了应该看到\u003c/strong>：①三段结构齐；②每件事带「结果/数据」，不是「做了运营活动」而是「活动带来 XX 转化」；③控制在 500 字内；④没有它自己编、你根本没做的事。\u003c/p>\n\u003ch3>小结 · 作业\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>一句话记住\u003c/strong>：日志越具体，周报越实——别指望它凭空知道你干了啥。\u003c/li>\n\u003cli>\u003cstrong>作业\u003c/strong>：把指令里的岗位改成你自己的，跑一份真实周报出来。\u003c/li>\n\u003cli>\u003cstrong>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime.js 小白入门课 · Vibe Coding 视角</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --surface: #111115;
  --card: #18181c;
  --card2: #1e1e24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --txt: #f4f4f6;
  --txt2: #8b8b99;
  --txt3: #4a4a56;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #34d399;
  --orange: #fb923c;
  --pink: #f472b6;
  --cyan: #22d3ee;
  --yellow: #fbbf24;
  --serif: 'Noto Serif SC', serif;
  --sans: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

html {
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  overflow-y: scroll;
}

body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
}

/* === SLIDE BASE === */
.slide {
  width: 100vw;
  min-height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === NAV === */
#nav {
  position: fixed;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
}
#nav .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--txt3);
  cursor: pointer;
  transition: all 0.3s ease;
}
#nav .dot.active {
  background: var(--accent2);
  transform: scale(1.5);
}

#counter {
  position: fixed;
  bottom: 24px;
  right: 28px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--txt3);
  z-index: 100;
  letter-spacing: 0.05em;
}

/* === PROGRESS BAR === */
#progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  z-index: 200;
  transition: width 0.4s ease;
}

/* === TYPOGRAPHY === */
.slide-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: 16px;
  opacity: 0.8;
}

h1.hero-title {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--txt);
}

h2.section-title {
  font-family: var(--serif);
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.lead {
  font-size: 17px;
  line-height: 1.7;
  color: var(--txt2);
  max-width: 560px;
}

/* === LAYOUT HELPERS === */
.inner {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 48px;
}

.cols2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}
.cols3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* === CARDS === */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}

/* === CODE BLOCKS === */
pre.code-block {
  background: #0d0d11;
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 20px 24px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  overflow-x: auto;
  color: #c9d1d9;
}
.kw { color: #ff7b72; }
.fn { color: #d2a8ff; }
.str { color: #a5d6ff; }
.num { color: #79c0ff; }
.cmt { color: #8b949e; font-style: italic; }
.prop { color: #ffa657; }

/* === STEP BADGES === */
.step-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: white;
  flex-shrink: 0;
}

.step-item {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.step-item:last-child { border-bottom: none; }
.step-content h4 { font-size: 15px; margin-bottom: 4px; color: var(--txt); }
.step-content p { font-size: 13px; color: var(--txt2); line-height: 1.6; }

/* === PROMPT BUBBLE === */
.prompt-bubble {
  background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(99,102,241,0.05));
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--txt);
  position: relative;
}
.prompt-bubble::before {
  content: '💬 你对AI说';
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--accent2);
  display: block;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.ai-bubble {
  background: linear-gradient(135deg, rgba(52,211,153,0.1), rgba(52,211,153,0.03));
  border: 1px solid rgba(52,211,153,0.25);
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--txt);
  position: relative;
}
.ai-bubble::before {
  content: '🤖 AI 返回';
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--green);
  display: block;
  margin-bottom: 8px;
  text-transform: uppercase;
}

/* === TAG PILLS === */
.pill {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-family: var(--mono);
  letter-spacing: 0.03em;
}
.pill-green { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
.pill-orange { background: rgba(251,146,60,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.25); }
.pill-purple { background: rgba(99,102,241,0.15); color: var(--accent2); border: 1px solid rgba(99,102,241,0.25); }
.pill-cyan { background: rgba(34,211,238,0.12); color: var(--cyan); border: 1px solid rgba(34,211,238,0.25); }

/* === DEMO IFRAME === */
.demo-frame-wrap {
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border2);
  background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.demo-frame-wrap iframe {
  width: 100%; height: 420px;
  border: none;
  display: block;
}
.demo-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: #0d0d11;
  border-bottom: 1px solid var(--border);
}
.demo-dot { width:10px;height:10px;border-radius:50%; }
.demo-dot.r{background:#ff5f57;} .demo-dot.y{background:#febc2e;} .demo-dot.g{background:#28c840;}

/* === HIGHLIGHT NUMBER === */
.big-num {
  font-family: var(--mono);
  font-size: 56px;
  font-weight: 500;
  line-height: 1;
  color: var(--accent2);
}

/* === CHECKLIST === */
.checklist { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.checklist li {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 14px; color: var(--txt2); line-height: 1.6;
}
.checklist li::before {
  content: '✓';
  color: var(--green);
  font-family: var(--mono);
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}

/* === DIVIDER === */
.hdiv {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent);
  margin: 24px 0;
}

/* === ANIMATION DEMO INLINE === */
.anim-demo-box {
  display: flex; align-items: center; justify-content: center;
  height: 120px;
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.anim-ball {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  animation: ballBounce 2s ease-in-out infinite alternate;
}
@keyframes ballBounce {
  from { transform: translateX(-80px); }
  to { transform: translateX(80px); }
}

/* === SCROLL HINT === */
.scroll-hint {
  position: absolute;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: var(--txt3);
  font-size: 11px; font-family: var(--mono);
  letter-spacing: 0.1em;
  animation: hintFade 3s ease-in-out infinite;
}
.scroll-hint svg { opacity: 0.5; }
@keyframes hintFade { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* === CHAPTER HEAD === */
.chapter-head {
  display: flex; align-items: center; gap: 16px; margin-bottom: 32px;
}
.chapter-num {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
  color: var(--txt3); text-transform: uppercase;
}

/* === QUOTE === */
.blockquote {
  border-left: 3px solid var(--accent);
  padding: 12px 0 12px 20px;
  font-size: 15px;
  color: var(--txt2);
  font-style: italic;
  line-height: 1.7;
}

/* === HERO BG GLOW === */
.hero-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="nav"></div>
<div id="counter">01 / 08</div>
<div id="deck"></div>
<script src="slides.js"></script>
<script src="slides2.js"></script>
<script src="mount.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVANS · Capsule</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    padding: 40px 20px;
  }

  .card {
    width: 500px;
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    padding: 22px 22px 20px;
    position: relative;
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.035;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .header-icon {
    font-size: 17px;
    color: #0A84FF;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: rgba(245,245,247,0.95);
    letter-spacing: -0.01em;
  }

  /* Person Rows */
  .person-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.55s cubic-bezier(0.19, 1, 0.22, 1),
                transform 0.55s cubic-bezier(0.19, 1, 0.22, 1);
  }

  .person-row + .person-row {
    border-top: 0.5px solid rgba(255,255,255,0.08);
  }

  .person-row.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Avatar circle */
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 0.5px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 600;
    color: rgba(245,245,247,0.95);
  }

  .avatar.icon-circle {
    background: rgba(10,132,255,0.1);
    border-color: rgba(10,132,255,0.2);
  }

  .avatar.icon-circle i {
    font-size: 20px;
    color: #0A84FF;
  }

  /* Person info */
  .person-info {
    flex: 1;
    min-width: 0;
  }

  .person-name {
    font-size: 14px;
    font-weight: 600;
    color: rgba(245,245,247,0.95);
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }

  .person-detail {
    font-size: 11px;
    color: rgba(245,245,247,0.5);
    letter-spacing: 0.005em;
  }

  /* Right side */
  .person-right {
    flex-shrink: 0;
  }

  .badge-years {
    background: rgba(10,132,255,0.15);
    border: 0.5px solid rgba(10,132,255,0.3);
    border-radius: 20px;
    padding: 3px 9px;
    font-size: 10px;
    font-weight: 600;
    color: #0A84FF;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* Play button */
  .play-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 11px;
    color: rgba(245,245,247,0.8);
    font-family: inherit;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .play-btn:hover {
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.06) 100%);
    border-color: rgba(255,255,255,0.22);
  }

  .play-btn i {
    font-size: 12px;
    color: #0A84FF;
  }

  /* Divider */
  .divider {
    height: 0.5px;
    background: rgba(255,255,255,0.08);
    margin: 6px 0 14px;
  }

  /* Footer quote */
  .footer-quote {
    font-size: 12px;
    color: rgba(245,245,247,0.3);
    font-style: italic;
    text-align: right;
    line-height: 1.55;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <i class="ph ph-graph header-icon"></i>
    <span class="header-title">EVANS · 关系记忆</span>
  </div>

  <!-- Row 1 -->
  <div class="person-row" id="row-0">
    <div class="avatar">兰</div>
    <div class="person-info">
      <div class="person-name">陈兰（妻）</div>
      <div class="person-detail">忌日 11月3日 · 共同记忆 2,847 条</div>
    </div>
    <div class="person-right">
      <span class="badge-years">相识 43 年</span>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="person-row" id="row-1">
    <div class="avatar">军</div>
    <div class="person-info">
      <div class="person-name">陈军（儿子）</div>
      <div class="person-detail">上次通话 3天前 · 北京</div>
    </div>
    <div class="person-right">
      <span class="badge-years">相识 38 年</span>
    </div>
  </div>

  <!-- Row 3 — Capsule -->
  <div class="person-row" id="row-2">
    <div class="avatar icon-circle">
      <i class="ph ph-play-circle"></i>
    </div>
    <div class="person-info">
      <div class="person-name">时间胶囊 · 陈兰留言</div>
      <div class="person-detail">录制于 2019年9月 · 时长 2分14秒</div>
    </div>
    <div class="person-right">
      <button class="play-btn">
        <i class="ph ph-play"></i>
        播放
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="footer-quote">
    她说，如果有一天你一个人，就让它陪着你。
  </div>
</div>

<script>
  const rows = ['row-0', 'row-1', 'row-2'];
  rows.forEach((id, i) => {
    setTimeout(() => {
      document.getElementById(id).classList.add('visible');
    }, 120 + i * 200);
  });
</script>
</body>
</html>

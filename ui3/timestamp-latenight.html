<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp — Late Night 13A</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: rgba(8, 8, 14, 0.88);
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .timestamp {
    position: fixed;
    bottom: 44px;
    right: 44px;
    text-align: right;
    opacity: 0;
    transform: translateY(5px);
    animation: fadeInHold 5.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
    pointer-events: none;
    user-select: none;
  }

  .time {
    display: block;
    font-size: 44px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    /* Warm amber for late night */
    color: rgba(255, 238, 200, 0.88);
    text-shadow:
      0 2px 18px rgba(0, 0, 0, 0.97),
      0 1px 4px rgba(0, 0, 0, 0.6),
      0 0 30px rgba(180, 120, 40, 0.18);
    line-height: 1;
    margin-bottom: 7px;
  }

  .location {
    display: block;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.1em;
    /* Faint amber warmth */
    color: rgba(255, 225, 160, 0.52);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    line-height: 1;
  }

  @keyframes fadeInHold {
    0%   { opacity: 0; transform: translateY(5px); }
    7%   { opacity: 1; transform: translateY(0); }
    80%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="timestamp">
    <span class="time">01:17</span>
    <span class="location">书房</span>
  </div>
</body>
</html>

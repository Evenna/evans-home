<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp — Late Night 13A</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: rgba(10, 15, 30, 0.85);
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    overflow: hidden;
  }

  .timestamp {
    position: fixed;
    bottom: 32px;
    right: 32px;
    text-align: right;
    opacity: 0;
    animation: fadeInHold 5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
    pointer-events: none;
    user-select: none;
  }

  .time {
    display: block;
    font-size: 28px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    /* Slightly amber-warm for late night mood */
    color: rgba(255, 240, 210, 0.75);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    line-height: 1;
  }

  .location {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.08em;
    /* Faint amber warmth */
    color: rgba(255, 230, 180, 0.45);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    line-height: 1;
  }

  @keyframes fadeInHold {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="timestamp">
    <span class="time">01:17</span>
    <span class="location">书房</span>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVANS · Options</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #07080c;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    padding: 40px 20px;
  }

  /* 外层卡片：唯一一层 glass */
  .card {
    width: 420px;
    background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.13);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.16);
    padding: 22px 20px 20px;
    position: relative;
    /* 不设 overflow:hidden，让内容自然展开 */
  }

  /* SVG 噪点纹理 */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.04;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 0;
  }

  .card > * { position: relative; z-index: 1; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  .header .icon { font-size: 16px; color: #0A84FF; line-height: 1; }
  .header .title {
    font-size: 14px;
    font-weight: 600;
    color: rgba(245,245,247,0.95);
    letter-spacing: -0.01em;
  }

  .sub-line {
    font-size: 12px;
    color: rgba(245,245,247,0.38);
    margin-bottom: 18px;
    padding-left: 24px;
    letter-spacing: -0.005em;
  }

  /* Option 列表 */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 18px;
  }

  /* 选项卡：不用 backdrop-filter，用纯色填充 */
  .option-card {
    background: rgba(255,255,255,0.055);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s cubic-bezier(0.19, 1, 0.22, 1),
                transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
  }

  .option-card.visible { opacity: 1; transform: translateY(0); }

  /* muted: A/B 暗一点但仍可见 */
  .option-card.muted { background: rgba(255,255,255,0.04); }
  .option-card.muted.visible { opacity: 0.72; }

  /* highlighted: C */
  .option-card.highlighted {
    background: rgba(10,132,255,0.09);
    border: 0.5px solid rgba(10,132,255,0.38);
    box-shadow: 0 0 0 1px rgba(10,132,255,0.08) inset;
  }

  .option-label {
    font-size: 10px;
    color: rgba(245,245,247,0.28);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .option-title {
    font-size: 15px;
    font-weight: 600;
    color: rgba(245,245,247,0.92);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .option-title.blue { color: rgba(10,132,255,0.92); }

  .option-desc {
    font-size: 12px;
    color: rgba(245,245,247,0.45);
    line-height: 1.45;
  }

  .option-note {
    font-size: 12px;
    color: #0A84FF;
    margin-top: 5px;
    opacity: 0.85;
  }

  /* 推荐徽章 */
  .badge-recommend {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(10,132,255,0.16);
    border: 0.5px solid rgba(10,132,255,0.32);
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 10px;
    font-weight: 600;
    color: #4da3ff;
    letter-spacing: 0.03em;
  }

  /* 分割线 */
  .separator {
    height: 0.5px;
    background: rgba(255,255,255,0.07);
    margin-bottom: 15px;
  }

  /* 底部引语 */
  .footer-quote {
    border-left: 1.5px solid rgba(10,132,255,0.5);
    padding-left: 12px;
  }
  .footer-quote p {
    font-size: 12.5px;
    color: rgba(245,245,247,0.38);
    font-style: italic;
    line-height: 1.6;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <i class="ph ph-scales icon"></i>
    <span class="title">EVANS · 你还可以这样选</span>
  </div>
  <p class="sub-line">关于这份工作邀约——</p>

  <div class="options-list">
    <!-- A -->
    <div class="option-card muted" id="opt-a">
      <span class="option-label">选项 A</span>
      <div class="option-title">直接拒绝</div>
      <div class="option-desc">不影响现有关系，但机会关闭</div>
    </div>

    <!-- B -->
    <div class="option-card muted" id="opt-b">
      <span class="option-label">选项 B</span>
      <div class="option-title">立刻接受</div>
      <div class="option-desc">需协调当前项目收尾</div>
    </div>

    <!-- C -->
    <div class="option-card highlighted" id="opt-c">
      <div class="badge-recommend">推荐</div>
      <span class="option-label">选项 C</span>
      <div class="option-title blue">要求两周后再决定</div>
      <div class="option-desc">先了解团队 · 通常接受</div>
      <div class="option-note">你的选择权保留更长</div>
    </div>
  </div>

  <div class="separator"></div>

  <div class="footer-quote">
    <p>它不告诉你怎么选，它告诉你，你还可以怎么选。</p>
  </div>
</div>

<script>
  const cards = [
    { el: document.getElementById('opt-a'), delay: 120 },
    { el: document.getElementById('opt-b'), delay: 260 },
    { el: document.getElementById('opt-c'), delay: 420 },
  ];
  cards.forEach(({ el, delay }) => {
    setTimeout(() => el.classList.add('visible'), delay);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=480, initial-scale=1.0">
<title>EVANS · Filter</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 480px;
    padding: 48px 20px;
  }

  .card {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    padding: 24px 24px 20px;
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.035;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.7s cubic-bezier(0.19, 1, 0.22, 1) 0.05s forwards;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(245,245,247,0.5);
    font-weight: 500;
    text-transform: uppercase;
  }

  .ph-funnel {
    color: rgba(245,245,247,0.4);
    font-size: 14px;
  }

  .filter-stats {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .stat-total {
    font-size: 13px;
    color: rgba(245,245,247,0.3);
    text-decoration: line-through;
    text-decoration-color: rgba(245,245,247,0.2);
    font-variant-numeric: tabular-nums;
  }

  .stat-arrow {
    color: rgba(245,245,247,0.3);
    font-size: 12px;
  }

  .stat-important {
    font-size: 15px;
    font-weight: 700;
    color: rgba(245,245,247,0.95);
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(245,245,247,0.5);
    font-weight: 400;
  }

  /* Message rows */
  .messages {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    padding: 11px 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
    opacity: 0;
    transform: translateY(8px);
  }

  .msg-row:last-child { border-bottom: none; }

  .msg-row.anim-0 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.10s forwards; }
  .msg-row.anim-1 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.22s forwards; }
  .msg-row.anim-2 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.34s forwards; }
  .msg-row.anim-3 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.46s forwards; }
  .msg-row.anim-4 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.58s forwards; }

  .msg-row.filtered { opacity: 0; }
  .msg-row.filtered.anim-2 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.34s forwards; }
  .msg-row.filtered.anim-3 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.46s forwards; }
  .msg-row.filtered.anim-4 { animation: fadeUp 0.65s cubic-bezier(0.19, 1, 0.22, 1) 0.58s forwards; }

  .msg-top {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }

  .dot-icon {
    font-size: 10px;
    flex-shrink: 0;
  }

  .dot-icon.active { color: #0A84FF; }
  .dot-icon.dim { color: rgba(245,245,247,0.2); }

  .msg-sender {
    font-size: 13px;
    font-weight: 600;
    color: rgba(245,245,247,0.95);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-sender.filtered-text {
    color: rgba(245,245,247,0.25);
    text-decoration: line-through;
    text-decoration-color: rgba(245,245,247,0.15);
  }

  .badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.01em;
  }

  .badge.important {
    background: rgba(10,132,255,0.12);
    color: #0A84FF;
    border: 0.5px solid rgba(10,132,255,0.2);
  }

  .badge.filtered-badge {
    background: rgba(255,255,255,0.05);
    color: rgba(245,245,247,0.2);
    border: 0.5px solid rgba(255,255,255,0.08);
  }

  .msg-content {
    font-size: 13px;
    color: rgba(245,245,247,0.5);
    padding-left: 17px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-content.filtered-text {
    color: rgba(245,245,247,0.18);
    text-decoration: line-through;
    text-decoration-color: rgba(245,245,247,0.1);
  }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 4px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.19, 1, 0.22, 1) 0.72s forwards;
  }

  .footer i {
    font-size: 13px;
    color: rgba(245,245,247,0.3);
  }

  .footer-text {
    font-size: 11px;
    color: rgba(245,245,247,0.3);
  }

  .footer-link {
    font-size: 11px;
    color: #0A84FF;
    text-decoration: none;
    cursor: pointer;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="label">EVANS</span>
        <i class="ph ph-funnel"></i>
      </div>
      <div class="filter-stats">
        <span class="stat-total">138</span>
        <i class="ph ph-arrow-right stat-arrow"></i>
        <span class="stat-important">5</span>
        <span class="stat-label">重要</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages">

      <!-- Row 1: Important -->
      <div class="msg-row anim-0">
        <div class="msg-top">
          <i class="ph ph-dot dot-icon active"></i>
          <span class="msg-sender">导师 · 王教授</span>
          <span class="badge important">重要</span>
        </div>
        <div class="msg-content">周五组会改到10点，请确认</div>
      </div>

      <!-- Row 2: Important -->
      <div class="msg-row anim-1">
        <div class="msg-top">
          <i class="ph ph-dot dot-icon active"></i>
          <span class="msg-sender">妈妈</span>
          <span class="badge important">重要</span>
        </div>
        <div class="msg-content">今晚有空视频吗</div>
      </div>

      <!-- Row 3: Filtered -->
      <div class="msg-row filtered anim-2">
        <div class="msg-top">
          <i class="ph ph-minus dot-icon dim"></i>
          <span class="msg-sender filtered-text">京东官方</span>
          <span class="badge filtered-badge">已过滤</span>
        </div>
        <div class="msg-content filtered-text">京东618 大促 限时...</div>
      </div>

      <!-- Row 4: Filtered -->
      <div class="msg-row filtered anim-3">
        <div class="msg-top">
          <i class="ph ph-minus dot-icon dim"></i>
          <span class="msg-sender filtered-text">校园通知</span>
          <span class="badge filtered-badge">已过滤</span>
        </div>
        <div class="msg-content filtered-text">校园营销推广活动报名...</div>
      </div>

      <!-- Row 5: Filtered -->
      <div class="msg-row filtered anim-4">
        <div class="msg-top">
          <i class="ph ph-minus dot-icon dim"></i>
          <span class="msg-sender filtered-text">招商银行</span>
          <span class="badge filtered-badge">已过滤</span>
        </div>
        <div class="msg-content filtered-text">招商银行积分兑换提醒...</div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <i class="ph ph-archive"></i>
      <span class="footer-text">133条已归档 ·</span>
      <span class="footer-link">查看归档</span>
    </div>

  </div>
</div>
</body>
</html>

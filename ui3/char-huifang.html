<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慧芳 — Character Card</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: rgba(14, 20, 38, 0.88);
      font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* ── Lower-third container ── */
    .lower-third {
      position: fixed;
      bottom: 48px;
      left: 48px;
      display: flex;
      flex-direction: column;
      animation: holdThenOut 0.35s ease-in 5.6s forwards;
    }

    /* ── Accent line ── */
    .accent-line {
      width: 200px;
      height: 2px;
      background: rgba(245, 245, 247, 0.78);
      box-shadow: 0 0 6px rgba(245, 245, 247, 0.22);
      transform-origin: left center;
      transform: scaleX(0);
      margin-bottom: 14px;
      animation: lineDrawIn 0.4s cubic-bezier(0.19, 1, 0.22, 1) 0.2s forwards;
    }

    @keyframes lineDrawIn {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ── Name — clip-path reveal ── */
    .char-name {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: rgba(245, 245, 247, 0.97);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.92), 0 1px 4px rgba(0, 0, 0, 0.7);
      clip-path: inset(0 100% 0 0);
      animation: nameReveal 0.55s cubic-bezier(0.77, 0, 0.175, 1) 0.65s forwards;
      margin-bottom: 9px;
      padding-bottom: 3px;
    }

    @keyframes nameReveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0%   0 0); }
    }

    /* ── Subtitle ── */
    .char-subtitle {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(245, 245, 247, 0.75);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.88);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s cubic-bezier(0.19, 1, 0.22, 1) 0.95s forwards;
      margin-bottom: 6px;
    }

    /* ── Role ── */
    .char-role {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(245, 245, 247, 0.48);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s cubic-bezier(0.19, 1, 0.22, 1) 1.15s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes holdThenOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="lower-third">
    <div class="accent-line"></div>
    <div class="char-name">慧芳</div>
    <div class="char-subtitle">45岁 · 中学教师</div>
    <div class="char-role">Evans 佩戴者 · 第5个月</div>
  </div>

</body>
</html>

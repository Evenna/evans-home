<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVANS · Home</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    position: relative;
  }

  /* Ambient background for demo context */
  .bg-ambient {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 70% 60%, rgba(255,180,80,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 30% 30%, rgba(10,132,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Glass pill */
  .pill {
    position: fixed;
    right: 40px;
    bottom: 120px;
    width: 220px;
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    padding: 14px 16px;
    overflow: hidden;
    position: fixed;
  }

  .pill::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.035;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .pill-header {
    font-size: 11px;
    color: rgba(245,245,247,0.5);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* Action row */
  .action-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 0;
    opacity: 0;
    transform: translateX(10px);
    transition: opacity 0.6s cubic-bezier(0.19, 1, 0.22, 1),
                transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
  }

  .action-row + .action-row {
    border-top: 0.5px solid rgba(255,255,255,0.06);
    margin-top: 2px;
  }

  .action-row.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .action-icon {
    font-size: 14px;
    color: #0A84FF;
    flex-shrink: 0;
    width: 16px;
    text-align: center;
  }

  .action-text {
    font-size: 13px;
    color: rgba(245,245,247,0.95);
    flex: 1;
    letter-spacing: -0.005em;
    line-height: 1.3;
  }

  .check-icon {
    font-size: 12px;
    color: #30D158;
    flex-shrink: 0;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.4s cubic-bezier(0.19, 1, 0.22, 1),
                transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
  }

  .check-icon.visible {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>
<div class="bg-ambient"></div>

<div class="pill" id="pill">
  <div class="pill-header">EVANS · 已为你准备好</div>

  <div class="action-row" id="row-0">
    <i class="ph ph-sun action-icon"></i>
    <span class="action-text">灯光调至 38% · 暖调</span>
    <i class="ph ph-check check-icon" id="chk-0"></i>
  </div>

  <div class="action-row" id="row-1">
    <i class="ph ph-thermometer action-icon"></i>
    <span class="action-text">空调 26°C</span>
    <i class="ph ph-check check-icon" id="chk-1"></i>
  </div>

  <div class="action-row" id="row-2">
    <i class="ph ph-coffee action-icon"></i>
    <span class="action-text">热水壶 · 已加热</span>
    <i class="ph ph-check check-icon" id="chk-2"></i>
  </div>

  <div class="action-row" id="row-3">
    <i class="ph ph-moon action-icon"></i>
    <span class="action-text">窗帘 · 已拉上</span>
    <i class="ph ph-check check-icon" id="chk-3"></i>
  </div>
</div>

<script>
  const rowCount = 4;
  const baseDelay = 200;
  const rowStagger = 600;
  const checkDelay = 300;

  for (let i = 0; i < rowCount; i++) {
    const row = document.getElementById('row-' + i);
    const chk = document.getElementById('chk-' + i);
    const t = baseDelay + i * rowStagger;

    setTimeout(() => {
      row.classList.add('visible');
    }, t);

    setTimeout(() => {
      chk.classList.add('visible');
    }, t + checkDelay);
  }
</script>
</body>
</html>

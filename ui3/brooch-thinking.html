<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brooch Thinking</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: rgba(10, 12, 22, 0.88);
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .brooch-thinking {
    position: fixed;
    bottom: 44px;
    right: 44px;

    /* Glass pill */
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 10px 13px;

    background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.13);
    border-radius: 30px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);

    opacity: 0;
    transform: translateY(4px);
    animation: pillFadeIn 0.45s cubic-bezier(0.19, 1, 0.22, 1) 0.3s forwards;
    pointer-events: none;
    user-select: none;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(10, 132, 255, 0.88);
    box-shadow: 0 0 10px rgba(10, 132, 255, 0.55), 0 0 4px rgba(10, 132, 255, 0.4);
    flex-shrink: 0;
    animation: breathe 1.6s ease-in-out infinite;
  }

  .label {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: rgba(245, 245, 247, 0.78);
    line-height: 1;
    white-space: nowrap;
  }

  @keyframes pillFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes breathe {
    0%   { transform: scale(1);    opacity: 0.88; }
    50%  { transform: scale(0.82); opacity: 0.55; }
    100% { transform: scale(1);    opacity: 0.88; }
  }
</style>
</head>
<body>
  <div class="brooch-thinking">
    <div class="pulse-dot"></div>
    <span class="label">Evans · 处理中</span>
  </div>
</body>
</html>

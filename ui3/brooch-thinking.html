<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brooch Thinking</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000000;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    overflow: hidden;
  }

  .brooch-thinking {
    position: fixed;
    bottom: 40px;
    right: 40px;
    width: 180px;
    height: 36px;

    /* Glass card */
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);

    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 14px;

    opacity: 0;
    animation: pillFadeIn 0.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    pointer-events: none;
    user-select: none;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(10, 132, 255, 0.8);
    box-shadow: 0 0 8px rgba(10, 132, 255, 0.5);
    flex-shrink: 0;
    animation: breathe 1.5s ease-in-out infinite;
  }

  .label {
    font-size: 12px;
    font-weight: 400;
    color: rgba(245, 245, 247, 0.7);
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
  }

  @keyframes pillFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes breathe {
    0%   { transform: scale(0.85); box-shadow: 0 0 5px rgba(10, 132, 255, 0.3); }
    50%  { transform: scale(1.0);  box-shadow: 0 0 10px rgba(10, 132, 255, 0.6); }
    100% { transform: scale(0.85); box-shadow: 0 0 5px rgba(10, 132, 255, 0.3); }
  }
</style>
</head>
<body>
  <div class="brooch-thinking">
    <div class="pulse-dot"></div>
    <span class="label">Evans · 处理中</span>
  </div>
</body>
</html>

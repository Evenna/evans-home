<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brooch Silent — 16A</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .brooch-silent {
    position: fixed;
    bottom: 44px;
    right: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeIn 0.7s ease-out 1s forwards;
    pointer-events: none;
    user-select: none;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(245, 245, 247, 0.22);
    border: 0.5px solid rgba(245, 245, 247, 0.32);
    flex-shrink: 0;
    /* Explicitly NO animation — static dot */
  }

  .label {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.14em;
    color: rgba(245, 245, 247, 0.44);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    line-height: 1;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="brooch-silent">
    <div class="dot"></div>
    <span class="label">胸针 · 主动沉默</span>
  </div>
</body>
</html>

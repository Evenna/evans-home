<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVANS · Waveform</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    padding: 40px 20px;
  }

  /* Main card */
  .card {
    width: 340px;
    background: linear-gradient(135deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    padding: 18px 20px 16px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: cardFadeIn 0.4s ease-out 0.05s forwards;
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.035;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* Header row */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-left i {
    font-size: 14px;
    color: rgba(245,245,247,0.4);
  }

  .now-playing {
    font-size: 12px;
    color: rgba(245,245,247,0.5);
    letter-spacing: 0.01em;
  }

  .timer {
    font-size: 12px;
    color: rgba(245,245,247,0.5);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    font-weight: 500;
  }

  /* Waveform container */
  .waveform-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 56px;
    margin-bottom: 14px;
  }

  .bar {
    width: 3px;
    border-radius: 2px;
    background: rgba(10,132,255,0.7);
    box-shadow: 0 0 6px rgba(10,132,255,0.4);
    min-height: 4px;
    transition: height 0s;
    will-change: height;
    flex-shrink: 0;
  }

  /* Separator */
  .separator {
    height: 0.5px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }

  /* Footer label */
  .footer-label {
    font-size: 11px;
    color: rgba(245,245,247,0.25);
    text-align: center;
    letter-spacing: 0.025em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header-row">
    <div class="header-left">
      <i class="ph ph-speaker-high"></i>
      <span class="now-playing">正在播放</span>
    </div>
    <span class="timer" id="timer">0:12</span>
  </div>

  <div class="waveform-wrap" id="waveform"></div>

  <div class="separator"></div>

  <div class="footer-label">陈兰 · 2019年</div>
</div>

<script>
  // ── Timer ────────────────────────────────────────────────
  let elapsed = 12; // seconds, starting at 0:12
  const timerEl = document.getElementById('timer');

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  setInterval(() => {
    elapsed++;
    timerEl.textContent = formatTime(elapsed);
  }, 1000);

  // ── Waveform ─────────────────────────────────────────────
  const BAR_COUNT = 32;
  const waveformEl = document.getElementById('waveform');
  const bars = [];

  // Envelope: gaussian-ish peak at center
  function envelope(i) {
    const center = (BAR_COUNT - 1) / 2;
    const norm = (i - center) / center; // -1 to 1
    return Math.max(0.08, 1 - norm * norm * 0.88);
  }

  // Independent phase offsets and speed multipliers per bar
  const phaseOffsets = [];
  const speedMults = [];
  const ampMults = [];

  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '6px';
    waveformEl.appendChild(bar);
    bars.push(bar);

    // Pseudo-random but deterministic offsets
    phaseOffsets.push((i * 1.37 + Math.sin(i * 0.8) * 2.1) % (Math.PI * 2));
    speedMults.push(0.85 + (((i * 7919) % 100) / 100) * 0.4);  // 0.85 - 1.25
    ampMults.push(0.7 + (((i * 3571) % 100) / 100) * 0.6);      // 0.7 - 1.3
  }

  const MAX_H = 48;
  const MIN_H = 5;

  let startTime = null;

  function animate(ts) {
    if (!startTime) startTime = ts;
    const t = (ts - startTime) / 1000; // seconds

    for (let i = 0; i < BAR_COUNT; i++) {
      const env = envelope(i);
      const speed = speedMults[i];
      const amp = ampMults[i];
      const phase = phaseOffsets[i];

      // Layered sin for organic feel
      const wave =
        Math.sin(t * speed * 2.8 + phase) * 0.55 +
        Math.sin(t * speed * 1.5 + phase * 1.7) * 0.28 +
        Math.sin(t * speed * 4.1 + phase * 0.5) * 0.17;

      // Normalize wave from -1..1 to 0..1
      const norm = (wave + 1) / 2;
      const rawH = MIN_H + norm * amp * env * (MAX_H - MIN_H);
      const h = Math.max(MIN_H, Math.min(MAX_H, rawH));

      bars[i].style.height = h.toFixed(1) + 'px';
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>

<textarea id="t" readonly>【钩子】
同样一个 AI，为什么有人用得又快又准，你却得反复改？
差的不是 AI，是有人给它加了一样东西——Skill。
今天六分钟，从它是什么，到你自己怎么用，一次讲透。

【黑板 ①：它从哪来，是谁提出的】
先说来历，你就知道这东西不是小打小闹。
Skill 是 Anthropic 提出来的——就是做 Claude 的那家公司。2025 年 10 月，他们正式发布了 Agent Skills；到 12 月，干脆把它开源成了一个跨平台的通用标准，谁都能用。
他们当时打了个特别准的比方：**给 AI 写一个 Skill，就像给一个新员工写入职指南。** 这人很聪明，但刚进公司什么规矩都不懂，你把&quot;这类活该怎么干&quot;写成一份指南递给他，他照着就能上手。
为什么大公司要专门造这么个东西？因为模型再聪明，也不懂你这一行的具体规矩、具体流程。Skill 就是把这些&quot;专业知识和干活流程&quot;打包，喂给 AI。

【黑板 ②：它在 AI Agent 里是哪一环】
那它在整个 AI 里处于什么位置？现在能帮你干活的 AI 叫 Agent，它干活靠四样东西配合。
第一，大模型，聪明的脑子，会说话、会推理，但很通用。
第二，记忆，让它记得住你——你是谁、你的偏好。
第三，工具，让它有手有脚——能上网、能跑代码、能改文件。
第四，才是 Skill——前三样是硬件，Skill 是打法。
它不比谁高级，就是这四样里专门管&quot;某类活该怎么干&quot;的那一环。一句话：脑子、记忆、工具解决&quot;能不能干&quot;，Skill 解决&quot;干得好不好&quot;。

【黑板 ③：两个最容易混的东西】
Skill 有两个特别容易搞混的邻居，一次讲清。
**第一个，记忆。** 记忆存的是&quot;名词&quot;——关于你的事实；Skill 存的是&quot;动词&quot;——做事的流程。&quot;这个用户是清华的&quot;，是事实，进记忆；&quot;写简历要先核实再拔高&quot;，是流程，进 Skill。
**第二个更容易混——system prompt，系统提示词。** 很多人觉得这俩不一样吗，都是给 AI 定规矩。差在两点。
一，system prompt 是**总规矩、永远生效**，比如&quot;你是个严谨的助手、说话简洁&quot;，问什么它都在后台管着；Skill 是**专项打法、用到才调出来**，你不写小红书，那条 Skill 就不出现。
二，system prompt 只有一份，什么都往里塞会越来越乱；Skill 可以有几十上百个，一个管一类活。
所以：system prompt 是底色，Skill 是招式。

【黑板 ④：顶尖 Skill 长什么样，亮点在哪】
讲个真的。Anthropic 官方自己做的第一批 Skill，就是四个最常用的办公文档——PPT、Excel、Word、PDF。你让 Claude 做张 PPT、填个 PDF 表格，背后调的就是这些 Skill。
拿 PDF 那个举例，它的聪明之处不在&quot;写了多少字&quot;，在于**分层加载**。这是整套设计最漂亮的地方，官方叫&quot;渐进式披露&quot;，我用大白话讲：
第一层，AI 平时只记住每个 Skill 的一句话简介——&quot;这是干嘛的、啥时候用&quot;，特别省内存。
第二层，等你真要用了，它才把这个 Skill 的正文完整读进来。
第三层，如果这活儿还有更细的分支——比如&quot;填表单&quot;这种特殊情况——它才去翻对应的那个附属文件。
好处是什么？**一个 Skill 想写多详细都行，也不会拖慢 AI**，因为它永远只在需要的那一刻，读需要的那一部分。这就是好 Skill 的设计精髓：该用才调、按需才读。

【黑板 ⑤：普通人到底在什么场景用 Skill】
说了半天，最实在的问题：**我普通人，什么时候该去找一个 Skill 来用？** 给你三个场景，对号入座。
**场景一：你想把一件事做得更专业、更好看。**
最典型的就是——你让 AI 做个网页、做个 UI，出来总是很朴素、很像半成品。这时候你就该去装一个&quot;前端设计&quot;或者&quot;UI 美化&quot;类的 Skill，它里面存着专业的配色、排版、组件规范，AI 一照着做，出来的东西立马上一个档次。同理，做 PPT、写小红书文案、做数据图表——每一类都有对应的高分 Skill 可以搜来用。
**场景二：给你自己长期用的 AI，预装一批&quot;底层 Skill&quot;。**
这类不是干某件活的，是让 AI 本身变得更好用。最该装的就是**记忆管理**类的 Skill——让它学会主动记住你的偏好、你的项目、你纠正过它的地方，越用越懂你，不用你每次从头交代。这种是&quot;一次装好、天天受益&quot;的。
**场景三：把你自己反复在干的活，让 AI 帮你沉淀成 Skill。**
这是最高阶、也最省事的一招。你注意观察——**哪件事你每周都在重复做，而且每次都得跟 AI 交代一遍同样的要求**？比如每周整理用户反馈、做周报、清理数据。这种活，你就可以直接跟 AI 说：&quot;把咱们刚才这套做法，帮我存成一个 Skill。&quot;下次一句话，它就照着这套标准来，不用你再讲第二遍。
一句话总结这三种：**想做得更好，去搜现成的；想让 AI 更懂你，预装底层的；想一劳永逸，把自己的经验沉淀成新的。**

【收尾】
所以回到开头：为什么有人用 AI 就是比你顺？因为他给 AI 配上了合适的 Skill。
说到底 Skill 一点都不玄——**把一类活该怎么干，用人话写成一份能交给 AI 的说明书。** 你会写便签，就会写 Skill。
下期咱们就动手，从零写一个你自己的出来。</textarea>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill 板书 · 可视化样板</title>
<style>
:root{
  --bg:#000; --ink:#f5f7fa; --dim:#8b93a1;
  --acc:#5eead4; --acc2:#fbbf24; --acc3:#818cf8;
  --card:#0e1116; --line:#232a33;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;color:var(--ink)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.board{position:relative;width:min(96vw,1200px);height:min(90vh,720px);
  background:radial-gradient(120% 120% at 50% -10%, #0a0d12 0%, #000 70%);
  border-radius:18px;border:1px solid #14181f;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding:5% 6%}
.board::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background-image:linear-gradient(#0c1218 1px,transparent 1px),linear-gradient(90deg,#0c1218 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask:radial-gradient(70% 70% at 50% 45%,#000 40%,transparent 100%);mask:radial-gradient(70% 70% at 50% 45%,#000 40%,transparent 100%)}
.kicker{font-size:clamp(12px,1.3vw,15px);letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-bottom:10px;opacity:0}
.title{font-size:clamp(26px,3.6vw,46px);font-weight:800;letter-spacing:.5px;margin-bottom:clamp(24px,4vh,48px);opacity:0}
.title .hl{color:var(--acc2)}
.rise{opacity:0;transform:translateY(18px);filter:blur(6px)}
.rise.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
.fadeboard{animation:fadeOut .5s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.985)}}
.fadeIn{animation:fadeIn .5s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.timeline{display:flex;align-items:flex-start;position:relative;margin:10px 0 6px}
.tl-node{flex:1;text-align:center;position:relative}
.tl-dot{width:20px;height:20px;border-radius:50%;background:var(--acc);margin:0 auto 18px;
  box-shadow:0 0 0 6px rgba(94,234,212,.12),0 0 24px rgba(94,234,212,.6)}
.tl-node.gold .tl-dot{background:var(--acc2);box-shadow:0 0 0 6px rgba(251,191,36,.12),0 0 24px rgba(251,191,36,.6)}
.tl-date{font-size:clamp(15px,1.8vw,22px);font-weight:700}
.tl-label{font-size:clamp(13px,1.5vw,18px);color:var(--dim);margin-top:6px;line-height:1.5}
.tl-bar{position:absolute;top:9px;left:12%;right:12%;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:0;transform-origin:left;transform:scaleX(0)}
.tl-bar.in{animation:grow 1s .3s ease forwards}
@keyframes grow{to{opacity:.7;transform:scaleX(1)}}
.metaphor{margin-top:clamp(28px,5vh,56px);text-align:center;font-size:clamp(17px,2.2vw,28px)}
.metaphor .chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 26px;color:var(--acc);font-weight:700}
.subnote{margin-top:22px;text-align:center;color:var(--dim);font-size:clamp(14px,1.7vw,20px)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.6vw,22px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vh,28px) 14px;text-align:center;position:relative;overflow:hidden}
.card .ico{font-size:clamp(28px,3.6vw,44px);margin-bottom:12px}
.card .h{font-size:clamp(16px,1.9vw,24px);font-weight:800}
.card .s{font-size:clamp(12px,1.4vw,16px);color:var(--dim);margin-top:6px}
.card.hero{border-color:var(--acc2);background:linear-gradient(180deg,rgba(251,191,36,.10),var(--card))}
.card.hero .h{color:var(--acc2)}
.card.hero::after{content:"";position:absolute;inset:-1px;border-radius:16px;box-shadow:0 0 30px rgba(251,191,36,.35);pointer-events:none}
.axis{margin-top:clamp(24px,4vh,44px);display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.axis>div{flex:1;padding:16px;text-align:center;font-size:clamp(14px,1.7vw,20px)}
.axis .l{color:var(--dim);border-right:1px solid var(--line)}
.axis .r{color:var(--acc2);font-weight:700;background:rgba(251,191,36,.06)}
.hud{position:fixed;bottom:22px;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:50}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--ink);padding:9px 22px;border-radius:22px;font-size:14px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(255,255,255,.14)}
.dots{position:fixed;top:22px;left:0;right:0;display:flex;gap:9px;justify-content:center;z-index:50}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:.3s}
.dot.on{background:var(--acc);width:22px;border-radius:6px}
</style>
</head>
<body>
<div class="stage"><div class="board" id="board"></div></div>
<div class="dots" id="dots"></div>
<div class="hud">
  <button class="btn" id="prev">◀ 上一块</button>
  <button class="btn" id="replay">↺ 重播</button>
  <button class="btn" id="next">下一块 ▶</button>
  <button class="btn" id="auto">▶ 自动播放</button>
</div>
<script>
const boards=[{render:board1},{render:board2}];
function board1(){
  return `
  <div class="kicker rise" data-i="0">ORIGIN · 来历</div>
  <div class="title rise" data-i="1">Skill 从哪来</div>
  <div class="timeline">
    <div class="tl-bar" id="tlbar"></div>
    <div class="tl-node rise" data-i="2"><div class="tl-dot"></div><div class="tl-date">2025.10</div><div class="tl-label">Anthropic 发布<br>Agent Skills</div></div>
    <div class="tl-node gold rise" data-i="3"><div class="tl-dot"></div><div class="tl-date">2025.12</div><div class="tl-label">开源成<br>跨平台通用标准</div></div>
  </div>
  <div class="metaphor rise" data-i="4">一句话：<span class="chip">给 AI 的「入职指南」</span></div>
  <div class="subnote rise" data-i="5">模型很通用 —— 不懂你这行的规矩</div>`;
}
function board2(){
  return `
  <div class="kicker rise" data-i="0">POSITION · 位置</div>
  <div class="title rise" data-i="1">它在 Agent 里是<span class="hl">哪一环</span></div>
  <div class="cards">
    <div class="card rise" data-i="2"><div class="ico">🧠</div><div class="h">大模型</div><div class="s">脑子</div></div>
    <div class="card rise" data-i="3"><div class="ico">💾</div><div class="h">记忆</div><div class="s">记住你</div></div>
    <div class="card rise" data-i="4"><div class="ico">🛠️</div><div class="h">工具</div><div class="s">手和脚</div></div>
    <div class="card hero rise" data-i="5"><div class="ico">🎯</div><div class="h">Skill</div><div class="s">打法 · 怎么干</div></div>
  </div>
  <div class="axis">
    <div class="l rise" data-i="6">能不能干　脑子·记忆·工具</div>
    <div class="r rise" data-i="7">干得好不好　Skill</div>
  </div>`;
}
const board=document.getElementById('board'),dotsWrap=document.getElementById('dots');
let idx=0,playing=false,autoMode=false,timers=[];
boards.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');dotsWrap.appendChild(d);});
const dots=[...dotsWrap.children];
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function updateDots(){dots.forEach((d,i)=>d.classList.toggle('on',i===idx));}
function play(){
  clearTimers();playing=true;
  board.classList.remove('fadeboard');board.classList.add('fadeIn');
  board.innerHTML=boards[idx].render();
  const items=[...board.querySelectorAll('.rise')].sort((a,b)=>(+a.dataset.i)-(+b.dataset.i));
  let t=200;items.forEach(el=>{timers.push(setTimeout(()=>el.classList.add('in'),t));t+=260;});
  const bar=board.querySelector('#tlbar');if(bar)timers.push(setTimeout(()=>bar.classList.add('in'),900));
  timers.push(setTimeout(()=>{playing=false;if(autoMode)timers.push(setTimeout(()=>autoMode&&next(),2600));},t+300));
  updateDots();
}
function transitionTo(n){if(playing)return;clearTimers();playing=true;board.classList.remove('fadeIn');board.classList.add('fadeboard');timers.push(setTimeout(()=>{idx=n;playing=false;play();},520));}
function next(){transitionTo(idx<boards.length-1?idx+1:0);}
function prev(){if(idx>0)transitionTo(idx-1);}
document.getElementById('next').onclick=()=>{autoMode=false;setAuto();next();};
document.getElementById('prev').onclick=()=>{autoMode=false;setAuto();prev();};
document.getElementById('replay').onclick=()=>{if(!playing){autoMode=false;setAuto();play();}};
document.getElementById('auto').onclick=()=>{autoMode=!autoMode;setAuto();if(autoMode&&!playing)timers.push(setTimeout(()=>autoMode&&next(),1500));};
function setAuto(){document.getElementById('auto').textContent=autoMode?'⏸ 停止自动':'▶ 自动播放';}
play();
</script>
</body>
</html>

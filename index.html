<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evans</title>
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 阶段一：全屏黑 · 粒子球 + 底部逐行文字 -->
  <div id="stage1">
    <canvas id="avatar-canvas"></canvas>
    <div id="intro-text">
      <div id="typewriter"></div>
    </div>
  </div>

  <!-- 科技 HUD 叠层（始终在 stage1 上方） -->
  <div id="hud-corners">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
  </div>

  <div id="hud-header">
    <div class="hud-header-left">
      <div class="hud-dot"></div>
      <span>EVANS · SYSTEM</span>
      <span>SYS-4A2F</span>
    </div>
    <div class="hud-header-center">E V A N S</div>
    <div class="hud-header-right">
      <span id="hud-clock">--:--:--</span>
      <span>ONLINE</span>
      <div class="hud-dot"></div>
    </div>
  </div>

  <div id="hud-left">
    <div class="hud-item">
      <div class="hud-item-label">ARCHIVE</div>
      <div class="hud-item-value">15 / 15</div>
      <div class="hud-item-bar" style="--pct:100%"></div>
    </div>
    <div class="hud-item">
      <div class="hud-item-label">SYNC</div>
      <div class="hud-item-value" id="hud-sync">98.4%</div>
      <div class="hud-item-bar" style="--pct:98%"></div>
    </div>
    <div class="hud-item">
      <div class="hud-item-label">MEMORY</div>
      <div class="hud-item-value">7.2 GB</div>
      <div class="hud-item-bar" style="--pct:72%"></div>
    </div>
  </div>

  <div id="hud-right">
    <div class="hud-item">
      <div class="hud-item-label">USERS</div>
      <div class="hud-item-value" id="hud-users">1</div>
      <div class="hud-item-bar" style="--pct:20%"></div>
    </div>
    <div class="hud-item">
      <div class="hud-item-label">STATUS</div>
      <div class="hud-item-value">ACTIVE</div>
      <div class="hud-item-bar" style="--pct:100%"></div>
    </div>
    <div class="hud-item">
      <div class="hud-item-label">UPTIME</div>
      <div class="hud-item-value" id="hud-uptime">00:00</div>
      <div class="hud-item-bar" style="--pct:30%"></div>
    </div>
  </div>

  <div id="hud-footer">
    <div class="hud-footer-text">NEURAL INTERFACE v4.2 · PRIVATE ACCESS</div>
    <div class="hud-footer-text">EXHIBITION MODE · READ ONLY</div>
  </div>

  <!-- 数据流过渡层 -->
  <div id="datastream-layer">
    <canvas id="datastream-canvas"></canvas>
  </div>

  <!-- 阶段二：3D 档案室 -->
  <div id="stage2">
    <div id="scanlines"></div>
    <div id="glitch-overlay"></div>
    <canvas id="archive-canvas"></canvas>
    <div id="evans-overlay">
      <div id="evans-badge">E</div>
      <div id="evans-speech"></div>
    </div>
  </div>

  <script type="module" src="main.v21.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- ============================================================
       阶段一：全屏黑 · 粒子球 + 底部逐行文字
       ============================================================ -->
  <div id="stage1">
    <canvas id="avatar-canvas"></canvas>
    <div id="intro-text">
      <div id="typewriter"></div>
    </div>
  </div>

  <!-- ============================================================
       阶段二：纯后台代码流
       ============================================================ -->
  <div id="stage2">

    <!-- 故障层 -->
    <div id="scanlines"></div>
    <div id="glitch-overlay"></div>

    <!-- 全屏代码流 -->
    <div id="stream-container">
      <div class="stream-fade-top"></div>
      <div class="stream-fade-bottom"></div>
      <div id="stream">
        <div id="stream-inner"></div>
      </div>
    </div>

    <!-- Evans 对话浮层（叠在代码流上） -->
    <div id="evans-overlay">
      <div id="evans-badge">E</div>
      <div id="evans-speech"></div>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evans</title>
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 阶段一：全屏黑 · 粒子球 -->
  <div id="stage1">
    <canvas id="avatar-canvas"></canvas>
    <div id="intro-text">
      <div id="typewriter"></div>
    </div>
  </div>

  <!-- HUD：四角bracket -->
  <div id="hud-corners">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
  </div>

  <!-- HUD：顶部信息条 -->
  <div id="hud-header">
    <div class="hud-header-left">
      <div class="hud-dot"></div>
      <span>EVANS SYS</span>
      <span>·</span>
      <span>4A2F</span>
    </div>
    <div class="hud-header-center">E V A N S</div>
    <div class="hud-header-right">
      <span id="hud-clock">--:--:--</span>
      <span>·</span>
      <span>ONLINE</span>
      <div class="hud-dot"></div>
    </div>
  </div>

  <!-- HUD：浮动数据卡 -->
  <div id="hud-card-1" class="hud-card">
    <div class="hud-card-label">ARCHIVE</div>
    <div class="hud-card-value">15</div>
    <div class="hud-card-sub">RECORDS TOTAL</div>
    <div class="hud-card-bar" style="--pct:100%"></div>
  </div>

  <div id="hud-card-2" class="hud-card">
    <div class="hud-card-label">UPTIME</div>
    <div class="hud-card-value" id="hud-uptime">00:00</div>
    <div class="hud-card-sub">SESSION ACTIVE</div>
    <div class="hud-card-bar" style="--pct:40%"></div>
  </div>

  <div id="hud-card-3" class="hud-card">
    <div class="hud-card-label">STATUS</div>
    <div class="hud-card-value">OK</div>
    <div class="hud-card-sub">ALL SYSTEMS</div>
    <div class="hud-card-bar" style="--pct:100%"></div>
  </div>

  <div id="hud-card-4" class="hud-card">
    <div class="hud-card-label">SYNC</div>
    <div class="hud-card-value" id="hud-sync">98.4</div>
    <div class="hud-card-sub">PERCENT</div>
    <div class="hud-card-bar" style="--pct:98%"></div>
  </div>

  <!-- HUD：底部状态条 -->
  <div id="hud-footer">
    <div class="hud-footer-text">NEURAL INTERFACE v4.2 · PRIVATE</div>
    <div class="hud-footer-text">EXHIBITION MODE · READ ONLY</div>
  </div>

  <!-- 数据流过渡层 -->
  <div id="datastream-layer">
    <canvas id="datastream-canvas"></canvas>
  </div>

  <!-- 阶段二：3D 档案室 -->
  <div id="stage2">
    <div id="scanlines"></div>
    <div id="glitch-overlay"></div>
    <canvas id="archive-canvas"></canvas>
    <div id="evans-overlay">
      <div id="evans-badge">E</div>
      <div id="evans-speech"></div>
    </div>
  </div>

  <script type="module" src="main.v33.js"></script>
</body>
</html>

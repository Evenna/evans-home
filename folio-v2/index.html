<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>小白 Vibe Coding 指南 · Bruno Simon 3D 作品集复刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #08090b;
  --surf:    #0e1014;
  --card:    #13161b;
  --card2:   #181c22;
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.12);
  --txt:     #e8e6e0;
  --txt2:    #8a8f98;
  --txt3:    #4a4e57;
  --accent:  #4f8fff;
  --green:   #30d158;
  --orange:  #ff9f0a;
  --gold:    #c8a96e;
  --purple:  #bf5af2;
  --pink:    #ff6b9d;
  --serif:   'EB Garamond', Georgia, serif;
  --sans:    'Space Grotesk', system-ui, sans-serif;
  --mono:    'JetBrains Mono', monospace;
  --panel-w: 420px;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

/* ── LAYOUT: two panes ── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── LEFT: demo iframe pane ── */
#demo-pane {
  flex: 1 1 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: #000;
  position: relative; overflow: hidden;
}
#demo-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; height: 40px; flex-shrink: 0;
  background: var(--surf); border-bottom: 1px solid var(--border);
}
.browser-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.d-red    { background: #ff5f57; }
.d-yellow { background: #ffbd2e; }
.d-green  { background: #28c840; }
#url-bar {
  flex: 1; height: 22px; border-radius: 6px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px; color: var(--txt2);
  padding: 0 10px; display: flex; align-items: center; gap: 6px;
}
#demo-frame {
  flex: 1; width: 100%; border: none;
  display: block; min-height: 0;
}
/* overlay label when chapter points at a feature */
#demo-highlight {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(8,9,11,0.88); border: 1px solid var(--border2);
  backdrop-filter: blur(12px); border-radius: 10px;
  padding: 10px 18px; font-size: 13px; color: var(--txt2);
  pointer-events: none; opacity: 0; transition: opacity .4s;
  white-space: nowrap; font-family: var(--mono);
}
#demo-highlight.show { opacity: 1; }

/* ── RIGHT: course pane ── */
#course-pane {
  width: var(--panel-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}

/* ── Chapter nav tabs ── */
#chapter-nav {
  display: flex; align-items: center; gap: 2px;
  padding: 8px 12px; background: var(--surf);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
}
#chapter-nav::-webkit-scrollbar { display: none; }
.ch-tab {
  flex-shrink: 0; padding: 5px 11px; border-radius: 6px;
  font-size: 11px; font-family: var(--mono); color: var(--txt3);
  cursor: pointer; transition: background .15s, color .15s;
  border: 1px solid transparent; white-space: nowrap;
}
.ch-tab:hover { color: var(--txt2); background: rgba(255,255,255,.05); }
.ch-tab.active {
  color: var(--accent); background: rgba(79,143,255,.1);
  border-color: rgba(79,143,255,.25);
}

/* ── Chapter progress bar ── */
#ch-progress-wrap {
  height: 2px; background: var(--surf); flex-shrink: 0;
}
#ch-progress { height: 100%; background: var(--accent); transition: width .3s; }

/* ── Scrollable content ── */
#content-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 28px 24px 60px;
  scroll-behavior: smooth;
}
#content-scroll::-webkit-scrollbar { width: 4px; }
#content-scroll::-webkit-scrollbar-track { background: transparent; }
#content-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── Bottom nav arrows ── */
#bottom-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-top: 1px solid var(--border);
  background: var(--surf); flex-shrink: 0;
}
.nav-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--txt2); cursor: pointer;
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  transition: border-color .15s, color .15s, background .15s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(79,143,255,.07); }
.nav-btn:disabled { opacity: .25; cursor: not-allowed; }
#ch-counter { font-family: var(--mono); font-size: 11px; color: var(--txt3); }

/* ── Typography ── */
.ch-eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 10px;
}
.ch-title {
  font-family: var(--serif); font-size: 26px; line-height: 1.2;
  font-weight: 400; margin-bottom: 6px; color: var(--txt);
}
.ch-title em { font-style: italic; color: var(--gold); }
.ch-lead {
  font-size: 13.5px; line-height: 1.75; color: var(--txt2);
  margin-bottom: 20px;
}

/* ── Section heading ── */
.sec-head {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--txt3);
  margin: 22px 0 10px; display: flex; align-items: center; gap: 8px;
}
.sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Visual diagram box ── */
.diagram {
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); overflow: hidden; margin-bottom: 16px;
}
.diagram canvas, .diagram svg { display: block; }
.diagram-label {
  padding: 8px 14px; font-family: var(--mono); font-size: 10px;
  color: var(--txt3); border-top: 1px solid var(--border);
  letter-spacing: .08em;
}

/* ── Prompt box ── */
.prompt-box {
  border-radius: 10px; border: 1px solid rgba(79,143,255,.2);
  background: rgba(79,143,255,.06); padding: 14px 16px; margin-bottom: 12px;
  position: relative;
}
.prompt-box .prompt-label {
  font-family: var(--mono); font-size: 10px; color: var(--accent);
  letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.prompt-box .prompt-label::before { content: '✦'; font-size: 9px; }
.prompt-text {
  font-size: 13px; line-height: 1.7; color: var(--txt);
  font-family: var(--sans);
}
.prompt-text code {
  font-family: var(--mono); font-size: 12px;
  background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px;
  color: var(--green);
}
.copy-btn {
  position: absolute; top: 12px; right: 12px;
  padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border2);
  background: rgba(255,255,255,.04); color: var(--txt3); cursor: pointer;
  font-family: var(--mono); font-size: 10px; transition: all .15s;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { border-color: var(--green); color: var(--green); }

/* ── Checklist ── */
.checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.check-item {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 11px 14px; border-radius: 9px;
  background: var(--card); border: 1px solid var(--border);
}
.check-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.check-body h4 { font-size: 13px; font-weight: 600; margin-bottom: 3px; color: var(--txt); }
.check-body p  { font-size: 12px; color: var(--txt2); line-height: 1.6; }
.check-body a  { color: var(--accent); text-decoration: none; }
.check-body a:hover { text-decoration: underline; }

/* ── Code snippet ── */
.code-block {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.8;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 9px; padding: 14px 16px; margin-bottom: 12px;
  overflow-x: auto; color: var(--txt2); position: relative;
}
.code-block .k { color: var(--purple); }
.code-block .s { color: var(--green); }
.code-block .c { color: var(--txt3); font-style: italic; }
.code-block .n { color: var(--accent); }
.code-block .o { color: var(--orange); }

/* ── Info cards ── */
.info-card {
  border-radius: 9px; padding: 13px 15px; margin-bottom: 10px;
  border-left: 2px solid;
}
.info-card.tip    { border-color: var(--accent);  background: rgba(79,143,255,.06); }
.info-card.warn   { border-color: var(--orange);  background: rgba(255,159,10,.06); }
.info-card.good   { border-color: var(--green);   background: rgba(48,209,88,.06); }
.info-card h5     { font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--txt); }
.info-card p      { font-size: 12.5px; line-height: 1.65; color: var(--txt2); }
.info-card code   { font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 3px; color: var(--green); }

/* ── Stack pills ── */
.stack-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.stack-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); font-size: 12px; cursor: default;
}
.stack-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Timeline steps ── */
.timeline { display: flex; flex-direction: column; gap: 0; margin-bottom: 16px; }
.tl-item { display: flex; gap: 0; position: relative; }
.tl-left { display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0; }
.tl-num {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  background: var(--card2); border: 1px solid var(--border2); color: var(--txt2);
}
.tl-num.done { background: rgba(48,209,88,.12); border-color: rgba(48,209,88,.3); color: var(--green); }
.tl-line { flex: 1; width: 1px; background: var(--border); margin: 2px 0; }
.tl-item:last-child .tl-line { display: none; }
.tl-body { padding: 0 0 18px 14px; flex: 1; }
.tl-body h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--txt); line-height: 1.3; }
.tl-body p  { font-size: 12px; color: var(--txt2); line-height: 1.6; }

/* ── Feature badge with arrow label ── */
.feature-highlight {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--border);
  margin-bottom: 8px; cursor: pointer; transition: border-color .15s;
}
.feature-highlight:hover { border-color: var(--border2); }
.fh-icon { font-size: 20px; flex-shrink: 0; }
.fh-body { flex: 1; }
.fh-body h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.fh-body p  { font-size: 11.5px; color: var(--txt2); line-height: 1.5; }
.fh-arrow { color: var(--txt3); font-size: 12px; flex-shrink: 0; }

/* ── Noise bg canvas ── */
#noise-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5; }
#app { position: relative; z-index: 1; }
</style>
</head>
<body>
<canvas id="noise-bg"></canvas>
<div id="app">

  <!-- LEFT PANE: demo -->
  <div id="demo-pane">
    <div id="demo-topbar">
      <div class="browser-dot d-red"></div>
      <div class="browser-dot d-yellow"></div>
      <div class="browser-dot d-green"></div>
      <div id="url-bar">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
          <path d="M6 1a5 5 0 1 0 0 10A5 5 0 0 0 6 1z" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 6s.5-2.5 2-2.5S8 6 8 6s-.5 2.5-2 2.5S4 6 4 6z" stroke="currentColor" stroke-width="1"/>
        </svg>
        bruno.im/works/folio-2019
      </div>
    </div>
    <iframe id="demo-frame" src="https://bruno-simon.com/" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div id="demo-highlight"></div>
  </div>

  <!-- RIGHT PANE: course -->
  <div id="course-pane">
    <div id="chapter-nav"></div>
    <div id="ch-progress-wrap"><div id="ch-progress"></div></div>
    <div id="content-scroll"></div>
    <div id="bottom-nav">
      <button class="nav-btn" id="btn-prev">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2l-4 4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        上一章
      </button>
      <span id="ch-counter">1 / 9</span>
      <button class="nav-btn" id="btn-next">
        下一章
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="course-noise.js"></script>
<script src="course-chapters.js"></script>
<script>window.RENDERERS = {};</script>
<script src="course-r1.js"></script>
<script src="course-r2.js"></script>
<script src="course-r3.js"></script>
<script src="course-mount.js"></script>
</body>
</html>

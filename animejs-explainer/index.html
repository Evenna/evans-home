<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime.js 课件 — Vibe Coding 小白指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Anime.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/animejs@4/lib/anime.iife.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#08090b;
  --surf:#0d1015;
  --card:#13161c;
  --card2:#181c24;
  --txt:#e8e6e0;
  --txt2:#8a8f98;
  --txt3:#4a4e57;
  --accent:#4f8fff;
  --green:#30d158;
  --orange:#ff9f0a;
  --gold:#c8a96e;
  --purple:#bf5af2;
  --serif:'EB Garamond',Georgia,serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}

/* ===== LAYOUT ===== */
#app{display:flex;height:100vh;width:100vw}

/* left: iframe stage */
#stage{
  flex:1;
  position:relative;
  background:#000;
  overflow:hidden;
}
#stage iframe{
  width:100%;height:100%;
  border:none;
  display:block;
}

/* loading overlay */
#stage-loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;
  background:#08090b;
  pointer-events:none;
  transition:opacity .6s ease;
}
#stage-loading.hidden{opacity:0}
.loading-spinner{
  width:32px;height:32px;
  border:2px solid rgba(79,143,255,0.15);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#stage-loading span{font-family:var(--mono);font-size:11px;color:var(--txt3);}

/* iframe top badge */
#iframe-badge{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  padding:5px 14px;
  border-radius:100px;
  background:rgba(8,9,11,0.75);
  backdrop-filter:blur(20px);
  border:0.5px solid rgba(255,255,255,0.08);
  font-family:var(--mono);font-size:10px;color:var(--txt3);
  z-index:10;
  pointer-events:none;
  white-space:nowrap;
}
#iframe-badge .dot-live{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* right: panel */
#panel{
  width:420px;min-width:360px;max-width:460px;
  display:flex;flex-direction:column;
  background:var(--surf);
  border-left:0.5px solid rgba(255,255,255,0.06);
  position:relative;
  overflow:hidden;
}

/* progress bar */
#progress{height:2px;background:rgba(255,255,255,0.05);position:relative;flex-shrink:0}
#progress-fill{height:100%;background:var(--accent);transition:width .4s ease;width:11.11%}

/* tabs */
#tabs{
  display:flex;padding:12px 16px 0;
  gap:4px;flex-shrink:0;
  border-bottom:0.5px solid rgba(255,255,255,0.06);
  overflow-x:auto;scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;width:34px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;
  color:var(--txt3);cursor:pointer;
  border-radius:6px 6px 0 0;
  transition:color .2s,background .2s;
  user-select:none;
}
.tab:hover{color:var(--txt2);background:rgba(255,255,255,0.04)}
.tab.active{color:var(--accent);background:rgba(79,143,255,0.08)}

/* chapter content */
#chapter-wrap{
  flex:1;overflow-y:auto;padding:28px 24px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.08) transparent;
}
#chapter-wrap::-webkit-scrollbar{width:4px}
#chapter-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

/* bottom nav */
#bottom-nav{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  border-top:0.5px solid rgba(255,255,255,0.06);
}
.nav-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);
  color:var(--txt2);cursor:pointer;font-size:16px;
  transition:all .15s;user-select:none;
}
.nav-btn:hover:not(.disabled){background:rgba(255,255,255,0.08);color:var(--txt)}
.nav-btn.disabled{opacity:.3;cursor:default;pointer-events:none}
#chapter-label{font-family:var(--mono);font-size:11px;color:var(--txt3)}

/* ===== CONTENT STYLES ===== */
.ch-title{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.3;margin-bottom:6px;color:var(--txt)}
.ch-eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.ch-lead{font-size:14px;line-height:1.75;color:var(--txt2);margin-bottom:20px}
.card{background:var(--card);border-radius:12px;border:0.5px solid rgba(255,255,255,0.06);padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card-body{font-size:13px;line-height:1.7;color:var(--txt2)}
.analogy{background:linear-gradient(135deg,rgba(79,143,255,0.07),rgba(79,143,255,0.02));border:0.5px solid rgba(79,143,255,0.2);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.analogy-icon{font-size:24px;margin-bottom:8px}
.analogy p{font-size:13px;line-height:1.75;color:var(--txt2)}
.analogy p em{color:var(--accent);font-style:normal;font-weight:500}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{padding:4px 10px;border-radius:20px;font-family:var(--mono);font-size:10px;font-weight:500;background:rgba(255,255,255,0.05);color:var(--txt2);border:0.5px solid rgba(255,255,255,0.08)}
.tag.blue{background:rgba(79,143,255,0.1);color:var(--accent);border-color:rgba(79,143,255,0.2)}
.tag.green{background:rgba(48,209,88,0.1);color:var(--green);border-color:rgba(48,209,88,0.2)}
.tag.orange{background:rgba(255,159,10,0.1);color:var(--orange);border-color:rgba(255,159,10,0.2)}
.tag.purple{background:rgba(191,90,242,0.1);color:var(--purple);border-color:rgba(191,90,242,0.2)}
canvas.diagram{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:6px;background:#0d1015}
.diagram-caption{font-family:var(--mono);font-size:10px;color:var(--txt3);text-align:center;margin-bottom:16px}
.prompt{background:var(--card2);border-radius:12px;border:0.5px solid rgba(255,255,255,0.08);padding:16px;margin-bottom:14px}
.prompt-lbl{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.prompt-body{font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--txt2);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.06) transparent}
.copy-btn{margin-top:10px;padding:6px 14px;border-radius:6px;border:0.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--txt2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s}
.copy-btn:hover{background:rgba(255,255,255,0.1);color:var(--txt)}
.copy-btn.copied{color:var(--green);border-color:rgba(48,209,88,0.3)}
.trap{border-left:2px solid var(--orange);padding-left:14px;margin-bottom:16px}
.trap-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:4px}
.trap-cause{font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:8px}
.milestone-list{list-style:none;padding:0;margin-bottom:16px}
.milestone-item{display:flex;gap:12px;padding:12px 0;border-bottom:0.5px solid rgba(255,255,255,0.05)}
.milestone-item:last-child{border-bottom:none}
.milestone-num{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500;background:rgba(79,143,255,0.15);color:var(--accent);border:0.5px solid rgba(79,143,255,0.3)}
.milestone-text{font-size:13px;color:var(--txt2);line-height:1.6}
.milestone-text strong{color:var(--txt);font-weight:500}
</style>
</head>
<body>
<div id="app">
  <!-- LEFT: animejs mirror iframe -->
  <div id="stage">
    <iframe
      id="mirror-frame"
      src="https://evenna.github.io/animejs-mirror/"
      title="Anime.js 官网镜像"
      loading="eager"
      sandbox="allow-scripts allow-same-origin allow-popups"
    ></iframe>
    <div id="stage-loading">
      <div class="loading-spinner"></div>
      <span>加载 Anime.js 官网镜像...</span>
    </div>
    <div id="iframe-badge">
      <div class="dot-live"></div>
      <span>Anime.js 官网 · 可交互</span>
    </div>
  </div>

  <!-- RIGHT: chapter panel -->
  <div id="panel">
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="tabs">
      <div class="tab active" data-i="0"  title="先玩一遍">1</div>
      <div class="tab"        data-i="1"  title="它是什么">2</div>
      <div class="tab"        data-i="2"  title="工具箱">3</div>
      <div class="tab"        data-i="3"  title="缓动曲线">4</div>
      <div class="tab"        data-i="4"  title="Stagger骨牌">5</div>
      <div class="tab"        data-i="5"  title="Scroll Observer">6</div>
      <div class="tab"        data-i="6"  title="官网3D模型">7</div>
      <div class="tab"        data-i="7"  title="动效架构">8</div>
      <div class="tab"        data-i="8"  title="Timeline">9</div>
      <div class="tab"        data-i="9"  title="怎么开始做">10</div>
      <div class="tab"        data-i="10" title="怎么跟AI说">11</div>
      <div class="tab"        data-i="11" title="会踩什么坑">12</div>
    </div>
    <div id="chapter-wrap"></div>
    <div id="bottom-nav">
      <div class="nav-btn disabled" id="btn-prev">←</div>
      <div id="chapter-label">1 / 9</div>
      <div class="nav-btn" id="btn-next">→</div>
    </div>
  </div>
</div>

<script src="chapters.js"></script>
<script src="r1.js"></script>
<script src="r2.js"></script>
<script src="r4.js"></script>
<script src="r3.js"></script>
<script src="mount.js"></script>
</body>
</html>

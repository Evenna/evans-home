<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Coding 精选案例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --surface: #111214;
    --card: #16181c;
    --card2: #1c1f24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --txt: #f0f1f3;
    --txt2: #8a8f98;
    --txt3: #4a4e57;
    --accent: #4f8fff;
    --green: #30d158;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --pink: #ff375f;
    --teal: #40c8e0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ─── SLIDE BASE ─── */
  .slide {
    width: 100vw; height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    position: relative;
    display: flex;
  }

  /* ─── NAV ─── */
  #nav {
    position: fixed; right: 22px; top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex; flex-direction: column; gap: 7px;
  }
  #nav .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--txt3); cursor: pointer;
    transition: background .25s, transform .25s;
  }
  #nav .dot.active { background: var(--accent); transform: scale(1.8); }
  #counter {
    position: fixed; bottom: 24px; right: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--txt3); z-index: 200;
    letter-spacing: .08em;
  }
  #progress {
    position: fixed; left: 0; top: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    z-index: 200; transition: width .4s ease;
  }

  /* ─── SPLIT LAYOUT ─── */
  /* left: info panel, right: demo/iframe */
  .split {
    display: grid;
    grid-template-columns: 400px 1fr;
    width: 100%; height: 100%;
  }
  .split-info {
    display: flex; flex-direction: column; justify-content: center;
    padding: 56px 48px;
    border-right: 1px solid var(--border);
    background: var(--bg);
    position: relative; z-index: 2;
    overflow: hidden;
  }
  .split-info::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 50% at 10% 50%, rgba(255,255,255,.025) 0%, transparent 70%);
    pointer-events: none;
  }
  .split-demo {
    position: relative;
    background: #0a0b0d;
    overflow: hidden;
    display: flex; align-items: stretch;
  }
  .split-demo iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }
  .split-demo canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* demo overlay label */
  .demo-label {
    position: absolute; bottom: 14px; left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: rgba(255,255,255,.25);
    letter-spacing: .1em; pointer-events: none;
    z-index: 10;
  }
  .demo-badge {
    position: absolute; top: 14px; right: 16px;
    padding: 4px 10px; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .06em;
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.4);
    pointer-events: none; z-index: 10;
  }

  /* ─── INFO CONTENT ─── */
  .cat-tag {
    display: inline-block;
    padding: 4px 12px; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; margin-bottom: 20px;
    border: 1px solid;
  }
  .info-title {
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 700; color: var(--txt);
    letter-spacing: -.02em; line-height: 1.15;
    margin-bottom: 10px;
  }
  .info-author {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--txt3);
    letter-spacing: .06em; margin-bottom: 18px;
  }
  .info-desc {
    font-size: 14px; color: var(--txt2);
    line-height: 1.75; margin-bottom: 24px;
  }
  .info-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag {
    padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 500;
    background: rgba(255,255,255,.06);
    color: var(--txt2); border: 1px solid var(--border);
  }
  .info-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    text-decoration: none; border: 1px solid var(--border2);
    color: var(--txt); background: rgba(255,255,255,.05);
    letter-spacing: .04em; transition: background .2s;
  }
  .info-link:hover { background: rgba(255,255,255,.1); }
  .info-link-arrow { opacity: .5; }

  /* ─── COVER (full-width special) ─── */
  .cover-slide {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #08090a;
    text-align: center; padding: 60px 40px;
  }
  .cover-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .cover-glow {
    position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none;
  }
  .cover-content { position: relative; z-index: 2; }
  .cover-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 20px;
  }
  .cover-title {
    font-size: clamp(56px, 9vw, 120px); font-weight: 700;
    color: var(--txt); letter-spacing: -.04em; line-height: 1;
  }
  .cover-title em { color: var(--accent); font-style: normal; }
  .cover-sub {
    margin-top: 20px; font-size: 17px; color: var(--txt2);
    font-weight: 300; line-height: 1.6; max-width: 600px; margin-left: auto; margin-right: auto;
  }
  .cover-chips {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-top: 36px;
  }
  .chip {
    padding: 6px 16px; border-radius: 100px;
    font-size: 12px; font-weight: 500; border: 1px solid;
    letter-spacing: .04em;
  }
  .scroll-hint {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: .35; animation: bounce 2s ease-in-out infinite;
  }
  .scroll-hint-line { width: 1px; height: 28px; background: linear-gradient(to bottom, transparent, var(--txt2)); }
  .scroll-hint-text { font-size: 9px; font-family: 'JetBrains Mono', monospace; color: var(--txt2); letter-spacing: .14em; }
  @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(5px); } }

  /* ─── OUTRO ─── */
  .outro-slide {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #08090a; text-align: center; padding: 60px 40px;
  }
  .outro-quote {
    font-size: clamp(26px, 3.5vw, 52px);
    font-weight: 300; color: var(--txt);
    line-height: 1.5; letter-spacing: -.01em; max-width: 760px;
  }
  .outro-quote strong { font-weight: 700; color: var(--accent); }

  /* ─── CATEGORY SECTION (full-width header) ─── */
  .cat-slide {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #08090a; padding: 0 80px; text-align: center;
  }
  .cat-slide-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(80px, 14vw, 180px); font-weight: 700;
    color: rgba(255,255,255,.04); line-height: 1;
    position: absolute; user-select: none; pointer-events: none;
  }
  .cat-slide-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: .22em; text-transform: uppercase; margin-bottom: 14px;
    position: relative; z-index: 2;
  }
  .cat-slide-title {
    font-size: clamp(40px, 6vw, 80px); font-weight: 700;
    color: var(--txt); letter-spacing: -.04em; line-height: 1.05;
    position: relative; z-index: 2;
  }
  .cat-slide-desc {
    margin-top: 16px; font-size: 16px; color: var(--txt2);
    max-width: 560px; line-height: 1.65;
    position: relative; z-index: 2;
  }
  .cat-slide-count {
    margin-top: 28px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--txt3); letter-spacing: .1em;
    position: relative; z-index: 2;
  }

  /* glow helpers */
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
</style>
</head>
<body>
<div id="progress" style="width:0%"></div>
<div id="nav"></div>
<div id="counter">01 / 01</div>
<div id="deck"></div>

<script src="slides.js"></script>
<script src="slides2.js"></script>
<script src="mount.js"></script>
</body>
</html>

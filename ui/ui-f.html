<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-F · 深夜关怀 · Evans</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #07080a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  /* 极淡的底部光晕，模拟夜灯氛围 */
  body::before {
    content: '';
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 300px;
    background: radial-gradient(ellipse at center bottom,
      rgba(58, 138, 114, 0.04) 0%,
      rgba(200, 169, 110, 0.025) 40%,
      transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card-wrapper {
    position: relative;
    z-index: 1;
    width: 320px;
    animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .card {
    position: relative;
    background: rgba(18, 20, 26, 0.96);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 30px 28px 26px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.035) inset,
      0 30px 80px rgba(0,0,0,0.80),
      0 2px 20px rgba(0,0,0,0.5);
  }

  /* 顶部极细白线，克制 */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 10%,
      rgba(255,255,255,0.1) 40%,
      rgba(200,169,110,0.25) 50%,
      rgba(255,255,255,0.1) 60%,
      transparent 90%);
  }

  /* 极淡中心光晕 */
  .card::after {
    content: '';
    position: absolute;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(58,138,114,0.04) 0%, transparent 65%);
    pointer-events: none;
  }

  /* 标题区 */
  .card-header {
    text-align: center;
    margin-bottom: 26px;
    animation: fadeUp 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;
  }

  .header-label {
    font-size: 10.5px;
    font-weight: 500;
    color: rgba(200,169,110,0.55);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .header-title {
    font-size: 16px;
    font-weight: 500;
    color: rgba(232, 230, 224, 0.75);
    letter-spacing: -0.01em;
  }

  /* 核心时长展示 */
  .duration-block {
    text-align: center;
    margin-bottom: 22px;
    animation: fadeUp 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  }

  .duration-main {
    font-size: 36px;
    font-weight: 200;
    color: #e8e6e0;
    letter-spacing: -0.03em;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .duration-main span {
    font-size: 14px;
    font-weight: 400;
    color: #6a6a7a;
    letter-spacing: 0.02em;
    display: block;
    margin-top: 4px;
  }

  /* 自动操作 */
  .auto-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.025);
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.05);
    animation: fadeUp 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.46s both;
  }

  .auto-item {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .auto-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(58,138,114,0.6);
    flex-shrink: 0;
  }

  .auto-text {
    font-size: 12.5px;
    color: #6a6a7a;
    letter-spacing: 0.01em;
    line-height: 1.4;
  }

  /* 询问区 */
  .ask-section {
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.6s both;
  }

  .ask-text {
    font-size: 13px;
    color: rgba(200,200,195,0.65);
    margin-bottom: 14px;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .btn {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .btn:active { transform: scale(0.95); opacity: 0.8; }

  .btn-yes {
    background: rgba(58,138,114,0.18);
    color: rgba(100,210,175,0.85);
    border: 1px solid rgba(58,138,114,0.28);
  }

  .btn-later {
    background: rgba(255,255,255,0.04);
    color: rgba(106,106,122,0.85);
    border: 1px solid rgba(255,255,255,0.07);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <div class="card-header">
      <div class="header-label">Evans · 注意到你</div>
      <div class="header-title">你已连续工作</div>
    </div>

    <div class="duration-block">
      <div class="duration-main">
        3<small style="font-size:22px;font-weight:300;color:#9a9890;">小时</small>42<small style="font-size:22px;font-weight:300;color:#9a9890;">分钟</small>
        <span>未曾离开</span>
      </div>
    </div>

    <div class="auto-actions">
      <div class="auto-item">
        <div class="auto-dot"></div>
        <div class="auto-text">屏幕亮度已自动调低</div>
      </div>
      <div class="auto-item">
        <div class="auto-dot"></div>
        <div class="auto-text">环境音乐已切换为 白噪音</div>
      </div>
    </div>

    <div class="ask-section">
      <div class="ask-text">需要我为你设置休息提醒吗？</div>
      <div class="btn-row">
        <button class="btn btn-yes">是</button>
        <button class="btn btn-later">稍后</button>
      </div>
    </div>

  </div>
</div>

</body>
</html>

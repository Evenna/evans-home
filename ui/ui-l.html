<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-L · 落版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .endcard {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Line 1 — Evans */
  .line-brand {
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-size: 60px;
    font-weight: 400;
    color: #e8e6e0;
    letter-spacing: 0.16em;
    line-height: 1;
    text-transform: uppercase;
    margin-bottom: 18px;

    opacity: 0;
    animation: gentleFade 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards;
  }

  /* Line 2 — Lifelong. */
  .line-slogan {
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-size: 40px;
    font-weight: 400;
    font-style: italic;
    color: #c8a96e;
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 22px;

    opacity: 0;
    animation: gentleFade 1.8s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
  }

  /* Thin separator line */
  .line-sep {
    width: 40px;
    height: 0.5px;
    background: rgba(200,169,110,0.20);
    margin-bottom: 20px;

    opacity: 0;
    animation: gentleFade 1.4s ease 1.6s forwards;
  }

  /* Line 3 — 陪你一生 */
  .line-tagline {
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: #6a6a7a;
    letter-spacing: 0.22em;
    line-height: 1;

    opacity: 0;
    animation: gentleFade 1.8s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
  }

  @keyframes gentleFade {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="endcard">
    <div class="line-brand">Evans</div>
    <div class="line-slogan">Lifelong.</div>
    <div class="line-sep"></div>
    <div class="line-tagline">陪你一生的AI共生体</div>
  </div>
</body>
</html>

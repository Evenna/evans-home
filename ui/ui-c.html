<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-C · 防诈骗拦截</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07080a;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  }

  .card {
    width: 370px;
    background: rgba(14,16,20,0.96);
    border: 1px solid rgba(184,130,58,0.4);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow:
      0 0 0 1px rgba(184,130,58,0.08),
      0 0 40px rgba(184,130,58,0.1),
      0 8px 32px rgba(0,0,0,0.7);
    animation: alertIn 0.55s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0; transform: scale(0.94);
  }
  @keyframes alertIn {
    to { opacity:1; transform:scale(1); }
  }

  /* 顶部 alert row */
  .alert-row {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .alert-icon-wrap {
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background: rgba(184,130,58,0.12);
    border: 1px solid rgba(184,130,58,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    animation: iconPulse 1.8s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%,100%{box-shadow: 0 0 0 0 rgba(184,130,58,0.3);}
    50%{box-shadow: 0 0 0 6px rgba(184,130,58,0);}
  }
  .alert-meta { flex:1; }
  .alert-title { font-size:14px; font-weight:600; color:#b8823a; }
  .alert-sub   { font-size:11px; color:#6a5020; margin-top:3px; }

  .divider {
    height:1px; background:rgba(184,130,58,0.15);
    margin:0 0 14px;
  }

  /* 原因说明 */
  .reason {
    font-size:13px; color:#8a8070; line-height:1.8; margin-bottom:16px;
  }
  .reason .hi { color:#c8a96e; font-weight:500; }

  /* 指标行 */
  .signals {
    display:flex; flex-direction:column; gap:7px; margin-bottom:18px;
  }
  .signal-row {
    display:flex; align-items:center; gap:8px;
    opacity:0; animation:rowIn 0.35s ease forwards;
  }
  .signal-row:nth-child(1){animation-delay:0.5s;}
  .signal-row:nth-child(2){animation-delay:0.75s;}
  .signal-row:nth-child(3){animation-delay:1.0s;}
  @keyframes rowIn{from{opacity:0;transform:translateX(-5px);}to{opacity:1;transform:translateX(0);}}

  .signal-dot {
    width:5px; height:5px; border-radius:50%;
    background:#b8823a; flex-shrink:0;
  }
  .signal-text { font-size:12px; color:#7a6040; }
  .signal-text .val { color:#b8823a; }

  /* 按钮 */
  .actions {
    display:flex; gap:10px;
    opacity:0; animation:fadeIn 0.4s ease 1.3s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}
  .btn {
    flex:1; padding:10px 8px; border-radius:10px;
    font-size:12px; text-align:center; font-weight:500;
    cursor:pointer; transition:all 0.2s; line-height:1.4;
  }
  .btn-stop {
    background:rgba(184,130,58,0.15);
    border:1px solid rgba(184,130,58,0.35);
    color:#b8823a;
  }
  .btn-stop:hover { background:rgba(184,130,58,0.25); }
  .btn-continue {
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    color:#3a3a3a;
  }
  .btn-continue:hover { color:#666; border-color:rgba(255,255,255,0.12); }
</style>
</head>
<body>
<div class="card">
  <div class="alert-row">
    <div class="alert-icon-wrap">⚠</div>
    <div class="alert-meta">
      <div class="alert-title">Evans · 注意</div>
      <div class="alert-sub">检测到可疑转账请求</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="reason">
    对方要求<span class="hi">立即转账</span>，
    并强调<span class="hi">不要告诉家人</span>——
    这与已知诈骗话术高度吻合。
  </div>

  <div class="signals">
    <div class="signal-row">
      <div class="signal-dot"></div>
      <span class="signal-text">此号码<span class="val">从未出现在你的联系人</span></span>
    </div>
    <div class="signal-row">
      <div class="signal-dot"></div>
      <span class="signal-text">通话时长 <span class="val">2分17秒</span>，语速异常快</span>
    </div>
    <div class="signal-row">
      <div class="signal-dot"></div>
      <span class="signal-text">话术匹配度 <span class="val">94%</span>（冒充公检法类）</span>
    </div>
  </div>

  <div class="actions">
    <div class="btn btn-stop">先不转<br>打给儿子确认</div>
    <div class="btn btn-continue">我了解情况<br>继续</div>
  </div>
</div>
</body>
</html>

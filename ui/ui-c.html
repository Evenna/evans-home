<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evans · 第三选项</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #07080a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card-wrapper {
    position: relative;
    z-index: 1;
    width: 440px;
  }

  .card {
    position: relative;
    background: rgba(18, 20, 26, 0.96);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 22px;
    border: 1px solid rgba(200,169,110,0.16);
    overflow: hidden;
    box-shadow:
      0 0 0 0.5px rgba(200,169,110,0.06),
      0 36px 90px rgba(0,0,0,0.7),
      0 12px 36px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.06);
    opacity: 0;
    transform: translateY(28px) scale(0.96);
    animation: cardEnter 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,169,110,0.4) 25%, rgba(200,169,110,0.75) 50%, rgba(200,169,110,0.4) 75%, transparent);
  }

  @keyframes cardEnter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c8a96e;
    opacity: 0.8;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: #e8e6e0;
  }

  .header-title span { color: #c8a96e; }

  .header-sub-badge {
    font-size: 11px;
    font-weight: 500;
    color: #6a6a7a;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 3px 9px;
    border-radius: 20px;
  }

  .context-bar {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 9px 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .context-label {
    font-size: 11px;
    font-weight: 600;
    color: #5a5a6a;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .context-text {
    font-size: 12.5px;
    color: #6a6a7a;
    line-height: 1.4;
  }

  /* ── Options ── */
  .options {
    padding: 18px 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    position: relative;
    opacity: 0;
    transform: translateY(20px) scale(0.96);
    cursor: default;
    transition: background 0.2s;
  }

  .option:nth-child(1) { animation: optEnter 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards; }
  .option:nth-child(2) { animation: optEnter 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards; }
  .option:nth-child(3) { animation: optEnter 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.75s forwards; }

  @keyframes optEnter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .option:hover:not(.highlight) {
    background: rgba(255,255,255,0.035);
  }

  /* C选项高亮 */
  .option.highlight {
    background: rgba(200,169,110,0.07);
    border-color: rgba(200,169,110,0.35);
    box-shadow:
      0 0 0 0.5px rgba(200,169,110,0.12),
      inset 0 1px 0 rgba(200,169,110,0.1),
      0 4px 20px rgba(200,169,110,0.08);
  }

  /* 高亮顶部细线 */
  .option.highlight::before {
    content: '';
    position: absolute;
    top: 0; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,169,110,0.6), transparent);
  }

  .option-letter {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option:not(.highlight) .option-letter {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #5a5a6a;
  }

  .option.highlight .option-letter {
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    color: #c8a96e;
  }

  .option-body { flex: 1; min-width: 0; }

  .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .option-title {
    font-size: 14px;
    font-weight: 600;
    color: #8a8a9a;
    line-height: 1.3;
  }

  .option.highlight .option-title {
    color: #e8e6e0;
  }

  .recommend-tag {
    font-size: 10px;
    font-weight: 700;
    color: #c8a96e;
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    padding: 2px 8px;
    border-radius: 8px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .option-desc {
    font-size: 12px;
    color: #4a4a5a;
    line-height: 1.5;
  }

  .option.highlight .option-desc {
    color: #7a7a8a;
  }

  /* Evans insight */
  .insight {
    margin: 0 24px;
    padding: 10px 14px;
    background: rgba(200,169,110,0.04);
    border: 1px solid rgba(200,169,110,0.1);
    border-radius: 11px;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    opacity: 0;
    animation: fadeUp 0.5s ease 1s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .insight-icon {
    font-size: 13px;
    margin-top: 1px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  .insight-text {
    font-size: 12px;
    color: #6a6060;
    line-height: 1.55;
  }

  .insight-text em {
    color: #8a7a5a;
    font-style: normal;
    font-weight: 500;
  }

  /* ── Quote ── */
  .quote-section {
    padding: 16px 24px 20px;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.15s forwards;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin-bottom: 16px;
  }

  .quote {
    font-size: 13.5px;
    color: #5a5260;
    line-height: 1.65;
    font-style: italic;
    letter-spacing: 0.1px;
    text-align: center;
    padding: 0 8px;
  }

  .quote em {
    font-style: normal;
    color: #8a7a6a;
    font-weight: 500;
  }

  .quote-mark {
    display: block;
    font-size: 22px;
    color: rgba(200,169,110,0.2);
    font-style: normal;
    line-height: 1;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="header-dot"></div>
          <div class="header-title"><span>Evans</span> · 第三选项</div>
        </div>
        <div class="header-sub-badge">工作邀约分析</div>
      </div>
      <div class="context-bar">
        <div class="context-label">情境</div>
        <div class="context-text">已收到 Lumina 公司 offer，需在3天内答复</div>
      </div>
    </div>

    <!-- Options -->
    <div class="options">

      <!-- Option A -->
      <div class="option">
        <div class="option-letter">A</div>
        <div class="option-body">
          <div class="option-row">
            <div class="option-title">直接接受 offer</div>
          </div>
          <div class="option-desc">立即回复确认，按期入职</div>
        </div>
      </div>

      <!-- Option B -->
      <div class="option">
        <div class="option-letter">B</div>
        <div class="option-body">
          <div class="option-row">
            <div class="option-title">礼貌拒绝 offer</div>
          </div>
          <div class="option-desc">感谢机会，说明目前暂不考虑换岗</div>
        </div>
      </div>

      <!-- Option C: Highlight -->
      <div class="option highlight">
        <div class="option-letter">C</div>
        <div class="option-body">
          <div class="option-row">
            <div class="option-title">要求两周后再决定，先了解团队</div>
            <div class="recommend-tag">推荐</div>
          </div>
          <div class="option-desc">请求与直属团队进行30分钟非正式沟通，在充分了解后做决定</div>
        </div>
      </div>

    </div>

    <!-- Insight -->
    <div class="insight">
      <div class="insight-icon">✦</div>
      <div class="insight-text">你的顾虑核心是<em>团队文化未知</em>，而非薪资。C选项能在不失礼的前提下获取关键信息。</div>
    </div>

    <!-- Quote -->
    <div class="quote-section">
      <div class="divider"></div>
      <div class="quote">
        <span class="quote-mark">"</span>
        Evans不告诉你<em>怎么选</em>，<br>它告诉你，你<em>还可以怎么选</em>。
      </div>
    </div>

  </div>
</div>

</body>
</html>

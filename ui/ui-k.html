<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-K · 静默黑场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .silence-text {
    font-family: Georgia, 'Noto Serif SC', 'Times New Roman', serif;
    font-size: 18px;
    font-weight: 400;
    color: #e8e6e0;
    letter-spacing: 0.06em;
    line-height: 1.8;
    text-align: center;
    padding: 0 40px;
    max-width: 540px;

    opacity: 0;
    animation: slowFadeIn 3s ease-in 0.5s forwards;
  }

  @keyframes slowFadeIn {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
  <p class="silence-text">在这个时刻，沉默是它经过判断后的主动选择。</p>
</body>
</html>

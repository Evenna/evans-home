<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-J · 硬件参数</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #07080a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
    padding: 32px 24px;
  }

  .spec-wrapper {
    width: 100%;
    max-width: 480px;
  }

  /* Header */
  .spec-header {
    text-align: center;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards;
  }
  .spec-eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.55);
    margin-bottom: 10px;
  }
  .spec-brand {
    font-size: 44px;
    font-weight: 100;
    color: #e8e6e0;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 6px;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .spec-subtitle {
    font-size: 13px;
    color: #6a6a7a;
    letter-spacing: 0.06em;
  }
  .spec-subtitle em {
    font-style: normal;
    color: rgba(200,169,110,0.50);
  }

  /* Thin divider line */
  .spec-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.30s forwards;
  }
  .divider-line {
    flex: 1;
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(200,169,110,0.22), transparent);
  }
  .divider-diamond {
    width: 5px; height: 5px;
    background: rgba(200,169,110,0.35);
    transform: rotate(45deg);
    border-radius: 1px;
  }

  /* Grid */
  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* Spec Card */
  .spec-card {
    background: rgba(18,20,26,0.96);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(200,169,110,0.12);
    border-radius: 18px;
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
    cursor: default;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.03);
    opacity: 0;
  }
  .spec-card:hover {
    border-color: rgba(200,169,110,0.28);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.65),
      0 0 0 0.5px rgba(200,169,110,0.10),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* stagger */
  .spec-card:nth-child(1) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.38s forwards; }
  .spec-card:nth-child(2) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.46s forwards; }
  .spec-card:nth-child(3) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.54s forwards; }
  .spec-card:nth-child(4) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.62s forwards; }
  .spec-card:nth-child(5) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.70s forwards; }
  .spec-card:nth-child(6) { animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.78s forwards; }

  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.93) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Card inner */
  .spec-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: rgba(200,169,110,0.08);
    border: 0.5px solid rgba(200,169,110,0.16);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .spec-icon svg { width: 16px; height: 16px; }

  .spec-value {
    font-size: 28px;
    font-weight: 200;
    color: #e8e6e0;
    line-height: 1;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }
  .spec-value .unit {
    font-size: 14px;
    font-weight: 400;
    color: #c8a96e;
    letter-spacing: 0.02em;
  }
  .spec-value .val-main {
    font-size: 28px;
    font-weight: 100;
  }

  .spec-name {
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(232,230,224,0.55);
    margin-bottom: 5px;
    letter-spacing: 0.02em;
  }
  .spec-desc {
    font-size: 10.5px;
    color: rgba(106,106,122,0.65);
    line-height: 1.55;
    letter-spacing: 0.01em;
  }

  /* Accent corner */
  .card-accent {
    position: absolute;
    top: 0; right: 0;
    width: 50px; height: 50px;
    background: radial-gradient(circle at top right, rgba(200,169,110,0.06), transparent 70%);
    border-radius: 0 18px 0 0;
    pointer-events: none;
  }

  /* Bottom tagline */
  .spec-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: rgba(106,106,122,0.38);
    letter-spacing: 0.08em;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.90s forwards;
  }
</style>
</head>
<body>
<div class="spec-wrapper">
  <!-- Header -->
  <div class="spec-header">
    <div class="spec-eyebrow">技术规格</div>
    <div class="spec-brand">Evans</div>
    <div class="spec-subtitle">精工<em>·</em>克制<em>·</em>与你共生</div>
  </div>

  <!-- Divider -->
  <div class="spec-divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>

  <!-- Grid -->
  <div class="spec-grid">

    <!-- 1. 重量 -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="5.5" stroke="#c8a96e" stroke-width="1"/>
          <path d="M8 5v3.5l2 1.5" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
          <path d="M5.5 1.5h5" stroke="#c8a96e" stroke-width="0.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="spec-value">
        <span class="val-main">23</span><span class="unit">g</span>
      </div>
      <div class="spec-name">主体重量</div>
      <div class="spec-desc">轻如一枚硬币，忘记它的存在</div>
    </div>

    <!-- 2. IMU -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="4" y="4" width="8" height="8" rx="2" stroke="#c8a96e" stroke-width="1"/>
          <line x1="8" y1="1.5" x2="8" y2="4" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
          <line x1="8" y1="12" x2="8" y2="14.5" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
          <line x1="1.5" y1="8" x2="4" y2="8" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
          <line x1="12" y1="8" x2="14.5" y2="8" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="1.5" fill="rgba(200,169,110,0.35)"/>
        </svg>
      </div>
      <div class="spec-value">
        <span class="val-main" style="font-size:20px;letter-spacing:0;">六轴</span><span class="unit" style="font-size:13px;">IMU</span>
      </div>
      <div class="spec-name">惯性测量单元</div>
      <div class="spec-desc">三轴加速度 + 三轴陀螺仪，感知每一次运动</div>
    </div>

    <!-- 3. 麦克风 -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="6" y="2" width="4" height="7" rx="2" stroke="#c8a96e" stroke-width="1"/>
          <path d="M3.5 8.5A4.5 4.5 0 0 0 8 13a4.5 4.5 0 0 0 4.5-4.5" stroke="#c8a96e" stroke-width="1" stroke-linecap="round"/>
          <line x1="8" y1="13" x2="8" y2="15" stroke="#c8a96e" stroke-width="1" stroke-linecap="round"/>
          <line x1="5.5" y1="15" x2="10.5" y2="15" stroke="#c8a96e" stroke-width="0.9" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="spec-value">
        <span class="val-main">4</span><span class="unit" style="font-size:12px;"> mic</span>
      </div>
      <div class="spec-name">四麦克风阵列</div>
      <div class="spec-desc">全向拾音，噪声抑制，声纹识别</div>
    </div>

    <!-- 4. 生理传感 -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M2 8.5l2.5-4 2 3 2-5 2 7 1.5-3 1.5 2" stroke="#c8a96e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="spec-value" style="font-size:16px;font-weight:300;margin-bottom:6px;">
        <span style="font-size:16px;letter-spacing:0;">多模态</span>
      </div>
      <div class="spec-name">生理传感</div>
      <div class="spec-desc">心率 · 皮电 · 体温 · 血氧实时感知</div>
    </div>

    <!-- 5. NPU -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="4.5" y="4.5" width="7" height="7" rx="1.5" stroke="#c8a96e" stroke-width="1"/>
          <circle cx="8" cy="8" r="1.5" fill="rgba(200,169,110,0.40)"/>
          <path d="M2 6h2.5M2 8h2.5M2 10h2.5M11.5 6H14M11.5 8H14M11.5 10H14M6 2v2.5M8 2v2.5M10 2v2.5M6 11.5V14M8 11.5V14M10 11.5V14" stroke="#c8a96e" stroke-width="0.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="spec-value" style="font-size:16px;font-weight:300;margin-bottom:6px;">
        <span style="font-size:16px;letter-spacing:0.01em;">端侧NPU</span>
      </div>
      <div class="spec-name">低功耗神经处理器</div>
      <div class="spec-desc">本地推理，隐私优先，毫秒响应</div>
    </div>

    <!-- 6. 续航 -->
    <div class="spec-card">
      <div class="card-accent"></div>
      <div class="spec-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="2" y="5" width="11" height="6.5" rx="1.5" stroke="#c8a96e" stroke-width="1"/>
          <path d="M13 7.5v1.5" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="3.5" y="6.5" width="6" height="3.5" rx="1" fill="rgba(200,169,110,0.25)"/>
        </svg>
      </div>
      <div class="spec-value">
        <span class="val-main">36</span><span class="unit">h</span>
      </div>
      <div class="spec-name">综合续航</div>
      <div class="spec-desc">全天候陪伴，无间隙守护</div>
    </div>

  </div><!-- /grid -->

  <div class="spec-footer">All Day. Every Day.</div>
</div>
</body>
</html>

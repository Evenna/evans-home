<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-E · 防诈骗拦截 · Evans</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #07080a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse at center,
      rgba(200, 140, 60, 0.07) 0%,
      rgba(180, 110, 30, 0.04) 40%,
      transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card-wrapper {
    position: relative;
    z-index: 1;
    width: 360px;
    animation: cardEntrance 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(32px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .card {
    position: relative;
    background: rgba(18, 20, 26, 0.96);
    border-radius: 22px;
    border: 1px solid rgba(200, 140, 60, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 26px 24px 22px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 24px 64px rgba(0,0,0,0.76),
      0 2px 16px rgba(200,140,60,0.1),
      0 0 40px rgba(200,130,40,0.05);
  }

  /* 顶部琥珀光线 */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(200,140,60,0.4) 25%,
      rgba(220,160,70,0.85) 50%,
      rgba(200,140,60,0.4) 75%,
      transparent 100%);
  }

  .card::after {
    content: '';
    position: absolute;
    top: -50px; left: 50%;
    transform: translateX(-50%);
    width: 280px; height: 140px;
    background: radial-gradient(ellipse at center top, rgba(200,140,60,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  /* 警告头部 */
  .warn-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
  }

  .warn-icon-ring {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: rgba(200,140,60,0.1);
    border: 1.5px solid rgba(200,140,60,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 0 24px rgba(200,140,60,0.2);
  }

  /* 脉冲光环 */
  .warn-icon-ring::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(200,140,60,0.18);
    animation: pulseRing 2.4s ease-out infinite;
  }

  @keyframes pulseRing {
    0%   { transform: scale(1);    opacity: 0.6; }
    60%  { transform: scale(1.18); opacity: 0; }
    100% { transform: scale(1.18); opacity: 0; }
  }

  .warn-icon {
    font-size: 24px;
    line-height: 1;
  }

  .warn-label {
    font-size: 10.5px;
    font-weight: 500;
    color: rgba(200,140,60,0.75);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .warn-title {
    font-size: 15.5px;
    font-weight: 600;
    color: #e8e6e0;
    text-align: center;
    letter-spacing: -0.01em;
    line-height: 1.35;
  }

  /* 分割线 */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,140,60,0.18) 30%, rgba(200,140,60,0.18) 70%, transparent);
    margin-bottom: 18px;
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }

  /* 原因区 */
  .reason-section {
    margin-bottom: 16px;
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.28s both;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(200,140,60,0.6);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .reason-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .reason-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 13px;
    color: #c0bdb7;
    line-height: 1.45;
  }

  .reason-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(200,140,60,0.55);
    margin-top: 5px;
    flex-shrink: 0;
  }

  /* 信号指标 */
  .signal-section {
    margin-bottom: 20px;
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.38s both;
  }

  .signal-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .signal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(200,140,60,0.06);
    border-radius: 11px;
    border: 1px solid rgba(200,140,60,0.1);
  }

  .signal-icon {
    font-size: 13px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .signal-text {
    flex: 1;
    font-size: 12.5px;
    color: #b8b4ae;
    line-height: 1.3;
  }

  .signal-badge {
    font-size: 11px;
    font-weight: 600;
    color: rgba(200,140,60,0.9);
    background: rgba(200,140,60,0.12);
    border: 1px solid rgba(200,140,60,0.2);
    border-radius: 6px;
    padding: 2px 7px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .signal-badge.high {
    color: rgba(220,100,50,0.9);
    background: rgba(220,100,50,0.1);
    border-color: rgba(220,100,50,0.2);
  }

  /* 按钮区 */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 9px;
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
  }

  .btn {
    width: 100%;
    padding: 13px 16px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .btn:active { transform: scale(0.97); opacity: 0.85; }

  .btn-primary {
    background: linear-gradient(135deg, rgba(200,140,60,0.28) 0%, rgba(180,120,40,0.22) 100%);
    color: #e8c87a;
    border: 1px solid rgba(200,140,60,0.35);
    box-shadow: 0 2px 12px rgba(200,140,60,0.15);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.04);
    color: #6a6a7a;
    border: 1px solid rgba(255,255,255,0.08);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <div class="warn-header">
      <div class="warn-icon-ring">
        <span class="warn-icon">⚠️</span>
      </div>
      <div class="warn-label">Evans · 注意</div>
      <div class="warn-title">检测到可疑转账请求</div>
    </div>

    <div class="divider"></div>

    <div class="reason-section">
      <div class="section-label">触发原因</div>
      <div class="reason-list">
        <div class="reason-item">
          <div class="reason-dot"></div>
          <span>对方要求<strong style="color:#d4b87a;">立即</strong>转账，不给思考时间</span>
        </div>
        <div class="reason-item">
          <div class="reason-dot"></div>
          <span>对方<strong style="color:#d4b87a;">强调不要告诉家人</strong>，要求保密</span>
        </div>
      </div>
    </div>

    <div class="signal-section">
      <div class="section-label">风险信号</div>
      <div class="signal-list">
        <div class="signal-item">
          <span class="signal-icon">📵</span>
          <span class="signal-text">号码从未出现在联系人中</span>
          <span class="signal-badge">未知号码</span>
        </div>
        <div class="signal-item">
          <span class="signal-icon">🎙️</span>
          <span class="signal-text">通话语速异常，高于正常 40%</span>
          <span class="signal-badge">语速异常</span>
        </div>
        <div class="signal-item">
          <span class="signal-icon">🧩</span>
          <span class="signal-text">话术特征匹配诈骗剧本库</span>
          <span class="signal-badge high">匹配 94%</span>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary">先不转，打给儿子确认</button>
      <button class="btn btn-secondary">我了解，继续</button>
    </div>

  </div>
</div>

</body>
</html>

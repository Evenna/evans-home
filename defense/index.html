<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVANS · 毕业答辩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #07080c;
    --surface: #0d0f15;
    --card:    #111419;
    --border:  rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.12);
    --txt:     #eeeef0;
    --txt2:    #6b7280;
    --txt3:    #3a3e47;
    --blue:    #0a84ff;
    --cyan:    #00c7ff;
    --green:   #30d158;
    --orange:  #ff9f0a;
    --purple:  #bf5af2;
    --blue-glow: rgba(10,132,255,0.15);
    --cyan-glow: rgba(0,199,255,0.12);
  }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overflow-y: scroll;
    height: 100%;
    background: var(--bg);
    color: var(--txt);
    font-family: 'Inter', -apple-system, sans-serif;
    font-feature-settings: "cv01","ss03";
    -webkit-font-smoothing: antialiased;
  }

  body { height: 100%; }

  #deck {
    width: 100%;
    height: 100%;
  }

  .slide {
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16/9;
  }

  /* ── Nav ── */
  #nav {
    position: fixed;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--txt3);
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.active {
    background: var(--blue);
    box-shadow: 0 0 8px var(--blue);
    transform: scale(1.4);
  }

  #counter {
    position: fixed;
    bottom: 24px;
    right: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--txt3);
    z-index: 100;
    letter-spacing: 0.05em;
  }

  /* ── Shared slide inner ── */
  .slide-inner {
    width: 100%;
    height: 100%;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  /* ── Ambient glows ── */
  .glow-tl {
    position: absolute;
    top: -120px; left: -120px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-br {
    position: absolute;
    bottom: -120px; right: -80px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, var(--blue-glow) 0%, transparent 65%);
    pointer-events: none;
  }

  /* ── Chapter tag ── */
  .chapter-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--txt3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chapter-tag::before {
    content: '';
    display: block;
    width: 2px;
    height: 12px;
    background: var(--blue);
  }

  /* ── Typography ── */
  .slide-title {
    font-size: clamp(32px, 3.2vw, 52px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--txt);
    margin-bottom: 14px;
  }
  .slide-sub {
    font-size: 14px;
    color: var(--txt2);
    letter-spacing: 0.02em;
    margin-bottom: 48px;
    font-weight: 400;
  }

  /* ── Glass card ── */
  .card {
    background: rgba(255,255,255,0.025);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    backdrop-filter: blur(20px);
  }
  .card-accent {
    border-top: 1.5px solid var(--blue);
  }
  .card-cyan { border-top: 1.5px solid var(--cyan); }
  .card-green { border-top: 1.5px solid var(--green); }
  .card-orange { border-top: 1.5px solid var(--orange); }
  .card-purple { border-top: 1.5px solid var(--purple); }

  /* ── Hairline ── */
  .hr {
    width: 100%;
    height: 0.5px;
    background: var(--border);
    margin: 24px 0;
  }

  /* ── Star canvas ── */
  .star-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.6;
  }

  /* ── Noise overlay ── */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.4;
  }

  /* ── Mono label ── */
  .mono { font-family: 'JetBrains Mono', monospace; }
  .accent { color: var(--blue); }
  .cyan   { color: var(--cyan); }
  .green  { color: var(--green); }
  .orange { color: var(--orange); }
  .purple { color: var(--purple); }
  .muted  { color: var(--txt2); }
  .dim    { color: var(--txt3); }

  /* ── Stat block ── */
  .stat-num {
    font-size: clamp(36px, 3.6vw, 56px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .stat-label {
    font-size: 12px;
    color: var(--txt2);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* ── Badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 0.5px solid currentColor;
  }
  .badge-blue  { color: var(--blue);   background: rgba(10,132,255,0.10); }
  .badge-cyan  { color: var(--cyan);   background: rgba(0,199,255,0.10); }
  .badge-green { color: var(--green);  background: rgba(48,209,88,0.10); }
  .badge-orange{ color: var(--orange); background: rgba(255,159,10,0.10); }
  .badge-purple{ color: var(--purple); background: rgba(191,90,242,0.10); }

  /* ── Node dot ── */
  .node {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Glow node (knowledge graph) ── */
  .knode {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .knode-dot {
    border-radius: 50%;
    position: relative;
  }
  .knode-dot::before {
    content: '';
    position: absolute;
    inset: -100%;
    border-radius: 50%;
    background: radial-gradient(circle, currentColor 0%, transparent 70%);
    opacity: 0.18;
  }
  .knode-dot::after {
    content: '';
    position: absolute;
    inset: -50%;
    border-radius: 50%;
    background: radial-gradient(circle, currentColor 0%, transparent 70%);
    opacity: 0.12;
  }
  .knode-label {
    font-size: 10px;
    color: var(--txt2);
    text-align: center;
    white-space: nowrap;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div id="deck"></div>

<!-- Nav dots -->
<div id="nav"></div>
<div id="counter">01 / 17</div>

<script src="slides.js"></script>
<script src="slides2.js"></script>
</body>
</html>
